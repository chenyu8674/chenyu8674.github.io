<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 世界杯预测</title>
    <link rel="preconnect" href="https://flagcdn.com">
    <style>
*,
*::before,
*::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #f0f2f5;
    --surface: #ffffff;
    --border: #e2e6ea;
    --border-strong: #c8ced6;
    --border-panel: #a8b2be;
    --border-card: #b4beca;
    --text: #1a1f2e;
    --text-muted: #6b7280;
    --primary: #006633;
    --primary-light: #e8f5ee;
    --gold: #d4a017;
    --silver: #8b9aab;
    --bronze: #b87333;
    --win: #e53935;
    --shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    --radius: 10px;
    --team-h: 52px;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
}

.hidden {
    display: none !important;
}

/* Header */
.header {
    background: linear-gradient(135deg, #004d26 0%, #006633 50%, #008844 100%);
    color: #fff;
    padding: 16px 24px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
}

.header-inner {
    max-width: 1600px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
}

.logo-area {
    display: flex;
    align-items: center;
    gap: 12px;
}

.trophy {
    font-size: 2rem;
}

.header h1 {
    font-size: 1.35rem;
    font-weight: 700;
}

.subtitle {
    font-size: 0.82rem;
    opacity: 0.85;
    margin-top: 2px;
}

.header-actions {
    display: flex;
    align-items: center;
    gap: 12px;
}

.btn-tip {
    position: relative;
}

.btn-tip::after {
    content: attr(data-tip);
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    width: max-content;
    max-width: 240px;
    padding: 8px 10px;
    background: rgba(0, 0, 0, 0.88);
    color: #fff;
    font-size: 0.72rem;
    font-weight: 400;
    line-height: 1.45;
    border-radius: 8px;
    white-space: normal;
    text-align: left;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.15s, visibility 0.15s;
    z-index: 200;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
}

.btn-tip:hover::after,
.btn-tip:focus-visible::after {
    opacity: 1;
    visibility: visible;
}

/* Buttons */
.btn {
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
}

.btn-primary {
    background: var(--primary);
    color: #fff;
}

.btn-secondary {
    background: #fff;
    color: var(--text);
    border: 1px solid var(--border-strong);
}

.btn-secondary:hover {
    background: #f7f8fa;
}

.btn-primary:hover:not(:disabled) {
    background: #005528;
}

.btn-primary:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

.btn-ghost {
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.25);
}

.btn-ghost:hover {
    background: rgba(255, 255, 255, 0.22);
}

/* Main layout */
.main {
    max-width: 1600px;
    margin: 0 auto;
    padding: 10px;
}

.panel {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
}

.panel-header {
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
}

.panel-header h2 {
    font-size: 1.05rem;
    margin-bottom: 6px;
}

.hint {
    font-size: 0.78rem;
    color: var(--text-muted);
}

.status-text {
    font-size: 0.82rem;
    margin-top: 8px;
    color: var(--primary);
    font-weight: 500;
}

.progress-bar-wrap {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin-top: 10px;
    overflow: hidden;
}

.progress-bar-fill {
    height: 100%;
    background: var(--primary);
    border-radius: 2px;
    width: 0%;
    transition: width 0.3s;
}

/* Groups */
.groups-panel {
    padding-bottom: 18px;
    border-color: var(--border-panel);
}

.groups-panel .group-card {
    border-color: var(--border-card);
}

.groups-panel .group-title,
.groups-panel .team-row {
    border-color: var(--border-card);
}

.third-place-section .third-slot-item {
    border-color: var(--border-card);
}

.step-nav {
    display: flex;
    align-items: center;
    gap: 0;
    margin: 12px 0 8px;
    flex-wrap: wrap;
}

.step-item {
    display: flex;
    align-items: center;
    font-size: 0.75rem;
    color: var(--text-muted);
    white-space: nowrap;
}

.step-item.done {
    color: var(--primary);
}

.step-label {
    font-weight: 500;
    padding: 2px 0;
    border-radius: 999px;
    transition: background 0.15s, color 0.15s;
}

.step-item.active .step-label {
    background: var(--primary);
    color: #fff;
    font-weight: 700;
    padding: 4px 12px;
}

.step-item.done .step-label {
    color: var(--primary);
}

.step-arrow {
    display: flex;
    align-items: center;
    padding: 0 6px;
    font-size: 0.85rem;
    color: #004d26;
    flex-shrink: 0;
    line-height: 1;
    user-select: none;
}

.step-actions {
    display: flex;
    gap: 8px;
    padding: 12px 12px 0;
}

.step-actions .btn {
    flex: 1;
}

.team-row.locked {
    cursor: default;
}

.group-card.readonly .team-row {
    cursor: default;
}

.third-place-section:not(.hidden) + .groups-grid {
    max-height: calc(100vh - 420px);
}

.groups-grid {
    padding: 10px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    max-height: calc(100vh - 320px);
    overflow-y: auto;
}

.groups-grid .group-title {
    padding: 5px 6px;
    font-size: 0.72rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.groups-grid .team-row {
    gap: 5px;
    padding: 5px 6px;
}

.groups-grid .flag-sm {
    width: 20px;
    height: 14px;
}

.groups-grid .team-name {
    font-size: 0.71rem;
}

.groups-grid .rank-badge {
    font-size: 0.6rem;
    padding: 1px 4px;
}

.group-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
}

.group-title {
    background: #f7f8fa;
    padding: 6px 10px;
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
}

.group-teams {
    display: flex;
    flex-direction: column;
}

.team-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    transition: background 0.12s;
    user-select: none;
}

.team-row:last-child {
    border-bottom: none;
}

.team-row:hover {
    background: #f7f9fb;
}

.team-row.rank-1 {
    background: #fffbeb;
    border-left: 3px solid var(--gold);
}

.team-row.rank-2 {
    background: #f8fafc;
    border-left: 3px solid var(--silver);
}

.team-row.rank-3 {
    background: #fdf8f3;
    border-left: 3px solid var(--bronze);
}

.team-row.rank-out {
    opacity: 0.55;
}

.team-row.unpickable {
    opacity: 0.45;
    cursor: not-allowed;
}

.team-row.unpickable:hover {
    background: transparent;
}

.flag-sm {
    width: 24px;
    height: 16px;
    object-fit: cover;
    border-radius: 2px;
    border: 1px solid var(--border);
    flex-shrink: 0;
}

.team-name {
    flex: 1;
    font-size: 0.82rem;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.rank-badge {
    font-size: 0.68rem;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 4px;
    flex-shrink: 0;
}

.rank-badge.r1 { background: #fef3c7; color: #92400e; }
.rank-badge.r2 { background: #e2e8f0; color: #475569; }
.rank-badge.r3 { background: #fde8d8; color: #9a3412; }
.rank-badge.rout { background: #f1f5f9; color: #94a3b8; }
.rank-badge.is-empty {
    background: transparent;
    padding: 2px 0;
    min-width: 1.5em;
}

/* Third place */
.third-place-section {
    padding: 0 12px;
    margin-top: 4px;
}

.third-place-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.third-slot-progress {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(4, auto);
    gap: 4px;
}

.third-slot-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 6px;
    border-radius: 6px;
    font-size: 0.68rem;
    color: var(--text-muted);
    border: 1px solid var(--border);
    background: #fafbfc;
    min-width: 0;
}

.third-slot-item > span:last-child {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.third-slot-item .slot-num {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--border);
    color: var(--text-muted);
    font-size: 0.65rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.third-slot-item.done {
    color: var(--primary);
    background: var(--primary-light);
    border-color: var(--primary);
}

.third-slot-item.done .slot-num {
    background: var(--primary);
    color: #fff;
}

.third-slot-item.active {
    color: #92400e;
    background: #fffbeb;
    border-color: var(--gold);
    font-weight: 600;
}

.third-slot-item.active .slot-num {
    background: var(--gold);
    color: #fff;
}

/* Bracket */
.bracket-panel {
    min-height: 0;
    max-height: calc(100vh - 88px);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    border-color: var(--border-panel);
}

.bracket-panel .match-card:not(.final-card):not(.third-place-card) {
    border-color: var(--border-card);
}

.bracket-panel .match-team + .match-team,
.bracket-panel .final-trophy,
.bracket-panel .third-place-trophy {
    border-color: var(--border-card);
}

.bracket-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    min-height: 0;
    padding: 20px;
    color: var(--text-muted);
    text-align: center;
}

.empty-icon {
    font-size: 3rem;
    margin-bottom: 12px;
    opacity: 0.4;
}

.bracket-wrap {
    flex: 1;
    padding: 16px 16px 0 16px;
    overflow: auto;
    min-height: 0;
}

.bracket-flow {
    --col-gap: 24px;
    display: flex;
    flex-direction: row;
    align-items: stretch;
    gap: var(--col-gap);
    min-width: calc(128px * 5 + var(--col-gap) * 4);
    min-height: calc(var(--bracket-rows, 16) * var(--bracket-row-h, 68px) + 28px);
}

.bracket-col {
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    position: relative;
    width: 128px;
    overflow: visible;
}

.bracket-col:not(:last-child)::after {
    content: '';
    position: absolute;
    right: calc(var(--col-gap, 24px) / -2 - 0.5px);
    top: calc(28px + var(--vline-top, calc(var(--bracket-row-h, 68px) / 2)) - 3px);
    height: var(--vline-height, calc((var(--bracket-rows, 16) - 1) * var(--bracket-row-h, 68px)));
    width: 1px;
    background: var(--border-strong);
    z-index: 0;
}

.bracket-col .round-label {
    flex-shrink: 0;
    padding: 0 6px 6px;
    text-align: center;
}

.podium-col-label {
    display: flex;
    flex-direction: column;
    gap: 2px;
    line-height: 1.3;
}

.bracket-slot-podium {
    align-items: center;
}

.bracket-slot-podium-stack {
    justify-content: center;
    align-items: center;
}

.podium-stack {
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: center;
}

.bracket-slots {
    flex: 1;
    display: grid;
    grid-template-rows: repeat(var(--bracket-rows), var(--bracket-row-h, 68px));
    gap: 0;
    --slot-pad-x: 4px;
    padding: 0 var(--slot-pad-x);
    position: relative;
    overflow: visible;
}

.bracket-slot {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    min-height: 0;
    padding: 1px 0;
    box-sizing: border-box;
    overflow: visible;
}

.bracket-col:not(:last-child) .bracket-slot::after {
    content: '';
    position: absolute;
    top: 50%;
    right: calc(var(--col-gap, 24px) / -2 - var(--slot-pad-x, 4px));
    width: calc(var(--col-gap, 24px) / 2 + var(--slot-pad-x, 4px));
    height: 1px;
    background: var(--border-strong);
    z-index: 1;
}

.bracket-col:not(:first-child) .bracket-slot::before {
    content: '';
    position: absolute;
    top: 50%;
    left: calc(var(--col-gap, 24px) / -2 - var(--slot-pad-x, 4px));
    width: calc(var(--col-gap, 24px) / 2 + var(--slot-pad-x, 4px));
    height: 1px;
    background: var(--border-strong);
    z-index: 1;
}

.bracket-col:last-child .bracket-slot::after {
    display: none;
}

.round-label {
    font-size: 0.62rem;
    color: var(--text-muted);
    text-align: center;
    margin-bottom: 4px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
}

/* Match card */
.match-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    width: 100%;
    max-width: 120px;
    overflow: hidden;
    position: relative;
    box-shadow: var(--shadow);
    margin: 0;
    display: flex;
    flex-direction: column;
}

.match-card.final-card,
.match-card.third-place-card {
    width: 128px;
    max-width: 128px;
    min-height: 86px;
}

.match-card.final-card {
    border-color: var(--gold);
    box-shadow: 0 4px 16px rgba(212, 160, 23, 0.2);
}

.match-card.third-place-card {
    border-color: #c4956a;
    box-shadow: 0 2px 10px rgba(196, 149, 106, 0.18);
}

.final-trophy,
.third-place-trophy {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 26px;
    text-align: center;
    font-size: 1.1rem;
    padding: 4px;
    border-bottom: 1px solid var(--border);
}

.third-place-trophy {
    background: linear-gradient(180deg, #fdf6ef, #fff);
}

.final-trophy {
    background: linear-gradient(180deg, #fffbeb, #fff);
}

.win-badge.third-badge {
    background: #c4956a;
}

.win-badge.second-badge {
    background: #8a96a8;
}

.match-team {
    display: flex;
    flex-direction: row;
    align-items: center;
    padding: 3px 6px;
    cursor: pointer;
    transition: background 0.12s;
    position: relative;
    min-height: 28px;
    flex: 1;
    justify-content: flex-start;
    gap: 4px;
}

.match-card.final-card .match-team,
.match-card.third-place-card .match-team {
    flex: 1 1 0;
}

.match-team + .match-team {
    border-top: 1px solid var(--border);
}

.match-team:hover:not(.empty):not(.locked) {
    background: #f0f7f4;
}

.match-team.winner {
    background: var(--primary-light);
}

.match-team.loser {
    opacity: 0.45;
}

.match-team.empty {
    cursor: default;
    color: var(--text-muted);
    font-size: 0.72rem;
    justify-content: center;
}

.match-team.slot-active {
    background: #fffbeb;
    color: #92400e;
    font-weight: 600;
    box-shadow: inset 0 0 0 2px var(--gold);
}

.match-team.slot-filled {
    background: var(--primary-light);
}

.match-team.locked {
    cursor: default;
}

.match-team .flag-md {
    width: 20px;
    height: 14px;
    object-fit: cover;
    border-radius: 2px;
    border: 1px solid var(--border);
    flex-shrink: 0;
}

.match-team .team-label {
    font-size: 0.64rem;
    font-weight: 600;
    text-align: left;
    line-height: 1.2;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.win-badge {
    position: absolute;
    top: 2px;
    right: 2px;
    background: var(--win);
    color: #fff;
    font-size: 0.55rem;
    font-weight: 800;
    padding: 1px 4px;
    border-radius: 3px;
    letter-spacing: 0.05em;
}

.match-divider {
    text-align: center;
    font-size: 0.65rem;
    color: var(--text-muted);
    padding: 2px;
    background: #fafbfc;
}


/* Team tooltip */
.team-tooltip {
    position: fixed;
    z-index: 1000;
    width: 260px;
    max-width: calc(100vw - 24px);
    background: #fff;
    border: 1px solid var(--border-card);
    border-radius: 10px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.14);
    padding: 10px 12px;
    pointer-events: none;
    font-size: 0.72rem;
    line-height: 1.45;
}

.team-tooltip.hidden {
    display: none !important;
}

.team-tooltip-backdrop {
    position: fixed;
    inset: 0;
    z-index: 999;
    background: rgba(0, 0, 0, 0.45);
    -webkit-tap-highlight-color: transparent;
}

.team-tooltip-backdrop.hidden {
    display: none !important;
}

.team-tooltip.is-panel {
    left: 50% !important;
    top: auto !important;
    bottom: 0;
    transform: translateX(-50%);
    width: min(100vw, 420px);
    max-height: 78vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    pointer-events: auto;
    border-radius: 14px 14px 0 0;
    z-index: 1001;
    padding-top: 34px;
}

.tooltip-close {
    position: absolute;
    top: 6px;
    right: 8px;
    width: 28px;
    height: 28px;
    border: none;
    border-radius: 50%;
    background: #f0f2f5;
    color: var(--text-muted);
    font-size: 1.1rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
}

.team-info-btn {
    display: none;
    flex-shrink: 0;
    border: none;
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 0.58rem;
    font-weight: 600;
    color: var(--primary);
    background: var(--primary-light);
    cursor: pointer;
    line-height: 1.4;
    -webkit-tap-highlight-color: transparent;
}

@media (hover: none), (pointer: coarse) {
    .team-info-btn {
        display: inline-flex;
        align-items: center;
    }
}

.tooltip-header {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 0.82rem;
    margin-bottom: 8px;
    color: var(--text);
}

.tooltip-header img {
    width: 22px;
    height: 15px;
    object-fit: cover;
    border-radius: 2px;
    border: 1px solid var(--border);
}

.tooltip-overall-wrap {
    margin-left: auto;
    text-align: right;
    flex-shrink: 0;
}

.tooltip-overall {
    font-size: 1.05rem;
    font-weight: 800;
    color: var(--primary);
    line-height: 1;
}

.tooltip-overall-label {
    display: block;
    font-size: 0.58rem;
    font-weight: 600;
    color: var(--text-muted);
    margin-top: 2px;
}

.tooltip-style {
    font-size: 0.66rem;
    color: var(--text-muted);
    line-height: 1.5;
    margin-bottom: 8px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
}

.tooltip-ratings {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-bottom: 8px;
}

.rating-row {
    display: grid;
    grid-template-columns: 32px 1fr 24px;
    align-items: center;
    gap: 6px;
    font-size: 0.68rem;
    color: var(--text-muted);
}

.rating-row span:last-child {
    text-align: right;
    font-weight: 700;
    color: var(--primary);
}

.rating-bar {
    height: 6px;
    background: #eef1f4;
    border-radius: 999px;
    overflow: hidden;
}

.rating-bar i {
    display: block;
    height: 100%;
    background: linear-gradient(90deg, #008844, #006633);

    <script>
const STAGE_LABELS = {
    r32: '32强',
    r16: '16强',
    qf: '8强',
    sf: '4强',
    thirdPlace: '季军战',
    final: '决赛'
}

const BRACKET_ROWS = 16
const BRACKET_ROW_H = 68

const BRACKET_ORDER = {
    r32: [
        'm73', 'm75', 'm74', 'm77', 'm76', 'm78', 'm79', 'm80',
        'm83', 'm84', 'm81', 'm82', 'm86', 'm88', 'm85', 'm87'
    ],
    r16: ['m90', 'm89', 'm91', 'm92', 'm93', 'm94', 'm95', 'm96'],
    qf: ['m97', 'm99', 'm98', 'm100'],
    sf: ['m101', 'm102'],
    final: ['m104']
}

const KNOCKOUT_MATCH_ORDER = [
    ...BRACKET_ORDER.r32,
    ...BRACKET_ORDER.r16,
    ...BRACKET_ORDER.qf,
    ...BRACKET_ORDER.sf
]

const ELO_RATING_FACTOR = 20
const ELO_SCALE_KNOCKOUT = 300

let data = null
let winners = {}
let teamProfilesData = null
let groupStageData = null
let oddsData = null
let tooltipEl = null
let tooltipBackdropEl = null
let tooltipAnchor = null
let tooltipContext = null

function isTouchUI() {
    return window.matchMedia('(hover: none)').matches
        || window.matchMedia('(pointer: coarse)').matches
}

function init() {
    data = JSON.parse(document.getElementById('worldcup-data').textContent)
    teamProfilesData = JSON.parse(document.getElementById('team-profiles-data').textContent)
    groupStageData = JSON.parse(document.getElementById('group-stage-data').textContent)
    oddsData = JSON.parse(document.getElementById('betting-odds-data').textContent)
    tooltipEl = document.getElementById('team-tooltip')
    tooltipBackdropEl = document.getElementById('team-tooltip-backdrop')
    initMeta()
    initCompletedResults()
    bindGlobalEvents()
    bindTooltipPanel()
    renderBracket()
    fetchLatestOdds()
}

function bindTooltipPanel() {
    tooltipBackdropEl?.addEventListener('click', hideTeamTooltip)
    tooltipBackdropEl?.addEventListener('touchend', (e) => {
        if (e.target === tooltipBackdropEl) hideTeamTooltip()
    })

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') hideTeamTooltip()
    })
}

async function fetchLatestOdds() {
    try {
        const res = await fetch(`odds.json?t=${Date.now()}`)
        if (!res.ok) return
        const fetched = await res.json()
        if (fetched?.matches) {
            oddsData = {
                ...oddsData,
                meta: { ...oddsData.meta, ...fetched.meta },
                matches: { ...oddsData.matches, ...fetched.matches }
            }
            if (tooltipAnchor && tooltipContext) {
                showTeamTooltip(tooltipAnchor, tooltipContext.teamId, tooltipContext.matchId)
            }
        }
    } catch (_) {}
}

function initMeta() {
    document.getElementById('tournament-name').textContent = data.meta.name
    const knockoutStages = data.format.knockout.stageLabels
        || ['32强', '16强', '8强', '4强', '季军战', '决赛']
    document.getElementById('tournament-desc').textContent =
        `${data.meta.host.join(' · ')} | 小组赛已结束 · ${knockoutStages.join(' → ')}`
}

function initCompletedResults() {
    data.roundOf32.forEach(match => {
        if (match.result?.winnerId) {
            winners[match.id] = match.result.winnerId
        }
    })
}

function getTeam(id) {
    return data.teams.find(t => t.id === id)
}

function getTeamProfile(teamId) {
    return teamProfilesData?.teams?.[teamId] || null
}

function getTeamGroupStage(teamId) {
    return groupStageData?.teams?.[teamId] || null
}

function getTeamOverallScore(teamId) {
    const profile = getTeamProfile(teamId)
    if (!profile) return 50
    if (profile.overall != null) return profile.overall
    return Math.round((profile.attack + profile.midfield + profile.defense) / 3)
}

function renderRatingRow(label, value) {
    return `<div class="rating-row"><span>${label}</span><div class="rating-bar"><i style="width:${value}%"></i></div><span>${value}</span></div>`
}

function renderGroupStageSection(teamId) {
    const gs = getTeamGroupStage(teamId)
    if (!gs) return ''

    const gdText = gs.gd > 0 ? `+${gs.gd}` : String(gs.gd)
    return `
        <div class="tooltip-group">
            <div class="tooltip-group-title">${gs.groupName} · ${gs.rankLabel}</div>
            <div class="tooltip-group-stats">${gs.played} 场 ${gs.won} 胜 ${gs.drawn} 平 ${gs.lost} 负 · 进 ${gs.gf} 失 ${gs.ga}（净胜 ${gdText}）· ${gs.points} 分</div>
            <div class="tooltip-group-record">
                <span>胜 ${gs.won}</span>
                <span>平 ${gs.drawn}</span>
                <span>负 ${gs.lost}</span>
                <span>积分 ${gs.points}</span>
            </div>
        </div>
    `
}

function americanToImplied(american) {
    if (american == null) return null
    if (american > 0) return 100 / (american + 100)
    return Math.abs(american) / (Math.abs(american) + 100)
}

function americanToDecimal(american) {
    if (american == null) return null
    if (american > 0) return 1 + american / 100
    return 1 + 100 / Math.abs(american)
}

function normalizeTwoWay(homeAmerican, awayAmerican) {
    const h = americanToImplied(homeAmerican)
    const a = americanToImplied(awayAmerican)
    if (h == null || a == null) return null
    const total = h + a
    return { home: h / total, away: a / total }
}

function normalizeThreeWay(homeAmerican, drawAmerican, awayAmerican) {
    const h = americanToImplied(homeAmerican)
    const d = americanToImplied(drawAmerican)
    const a = americanToImplied(awayAmerican)
    if (h == null || d == null || a == null) return null
    const total = h + d + a
    return { home: h / total, draw: d / total, away: a / total }
}

function formatPct(prob) {
    if (prob == null) return '—'
    return `${(prob * 100).toFixed(1)}%`
}

function formatDecimalOdds(american) {
    const dec = americanToDecimal(american)
    if (dec == null) return '—'
    return dec.toFixed(2)
}

function getMatchOdds(matchId) {
    return oddsData?.matches?.[matchId] || null
}

function getTeamOddsSide(matchId, teamId) {
    const { home, away } = getMatchTeams(matchId)
    if (!home || !away) return null
    if (teamId === home.id) return 'home'
    if (teamId === away.id) return 'away'
    return null
}

function getOddsProbabilities(matchId) {
    const odds = getMatchOdds(matchId)
    if (!odds) return null

    const advance = odds.advance
        ? normalizeTwoWay(odds.advance.home, odds.advance.away)
        : null
    const moneyline = odds.moneyline
        ? normalizeThreeWay(odds.moneyline.home, odds.moneyline.draw, odds.moneyline.away)
        : null

    return { advance, moneyline, raw: odds }
}

function renderOddsSection(teamId, matchId) {
    if (!matchId) {
        return '<div class="tooltip-odds"><div class="tooltip-odds-empty">暂无本场盘口数据</div></div>'
    }

    const side = getTeamOddsSide(matchId, teamId)
    const probs = getOddsProbabilities(matchId)
    const { home, away } = getMatchTeams(matchId)

    if (!side || !probs || !home || !away) {
        return '<div class="tooltip-odds"><div class="tooltip-odds-empty">暂无本场盘口数据</div></div>'
    }

    const advancePct = probs.advance?.[side]
    const win90Pct = probs.moneyline?.[side]
    const drawPct = probs.moneyline?.draw
    const opponent = side === 'home' ? away : home
    const opponentSide = side === 'home' ? 'away' : 'home'
    const opponentAdvancePct = probs.advance?.[opponentSide]
    const rawSide = probs.raw.advance?.[side] ?? probs.raw.moneyline?.[side]
    const source = oddsData?.meta?.source || '参考盘口'
    const fetchedAt = oddsData?.meta?.fetchedAt || ''

    return `
        <div class="tooltip-odds">
            <div class="tooltip-odds-title">盘口预测 · vs ${opponent.name}</div>
            <div class="tooltip-odds-main">
                <span class="tooltip-odds-pct">${formatPct(advancePct)}</span>
                <span class="tooltip-odds-label">晋级胜率（含加时/点球）</span>
            </div>
            <div class="tooltip-odds-bar"><i style="width:${Math.round((advancePct || 0) * 100)}%"></i></div>
            <div class="tooltip-odds-sub">
                90 分钟胜 ${formatPct(win90Pct)} · 平 ${formatPct(drawPct)} · 对手晋级 ${formatPct(opponentAdvancePct)}
            </div>
            <div class="tooltip-odds-sub">欧赔 ${formatDecimalOdds(rawSide)} · ${source}${fetchedAt ? ` · ${fetchedAt}` : ''}</div>
        </div>
    `
}

function showTeamTooltip(el, teamId, matchId, asPanel) {
    const team = getTeam(teamId)
    const profile = getTeamProfile(teamId)
    if (!team || !profile || !tooltipEl) return

    const usePanel = asPanel || isTouchUI()
    tooltipAnchor = el
    tooltipContext = { teamId, matchId }
    const overall = profile.overall ?? Math.round((profile.attack + profile.midfield + profile.defense) / 3)
    const styleText = profile.style || ''
    const closeBtn = usePanel
        ? '<button type="button" class="tooltip-close" aria-label="关闭">×</button>'
        : ''
    tooltipEl.innerHTML = `
        ${closeBtn}
        <div class="tooltip-header">
            <img src="${flagUrl(team)}" alt="">
            <span>${team.name}</span>
            <div class="tooltip-overall-wrap">
                <span class="tooltip-overall">${overall}</span>
                <span class="tooltip-overall-label">整体</span>
            </div>
        </div>
        ${renderOddsSection(teamId, matchId)}
        ${renderGroupStageSection(teamId)}
        ${styleText ? `<div class="tooltip-style">${styleText}</div>` : ''}
        <div class="tooltip-ratings">
            ${renderRatingRow('前场', profile.attack)}
            ${renderRatingRow('中场', profile.midfield)}
            ${renderRatingRow('后场', profile.defense)}
        </div>
        <div class="tooltip-stars">
            ${profile.stars.slice(0, 3).map(star => `
                <div class="tooltip-star">
                    <span class="tooltip-star-name">${star.name}</span>
                    <span class="tooltip-star-role">${star.role}</span>
                    <span class="tooltip-star-desc">${star.desc}</span>
                </div>
            `).join('')}
        </div>
    `
    tooltipEl.classList.toggle('is-panel', usePanel)
    tooltipEl.classList.remove('hidden')
    tooltipEl.setAttribute('aria-hidden', 'false')
    if (usePanel && tooltipBackdropEl) {
        tooltipBackdropEl.classList.remove('hidden')
        tooltipBackdropEl.setAttribute('aria-hidden', 'false')
        document.body.style.overflow = 'hidden'
        tooltipEl.querySelector('.tooltip-close')?.addEventListener('click', (e) => {
            e.stopPropagation()
            hideTeamTooltip()
        })
    }
    positionTeamTooltip()
}

function hideTeamTooltip() {
    tooltipAnchor = null
    tooltipContext = null
    if (!tooltipEl) return
    tooltipEl.classList.add('hidden')
    tooltipEl.classList.remove('is-panel')
    tooltipEl.setAttribute('aria-hidden', 'true')
    if (tooltipBackdropEl) {
        tooltipBackdropEl.classList.add('hidden')
        tooltipBackdropEl.setAttribute('aria-hidden', 'true')
    }
    document.body.style.overflow = ''
}

function positionTeamTooltip() {
    if (!tooltipEl || !tooltipAnchor) return
    if (tooltipEl.classList.contains('is-panel')) return

    const rect = tooltipAnchor.getBoundingClientRect()
    const tipRect = tooltipEl.getBoundingClientRect()
    const gap = 8
    let left = rect.right + gap
    let top = rect.top + rect.height / 2 - tipRect.height / 2

    if (left + tipRect.width > window.innerWidth - 12) {
        left = rect.left - tipRect.width - gap
    }
    if (top < 12) top = 12
    if (top + tipRect.height > window.innerHeight - 12) {
        top = window.innerHeight - tipRect.height - 12
    }
    if (left < 12) left = 12

    tooltipEl.style.left = `${left}px`
    tooltipEl.style.top = `${top}px`
}

function attachTeamTooltip(el, teamId, matchId) {
    if (!teamId || !getTeamProfile(teamId)) return
    el.classList.add('has-team-tooltip')

    if (isTouchUI()) {
        const btn = el.querySelector('.team-info-btn')
        if (btn) {
            btn.addEventListener('click', (e) => {
                e.stopPropagation()
                e.preventDefault()
                showTeamTooltip(el, teamId, matchId, true)
            })
        }
        return
    }

    el.addEventListener('mouseenter', () => showTeamTooltip(el, teamId, matchId, false))
    el.addEventListener('mouseleave', hideTeamTooltip)
}

if (!window.__teamTooltipBound) {
    window.__teamTooltipBound = true
    window.addEventListener('scroll', () => {
        if (tooltipAnchor) positionTeamTooltip()
    }, true)
    window.addEventListener('resize', () => {
        if (tooltipAnchor) positionTeamTooltip()
    })
}

function flagUrl(team) {
    return `${data.meta.flagBaseUrl}/${team.code}.png`
}

function bindGlobalEvents() {
    document.getElementById('btn-realistic').addEventListener('click', realisticPredictAll)
    document.getElementById('btn-random').addEventListener('click', randomPredictAll)
    document.getElementById('btn-reset').addEventListener('click', resetAll)
}

function getEloWinProb(teamAId, teamBId, scale) {
    const ratingA = getTeamOverallScore(teamAId) * ELO_RATING_FACTOR
    const ratingB = getTeamOverallScore(teamBId) * ELO_RATING_FACTOR
    return 1 / (1 + Math.pow(10, (ratingB - ratingA) / scale))
}

function pickKnockoutWinner(teamA, teamB, pickFn) {
    return pickFn(teamA, teamB)
}

function predictKnockoutAll(pickFn) {
    initCompletedResults()

    const matchOrder = [
        ...KNOCKOUT_MATCH_ORDER,
        data.knockoutTree.thirdPlace.id,
        data.knockoutTree.final.id
    ]

    matchOrder.forEach(matchId => {
        const { home, away } = getMatchTeams(matchId)
        if (!home || !away) return
        if (isMatchLocked(matchId)) return
        winners[matchId] = pickKnockoutWinner(home.id, away.id, pickFn)
    })

    renderBracket()
}

function realisticPredictAll() {
    predictKnockoutAll((teamA, teamB) =>
        Math.random() < getEloWinProb(teamA, teamB, ELO_SCALE_KNOCKOUT) ? teamA : teamB
    )
}

function randomPredictAll() {
    predictKnockoutAll((teamA, teamB) => Math.random() < 0.5 ? teamA : teamB)
}

function resetAll() {
    winners = {}
    initCompletedResults()
    renderBracket()
}

function isMatchLocked(matchId) {
    const r32 = data.roundOf32.find(m => m.id === matchId)
    return Boolean(r32?.result?.winnerId)
}

function getRoundOf32Match(matchId) {
    return data.roundOf32.find(m => m.id === matchId)
}

function getMatchLoser(matchId) {
    const winnerId = winners[matchId]
    if (!winnerId) return null

    const { home, away } = getMatchTeams(matchId)
    if (!home || !away) return null

    return winnerId === home.id ? away : home
}

function getMatchTeams(matchId) {
    const thirdPlace = data.knockoutTree.thirdPlace
    if (thirdPlace && matchId === thirdPlace.id) {
        return {
            home: getMatchLoser(thirdPlace.home),
            away: getMatchLoser(thirdPlace.away),
            label: '季军战'
        }
    }

    const r32 = getRoundOf32Match(matchId)
    if (r32) {
        return {
            home: getTeam(r32.homeId),
            away: getTeam(r32.awayId),
            label: r32.label,
            result: r32.result || null
        }
    }

    const findInTree = (id) => {
        for (const stage of ['r16', 'qf', 'sf']) {
            const found = data.knockoutTree[stage].find(m => m.id === id)
            if (found) return found
        }
        if (data.knockoutTree.final.id === id) return data.knockoutTree.final
        if (data.knockoutTree.thirdPlace?.id === id) return data.knockoutTree.thirdPlace
        return null
    }

    const def = findInTree(matchId)
    if (!def) return { home: null, away: null }

    const homeWinner = winners[def.home]
    const awayWinner = winners[def.away]

    return {
        home: homeWinner ? getTeam(homeWinner) : null,
        away: awayWinner ? getTeam(awayWinner) : null,
        label: matchId
    }
}

function selectWinner(matchId, teamId) {
    if (isMatchLocked(matchId)) return

    const { home, away } = getMatchTeams(matchId)
    if (!home || !away) return

    const valid = teamId === home.id || teamId === away.id
    if (!valid) return

    winners[matchId] = teamId

    if (matchId === 'm101' || matchId === 'm102') {
        const tp = data.knockoutTree.thirdPlace
        if (tp) delete winners[tp.id]
    }

    clearDownstream(matchId)
    renderBracket()
}

function getParentMatches(matchId) {
    const parents = []
    for (const stage of ['r16', 'qf', 'sf']) {
        data.knockoutTree[stage].forEach(m => {
            if (m.home === matchId || m.away === matchId) parents.push(m.id)
        })
    }
    const fin = data.knockoutTree.final
    if (fin.home === matchId || fin.away === matchId) parents.push(fin.id)
    return parents
}

function clearDownstream(matchId) {
    const toClear = new Set()
    const queue = getParentMatches(matchId)

    while (queue.length) {
        const id = queue.shift()
        if (toClear.has(id)) continue
        toClear.add(id)
        getParentMatches(id).forEach(p => queue.push(p))
    }

    toClear.forEach(id => delete winners[id])
}

function createMatchCard(matchId, opts = {}) {
    const matchInfo = getMatchTeams(matchId)
    const { home, away, result } = matchInfo
    const winnerId = winners[matchId]
    const isFinal = opts.isFinal
    const isThirdPlace = opts.isThirdPlace
    const locked = isMatchLocked(matchId)

    const card = document.createElement('div')
    card.className = `match-card ${isFinal ? 'final-card' : ''} ${isThirdPlace ? 'third-place-card' : ''}`

    if (isFinal) {
        card.innerHTML = '<div class="final-trophy">🏆</div>'
    } else if (isThirdPlace) {
        card.innerHTML = '<div class="third-place-trophy">🥉</div>'
    }

    ;[
        { team: home, side: 'home' },
        { team: away, side: 'away' }
    ].forEach(({ team }) => {
        const el = document.createElement('div')

        if (!team) {
            el.className = 'match-team empty'
            el.textContent = '待定'
        } else {
            const isWinner = winnerId === team.id
            const isLoser = winnerId && winnerId !== team.id
            el.className = `match-team ${isWinner ? 'winner' : ''} ${isLoser ? 'loser' : ''} ${locked ? 'locked' : ''}`
            el.innerHTML = `
                ${isWinner && isFinal ? '<span class="win-badge">WIN</span>' : ''}
                ${isLoser && isFinal && winnerId ? '<span class="win-badge second-badge">2ND</span>' : ''}
                ${isWinner && isThirdPlace ? '<span class="win-badge third-badge">3RD</span>' : ''}
                <img class="flag-md" src="${flagUrl(team)}" alt="${team.name}">
                <span class="team-label">${team.name}</span>
                <button type="button" class="team-info-btn" aria-label="查看${team.name}详情">详情</button>
            `
            attachTeamTooltip(el, team.id, matchId)
            if (!locked) {
                el.addEventListener('click', () => selectWinner(matchId, team.id))
            }
        }
        card.appendChild(el)
    })

    if (result?.score) {
        const scoreEl = document.createElement('div')
        scoreEl.className = 'match-score'
        scoreEl.textContent = result.score
        card.appendChild(scoreEl)
    }

    return card
}

function setColumnVline(col, span, matchCount) {
    const firstCenter = span * BRACKET_ROW_H / 2
    const lastStart = (matchCount - 1) * span + 1
    const lastCenter = (lastStart - 1) * BRACKET_ROW_H + span * BRACKET_ROW_H / 2
    col.style.setProperty('--vline-top', `${firstCenter}px`)
    col.style.setProperty('--vline-height', `${lastCenter - firstCenter}px`)
}

function renderBracketColumn(label, matchIds, span) {
    const col = document.createElement('div')
    col.className = 'bracket-col'

    const title = document.createElement('div')
    title.className = 'round-label'
    title.textContent = label
    col.appendChild(title)

    setColumnVline(col, span, matchIds.length)

    const slots = document.createElement('div')
    slots.className = 'bracket-slots'
    slots.style.setProperty('--bracket-rows', BRACKET_ROWS)
    slots.style.setProperty('--bracket-row-h', `${BRACKET_ROW_H}px`)

    matchIds.forEach((matchId, i) => {
        const slot = document.createElement('div')
        slot.className = 'bracket-slot'
        const start = i * span + 1
        slot.style.gridRow = `${start} / ${start + span}`
        slot.appendChild(createMatchCard(matchId, {
            isFinal: matchId === data.knockoutTree.final.id
        }))
        slots.appendChild(slot)
    })

    col.appendChild(slots)
    return col
}

function renderPodiumColumn() {
    const col = document.createElement('div')
    col.className = 'bracket-col bracket-col-podium'

    const title = document.createElement('div')
    title.className = 'round-label podium-col-label'
    title.innerHTML = `<span>${STAGE_LABELS.final}</span><span>${STAGE_LABELS.thirdPlace}</span>`
    col.appendChild(title)

    const slots = document.createElement('div')
    slots.className = 'bracket-slots'
    slots.style.setProperty('--bracket-rows', BRACKET_ROWS)
    slots.style.setProperty('--bracket-row-h', `${BRACKET_ROW_H}px`)

    const slot = document.createElement('div')
    slot.className = 'bracket-slot bracket-slot-podium bracket-slot-podium-stack'
    slot.style.gridRow = '7 / 11'

    const stack = document.createElement('div')
    stack.className = 'podium-stack'
    stack.appendChild(createMatchCard(data.knockoutTree.final.id, { isFinal: true }))
    stack.appendChild(createMatchCard(data.knockoutTree.thirdPlace.id, { isThirdPlace: true }))
    slot.appendChild(stack)
    slots.appendChild(slot)

    col.appendChild(slots)
    return col
}

function renderBracket() {
    const flow = document.getElementById('bracket-flow')
    flow.innerHTML = ''
    flow.style.setProperty('--bracket-rows', BRACKET_ROWS)
    flow.style.setProperty('--bracket-row-h', `${BRACKET_ROW_H}px`)

    const rounds = [
        { label: STAGE_LABELS.r32, matches: BRACKET_ORDER.r32, span: 1 },
        { label: STAGE_LABELS.r16, matches: BRACKET_ORDER.r16, span: 2 },
        { label: STAGE_LABELS.qf, matches: BRACKET_ORDER.qf, span: 4 },
        { label: STAGE_LABELS.sf, matches: BRACKET_ORDER.sf, span: 8 }
    ]

    rounds.forEach(round => {
        flow.appendChild(renderBracketColumn(round.label, round.matches, round.span))
    })

    flow.appendChild(renderPodiumColumn())
}

init()

    </script>
