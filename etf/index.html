<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETF 投资辅助分析</title>
    <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0 !important; }

        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --surface-2: #21262d;
            --border: #30363d;
            --text: #e6edf3;
            --text-muted: #8b949e;
            --primary: #388bfd;
            --primary-hover: #1f6feb;
            --up: #f85149;
            --up-bg: rgba(248, 81, 73, .15);
            --down: #3fb950;
            --down-bg: rgba(63, 185, 80, .15);
            --red: #f85149;
            --green: #3fb950;
            --red-bg: rgba(248, 81, 73, .15);
            --green-bg: rgba(63, 185, 80, .15);
            --sidebar-w: 380px;
            --shadow: 0 1px 0 rgba(255, 255, 255, .04);
            --chart-bg: #161b22;
            --chart-grid: #30363d;
            --chart-text: #8b949e;
            --scrollbar-thumb: #484f58;
            --scrollbar-thumb-hover: #6e7681;
            --scrollbar-track: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100%;
            min-height: 100vh;
            line-height: 1.5;
            overflow: hidden;
        }

        html {
            height: 100%;
        }

        .app {
            display: flex;
            height: 100vh;
            min-height: 100vh;
            overflow: hidden;
        }

        /* ===== Sidebar ===== */
        .sidebar {
            width: var(--sidebar-w);
            min-width: var(--sidebar-w);
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-shrink: 0;
        }

        .sidebar-header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0;
            flex: 1;
            min-width: 0;
        }

        .sidebar-toggle-btn {
            flex-shrink: 0;
            width: 32px;
            height: 32px;
            padding: 0;
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background .15s, color .15s, border-color .15s;
        }

        .sidebar-toggle-btn:hover {
            background: var(--border);
            color: var(--text);
        }

        .sidebar-body {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        .sidebar.collapsed {
            display: none;
        }

        .sidebar-header p {
            font-size: .8rem;
            color: var(--text-muted);
        }

        .search-form {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .form-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-row label {
            font-size: .75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: .04em;
        }

        select, input[type="text"] {
            padding: 8px 12px;
            border: 1px solid var(--border);
            font-size: .9rem;
            background: var(--surface-2);
            color: var(--text);
            outline: none;
            transition: border-color .15s;
        }

        select:focus, input[type="text"]:focus {
            border-color: var(--primary);
        }

        .search-row {
            display: flex;
            gap: 8px;
        }

        .search-row input { flex: 1; min-width: 0; }

        .search-row .btn { flex-shrink: 0; }

        .btn {
            padding: 8px 16px;
            border: none;
            font-size: .875rem;
            font-weight: 600;
            cursor: pointer;
            transition: background .15s, opacity .15s;
            white-space: nowrap;
        }

        .btn:disabled { opacity: .5; cursor: not-allowed; }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }

        .btn-success {
            background: var(--green);
            color: #fff;
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }

        .btn-success:hover:not(:disabled) { background: #2ea043; }

        .btn-ghost {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 4px 10px;
            font-size: .8rem;
        }

        .btn-ghost:hover { background: var(--surface-2); }

        .detail-panel,
        .sim-detail-table-wrap {
            scrollbar-width: thin;
            scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
        }

        .detail-panel::-webkit-scrollbar,
        .sim-detail-table-wrap::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .detail-panel::-webkit-scrollbar-track,
        .sim-detail-table-wrap::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
        }

        .detail-panel::-webkit-scrollbar-thumb,
        .sim-detail-table-wrap::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
        }

        .detail-panel::-webkit-scrollbar-thumb:hover,
        .sim-detail-table-wrap::-webkit-scrollbar-thumb:hover {
            background: var(--scrollbar-thumb-hover);
        }

        .detail-panel {
            flex: 1;
            padding: 16px 20px 24px;
            overflow-y: auto;
        }

        .detail-empty {
            text-align: center;
            color: var(--text-muted);
            padding: 40px 0;
            font-size: .9rem;
        }

        .detail-meta {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
            font-size: .8rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .market-badge {
            display: inline-block;
            padding: 1px 8px;
            font-size: .7rem;
            font-weight: 600;
            background: rgba(56, 139, 253, .15);
            color: #58a6ff;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 14px;
        }

        .detail-panel .card-stats {
            flex-wrap: nowrap;
            gap: 12px;
            margin-bottom: 14px;
        }

        .detail-panel .card-stat {
            flex: 1;
            min-width: 0;
        }

        .stat-item {
            background: var(--surface-2);
            padding: 10px 12px;
        }

        .stat-label {
            font-size: .7rem;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .stat-value {
            font-size: 1rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .stat-value.up { color: var(--up); }
        .stat-value.down { color: var(--down); }

        .signal-badge-wrap {
            position: relative;
            flex-shrink: 0;
        }

        .signal-badge {
            display: inline-flex;
            align-items: center;
            padding: 3px 10px;
            font-size: .75rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .signal-badge.add { background: var(--up-bg); color: var(--up); }
        .signal-badge.hold { background: rgba(139, 148, 158, .18); color: var(--text-muted); }
        .signal-badge.watch { background: rgba(139, 148, 158, .18); color: var(--text-muted); }
        .signal-badge.sell { background: var(--down-bg); color: var(--down); }

        .signal-advice-refs {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 8px;
        }

        .signal-ref-row {
            font-size: .78rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            line-height: 1.4;
        }

        .signal-ref-row.up { color: var(--up); }
        .signal-ref-row.down { color: var(--down); }

        .signal-advice-popup {
            min-width: 280px;
            max-width: 360px;
        }

        .signal-advice-reason {
            font-size: .78rem;
            line-height: 1.55;
            color: var(--text);
        }

        .card-header .signal-badge-wrap .flow-hover-popup,
        .card-meta-row .signal-badge-wrap .flow-hover-popup,
        .detail-meta-row .signal-badge-wrap .flow-hover-popup {
            top: calc(100% + 4px);
            bottom: auto;
            left: auto;
            right: 0;
        }

        .detail-meta-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
            min-width: 0;
        }

        .detail-meta-row .detail-meta {
            margin-bottom: 0;
            min-width: 0;
            flex: 1;
        }

        .detail-meta-row .signal-badge-wrap {
            flex-shrink: 0;
        }

        .chart-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 8px;
        }

        .chart-tab {
            padding: 4px 14px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            font-size: .8rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        .chart-tab.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .chart-tabs-sm {
            margin-bottom: 6px;
        }

        .chart-tabs-sm .chart-tab {
            padding: 2px 8px;
            font-size: .68rem;
        }

        .card-chart-wrap {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .detail-panel .chart-tab {
            padding: 4px 9px;
        }

        .chart-container,
        .mini-chart {
            position: relative;
        }

        .chart-empty {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 12px;
            text-align: center;
            color: var(--text-muted);
            font-size: .8rem;
            line-height: 1.5;
        }

        .chart-tooltip {
            position: absolute;
            z-index: 10;
            pointer-events: none;
            display: none;
            padding: 8px 10px;
            background: rgba(13, 17, 23, .95);
            color: #e6edf3;
            border: 1px solid var(--border);
            font-size: .75rem;
            line-height: 1.5;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .4);
            white-space: normal;
            min-width: 148px;
        }

        .chart-tooltip-date {
            color: #8b949e;
            margin-bottom: 4px;
        }

        .chart-tooltip-op {
            font-weight: 600;
            font-size: .72rem;
            margin-bottom: 6px;
        }

        .chart-tooltip-op.op-buy {
            color: var(--up);
        }

        .chart-tooltip-op.op-sell {
            color: var(--down);
        }

        .chart-tooltip-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }

        .chart-tooltip-row:first-of-type {
            margin-top: 0;
        }

        .chart-tooltip-tag {
            flex-shrink: 0;
            width: 3.5rem;
            min-width: 3.5rem;
            padding: 1px 4px;
            font-size: .68rem;
            font-weight: 600;
            border: 1px solid;
            line-height: 1.35;
            text-align: center;
            box-sizing: border-box;
        }

        .chart-tooltip-val {
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .chart-tooltip-value {
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .chart-container table a,
        .mini-chart table a,
        .chart-container [class*="watermark"],
        .mini-chart [class*="watermark"] {
            display: none !important;
            visibility: hidden !important;
        }

        .chart-container {
            width: 100%;
            height: 280px;
            overflow: hidden;
            margin-bottom: 14px;
            border: 1px solid var(--border);
            background: var(--chart-bg);
        }

        .flow-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            cursor: default;
        }

        .flow-summary-label {
            color: var(--text-muted);
            font-weight: 600;
        }

        .flow-summary-value.up { color: var(--up); font-weight: 600; }
        .flow-summary-value.down { color: var(--down); font-weight: 600; }

        .flow-hover-trigger {
            position: relative;
            display: inline-block;
            cursor: zoom-in;
        }

        .flow-hover-trigger * {
            cursor: zoom-in;
        }

        .flow-hover-trigger button,
        .flow-hover-trigger .sim-detail-btn,
        .sim-detail-btn {
            cursor: pointer;
        }

        .flow-hover-popup {
            display: none;
            position: absolute;
            left: 0;
            right: auto;
            bottom: calc(100% + 6px);
            background: var(--surface-2);
            border: 1px solid var(--border);
            padding: 10px 12px;
            z-index: 20;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .25);
        }

        .flow-hover-trigger:hover .flow-hover-popup {
            display: block;
        }

        .flow-popup-title {
            font-size: .75rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .flow-popup-item {
            display: flex;
            justify-content: space-between;
            font-size: .8rem;
            padding: 4px 0;
            border-bottom: 1px solid var(--border);
        }

        .flow-popup-item:last-child { border-bottom: none; }

        .intro-text {
            font-size: .85rem;
            color: var(--text-muted);
            margin-bottom: 14px;
            line-height: 1.6;
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            color: var(--text-muted);
        }

        .loading-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .loading-panda {
            width: 20px;
            height: 20px;
            animation: loading-panda-spin 1s linear infinite;
            image-rendering: pixelated;
            flex-shrink: 0;
        }

        @keyframes loading-panda-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .error-msg {
            background: var(--red-bg);
            color: var(--red);
            padding: 10px 14px;
            font-size: .85rem;
            margin-bottom: 12px;
            border: 1px solid rgba(248, 81, 73, .3);
        }

        /* ===== Main ===== */
        .main {
            flex: 1;
            min-width: 0;
            min-height: 0;
            padding: 24px;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .main::-webkit-scrollbar {
            display: none;
        }

        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 12px;
        }

        .sidebar-expand-btn {
            display: none;
        }

        .app.sidebar-collapsed .sidebar-expand-btn {
            display: inline-flex;
            position: fixed;
            left: 0;
            top: 24px;
            z-index: 20;
            border-left: none;
        }

        .main-header-title {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .app.sidebar-collapsed .main-header-title {
            margin-left: 20px;
        }

        .main-header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .main-header h2 {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .refresh-icon-btn {
            flex-shrink: 0;
            width: 24px;
            height: 24px;
            margin-top: 4px;
            padding: 0;
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--text-muted);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background .15s, color .15s, border-color .15s;
        }

        .refresh-icon-btn:hover:not(:disabled) {
            background: var(--border);
            color: var(--text);
        }

        .refresh-icon-btn:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .refresh-icon-btn svg {
            width: 16px;
            height: 16px;
        }

        .refresh-icon-btn.is-loading svg {
            animation: loading-panda-spin 1s linear infinite;
        }

        .watchlist-empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .watchlist-empty svg {
            width: 48px;
            height: 48px;
            margin-bottom: 12px;
            opacity: .3;
        }

        .cards {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background: var(--surface);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            padding: 20px;
            position: relative;
            min-width: 0;
            max-width: 100%;
            container-type: inline-size;
            container-name: watchlist-card;
        }

        .card-body {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-start;
            min-width: 0;
            max-width: 100%;
        }

        .card-left {
            flex: 0 0 280px;
            width: 300px;
            min-width: 280px;
            max-width: 280px;
        }

        .remove-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            z-index: 2;
            width: 28px;
            height: 28px;
            padding: 0;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 1.05rem;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .15s, color .15s;
        }

        .remove-btn:hover {
            background: var(--red-bg);
            color: var(--red);
        }

        .card-sort-btns {
            position: absolute;
            top: 13px;
            left: -2px;
            z-index: 2;
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .card-sort-btn {
            width: 22px;
            height: 18px;
            padding: 0;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .15s, color .15s;
        }

        .card-sort-btn svg {
            width: 14px;
            height: 14px;
        }

        .card-sort-btn:hover:not(:disabled) {
            background: var(--surface-2);
            color: var(--text);
        }

        .card-sort-btn:disabled {
            opacity: .25;
            cursor: not-allowed;
        }

        .hold-position-wrap {
            position: relative;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
        }

        .card-hold-row,
        .detail-hold-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            min-width: 0;
        }

        .card-hold-row .signal-badge-wrap,
        .detail-hold-row .signal-badge-wrap {
            margin-left: auto;
            flex-shrink: 0;
        }

        .hold-position-check {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
            margin: 0;
            line-height: 1;
            flex-shrink: 0;
        }

        .hold-position-check input {
            width: 14px;
            height: 14px;
            margin: 0;
            cursor: pointer;
            accent-color: var(--primary);
            vertical-align: middle;
        }

        .hold-position-label {
            font-size: .8rem;
            color: var(--text-muted);
        }

        .hold-cost-field {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: .8rem;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .hold-cost-input {
            width: 92px;
            padding: 4px 8px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--text);
            font-size: .8rem;
            outline: none;
        }

        .hold-cost-input:focus {
            border-color: var(--primary);
        }

        .hold-cost-input:disabled {
            opacity: .45;
            cursor: not-allowed;
            background: var(--surface);
            color: var(--text-muted);
        }

        .hold-position-wrap .flow-hover-popup {
            top: calc(100% + 4px);
            bottom: auto;
            left: 0;
            right: auto;
            min-width: auto;
            white-space: nowrap;
            padding: 6px 10px;
            font-size: .72rem;
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            font-size: 1rem;
            font-weight: 700;
        }

        .fund-name-text {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .detail-name {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .card-header {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 12px;
        }

        .card-meta-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-width: 0;
        }

        .card-meta-row .card-symbol {
            min-width: 0;
            flex: 1;
        }

        .card-meta-row .signal-badge-wrap {
            flex-shrink: 0;
        }

        .card-symbol {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
            font-size: .8rem;
            color: var(--text-muted);
        }

        .symbol-code {
            font-variant-numeric: tabular-nums;
        }

    (function () {

        function isTraditionalChineseLocale() {
            var langs = navigator.languages && navigator.languages.length
                ? Array.prototype.slice.call(navigator.languages)
                : [navigator.language || navigator.userLanguage || 'zh-CN']
            var i, lang, seenZh = false
            for (i = 0; i < langs.length; i++) {
                lang = String(langs[i] || '').toLowerCase()
                if (lang.indexOf('zh-hant') >= 0 || lang.indexOf('zh-tw') >= 0 ||
                    lang.indexOf('zh-hk') >= 0 || lang.indexOf('zh-mo') >= 0) {
                    return true
                }
                if (lang.indexOf('zh-hans') >= 0 || lang.indexOf('zh-cn') >= 0 ||
                    lang.indexOf('zh-sg') >= 0 || lang.indexOf('zh-my') >= 0) {
                    return false
                }
                if (lang === 'zh' || lang.indexOf('zh-') === 0) {
                    seenZh = true
                }
            }
            var docLang = (document.documentElement.lang || '').toLowerCase()
            if (docLang.indexOf('hant') >= 0 || docLang.indexOf('tw') >= 0 ||
                docLang.indexOf('hk') >= 0 || docLang.indexOf('mo') >= 0) {
                return true
            }
            if (docLang.indexOf('hans') >= 0 || docLang.indexOf('cn') >= 0) {
                return false
            }
            return false

            if (sidebarCollapseBtn) {
                sidebarCollapseBtn.setAttribute('aria-expanded', collapsed ? 'false' : 'true')
            }
            if (sidebarExpandBtn) {
                sidebarExpandBtn.setAttribute('aria-expanded', collapsed ? 'true' : 'false')
            }
            scheduleChartLayoutRefresh()

        function initSidebarCollapse() {
            setSidebarCollapsed(getWatchlist().length > 0)

        /* ===== 工具函数 ===== */

            var hour = parseInt(s.slice(8, 10), 10)

        function resolveQuoteTime(data) {
            if (!data || data.quoteTime != null) return data
            if (data.market === 'tw' && needsTWLiveQuote(data)) {
                return data
            }
            if (data.intraday && data.intraday.points && data.intraday.points.length) {
                var lastPoint = data.intraday.points[data.intraday.points.length - 1]
                if (lastPoint.time) {

            if (data.klines && data.klines.length) {

                if (dateStr) {

                    data.quoteTime = marketLocalTimeToUnix(

            if (abs >= 1e8) return sign + (abs / 1e8).toFixed(2) + '亿'
            if (abs >= 1e4) return sign + (abs / 1e4).toFixed(2) + '万'

        }

        function debounce(fn, ms) {

        /* ===== 均线策略（参考信号 / 图表） ===== */
        function getRefMaDays(market) {
            var s = getTradeStrategy(market)
            return market === 'tw' ? s.shortMaDays : s.baseMaDays
        }

        function getMaLabel(market) {
            return 'MA' + getRefMaDays(market)
        }

        function getLatestMa(klines, currentPrice, market, period) {
            period = Math.max(2, parseInt(period, 10) || 2)
            if (!klines || klines.length < period - 1) return null
            market = market || 'cn'

            var lastIdx = klines.length - 1
            var lastDate = klines[lastIdx].date
            var marketToday = getMarketDateString(market)
            var livePrice = currentPrice != null && !isNaN(currentPrice) ? Number(currentPrice) : null
            var sessionOpen = isMarketOpen(market)

            if (sessionOpen && livePrice != null) {
                if (lastDate === marketToday) {
                    if (klines.length < period) return null
                    var sumToday = livePrice
                    for (var i = lastIdx - period + 1; i < lastIdx; i++) sumToday += klines[i].close
                    return sumToday / period
                }
                if (klines.length < period - 1) return null
                var sumNewDay = livePrice
                for (var j = lastIdx - (period - 2); j <= lastIdx; j++) sumNewDay += klines[j].close
                return sumNewDay / period
            }

            if (klines.length < period) return null
            return calcMaSeries(klines, period)[lastIdx]
        }

        function buildDailyMaByDate(klines, currentPrice, market, period) {
            period = period || getRefMaDays(market)
            var map = {}
            var maSeries = calcMaSeries(klines, period)
            var i
            for (i = 0; i < klines.length; i++) {
                if (maSeries[i] != null) map[klines[i].date] = maSeries[i]
            }
            var latest = getLatestMa(klines, currentPrice, market, period)
            if (latest == null) return map

            var lastDate = klines[klines.length - 1].date
            var marketToday = getMarketDateString(market)
            if (lastDate === marketToday) {
                map[lastDate] = latest
            }
            return map
        }

        function calcDiffPct(price, maVal) {
            if (!price || !maVal) return null
            return ((price - maVal) / maVal) * 100
        }

        function getBarEffectiveClose(klines, index, currentPrice, market) {
            var bar = klines[index]
            if (!bar || bar.close == null || isNaN(bar.close)) return null
            if (index !== klines.length - 1) return bar.close
            var live = currentPrice != null && !isNaN(currentPrice) ? Number(currentPrice) : null
            if (live == null) return bar.close
            var marketToday = getMarketDateString(market)
            if (bar.date === marketToday || isMarketOpen(market)) return live
            return bar.close
        }

        function formatThresholdOffset(threshold) {
            var pct = (threshold - 1) * 100
            var sign = pct >= 0 ? '+' : ''
            return sign + pct.toFixed(2) + '%'
        }

        function getMarketTimezone(market) {
            if (market === 'tw') return 'Asia/Taipei'
            return 'Asia/Shanghai'
        }

        function getMarketDateString(market) {
            return new Intl.DateTimeFormat('en-CA', {
                timeZone: getMarketTimezone(market),
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            }).format(new Date())
        }

        function getMarketClock(market) {
            var tz = getMarketTimezone(market)
            var parts = new Intl.DateTimeFormat('en-US', {
                timeZone: tz,
                hour: '2-digit',
                minute: '2-digit',
                hour12: false,
                weekday: 'short'
            }).formatToParts(new Date())
            var hour = 0
            var minute = 0
            var weekday = ''
            parts.forEach(function (p) {
                if (p.type === 'hour') hour = parseInt(p.value, 10)
                if (p.type === 'minute') minute = parseInt(p.value, 10)
                if (p.type === 'weekday') weekday = p.value
            })
            return { minutes: hour * 60 + minute, weekday: weekday }
        }

        function isMarketOpen(market) {
            var clock = getMarketClock(market)
            if (clock.weekday === 'Sat' || clock.weekday === 'Sun') return false
            var m = clock.minutes
            if (market === 'cn') {
                return m >= 570 && m < 900
            }
            if (market === 'tw') {
                return m >= 540 && m < 810
            }
            return false
        }

        var MARKET_SESSION = {
            cn: { open: [9, 30], close: [15, 0] },
            tw: { open: [9, 0], close: [13, 30] }
        }

        function pad2(n) {
            return String(n).padStart(2, '0')
        }

        function getMarketClockAt(market, ms) {
            var tz = getMarketTimezone(market)
            var parts = new Intl.DateTimeFormat('en-US', {
                timeZone: tz,
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            }).formatToParts(new Date(ms))
            var y = ''
            var mo = ''
            var da = ''
            var hour = 0
            var minute = 0
            parts.forEach(function (p) {
                if (p.type === 'year') y = p.value
                if (p.type === 'month') mo = p.value
                if (p.type === 'day') da = p.value
                if (p.type === 'hour') hour = parseInt(p.value, 10)
                if (p.type === 'minute') minute = parseInt(p.value, 10)
            })
            return {
                dateStr: y + '-' + mo + '-' + da,
                hour: hour,
                minute: minute
            }
        }

        function marketLocalTimeToUnix(market, dateStr, hour, minute) {
            var y = parseInt(dateStr.slice(0, 4), 10)
            var mo = parseInt(dateStr.slice(5, 7), 10)
            var da = parseInt(dateStr.slice(8, 10), 10)
            var target = hour * 60 + minute
            var guess = Date.UTC(y, mo - 1, da, hour, minute, 0)
            for (var offset = -14; offset <= 14; offset++) {
                for (var m = 0; m < 60; m++) {
                    var t = guess + (offset * 3600000) + (m * 60000)
                    var clock = getMarketClockAt(market, t)
                    if (clock.dateStr === dateStr && clock.hour * 60 + clock.minute === target) {
                        return Math.floor(t / 1000)
                    }
                }
            }
            return Math.floor(guess / 1000)
        }

        function formatMarketTimeLabel(market, unixTime) {
            var clock = getMarketClockAt(market, unixTime * 1000)
            return pad2(clock.hour) + ':' + pad2(clock.minute)
        }

        function getSessionUnixBounds(market, tradingDate) {
            var cfg = MARKET_SESSION[market] || MARKET_SESSION.cn
            return {
                start: marketLocalTimeToUnix(market, tradingDate, cfg.open[0], cfg.open[1]),
                end: marketLocalTimeToUnix(market, tradingDate, cfg.close[0], cfg.close[1])
            }
        }

        function getAnnualKlines(klines) {
            if (!klines || klines.length < 6) return klines || []
            var cutoff = new Date()
            cutoff.setFullYear(cutoff.getFullYear() - 1)
            var cutoffStr = formatDateISO(cutoff)
            var sliced = klines.filter(function (k) { return normalizeTradeDate(k.date) >= cutoffStr })
            if (sliced.length >= 6) return sortKlinesByDate(sliced)
            return sortKlinesByDate(klines.slice(-Math.min(klines.length, 252)))
        }

        function normalizeTradeDate(dateStr) {
            if (!dateStr) return ''
            var s = String(dateStr).trim()
            if (/^\d{8}$/.test(s)) {
                return s.slice(0, 4) + '-' + s.slice(4, 6) + '-' + s.slice(6, 8)
            }
            var parts = s.split(/[-/T]/)
            if (parts.length >= 3) {
                var y = parts[0]
                var m = String(parseInt(parts[1], 10))
                var d = String(parseInt(parts[2], 10))
                if (m.length === 1) m = '0' + m
                if (d.length === 1) d = '0' + d
                return y + '-' + m + '-' + d
            }
            return s.slice(0, 10)
        }

        function sortKlinesByDate(klines) {
            if (!klines || !klines.length) return []
            return klines.slice().sort(function (a, b) {
                return normalizeTradeDate(a.date).localeCompare(normalizeTradeDate(b.date))
            })
        }

        function getSimEntryDateBounds(klines) {
            var sorted = sortKlinesByDate(klines)
            if (!sorted.length) return { minDate: '', maxDate: '' }
            var minDate = normalizeTradeDate(sorted[0].date)
            var maxDate = normalizeTradeDate(sorted[sorted.length - 1].date)
            var today = formatDateISO(new Date())
            if (maxDate > today) maxDate = today
            if (minDate > maxDate) {
                var tmp = minDate
                minDate = maxDate
                maxDate = tmp
            }
            return { minDate: minDate, maxDate: maxDate }
        }

        function getSimTradingDates(klines) {
            var bounds = getSimEntryDateBounds(klines)
            if (!bounds.minDate || !bounds.maxDate) return []
            var seen = {}
            var dates = []
            sortKlinesByDate(klines).forEach(function (k) {
                var d = normalizeTradeDate(k.date)
                if (!d || d < bounds.minDate || d > bounds.maxDate || seen[d]) return
                seen[d] = true
                dates.push(d)
            })
            return dates
        }

        function calcAnnualActualReturn(klines) {
            var yearKlines = getAnnualKlines(klines)
            if (!yearKlines || yearKlines.length < 2) return null
            var firstClose = yearKlines[0].close
            var lastClose = yearKlines[yearKlines.length - 1].close
            if (firstClose == null || isNaN(firstClose) || !firstClose) return null
            if (lastClose == null || isNaN(lastClose)) return null
            return {
                returnPct: ((lastClose - firstClose) / firstClose) * 100,
                startDate: yearKlines[0].date,
                endDate: yearKlines[yearKlines.length - 1].date
            }
        }

        function calcMaSeries(klines, period) {
            var p = Math.max(2, parseInt(period, 10) || 2)
            var result = []
            var i, j, sum
            for (i = 0; i < klines.length; i++) {
                if (i < p - 1) {
                    result.push(null)
                    continue
                }
                sum = 0
                for (j = i - p + 1; j <= i; j++) sum += klines[j].close
                result.push(sum / p)
            }
            return result
        }

        function resolveMaAtBar(maSeries, klines, index, period, currentPrice, market) {
            if (index === klines.length - 1) {
                var latest = getLatestMa(klines, currentPrice, market, period)
                if (latest != null) return latest
            }
            return maSeries[index]
        }

        function buildStrategyLevelsByDate(klines, market, currentPrice) {
            if (!klines || !klines.length) return {}
            var strategy = getTradeStrategy(market)
            var basePeriod = market === 'tw' ? strategy.shortMaDays : strategy.baseMaDays
            var baseMaSeries = calcMaSeries(klines, basePeriod)
            var result = {}
            var i, baseMa, levels

            for (i = 0; i < klines.length; i++) {
                baseMa = resolveMaAtBar(baseMaSeries, klines, i, basePeriod, currentPrice, market)
                levels = { buy: null, sell: null }

                if (baseMa != null) {
                    levels.buy = baseMa * strategy.buyThreshold
                    levels.sell = baseMa * strategy.sellThreshold
                }
                result[normalizeTradeDate(klines[i].date)] = levels
            }
            return result
        }

        function buildSimPositionStateByDate(klines, strategy, market, entryStartDate) {
            klines = sortKlinesByDate(klines)
            var entryIdx = findKlineIndexOnOrBeforeDate(klines, entryStartDate)
            if (entryIdx < 0) entryIdx = 0
            var maPeriods = resolveStrategyMaPeriods(strategy, market)
            var baseMa = calcMaSeries(klines, maPeriods.baseMaDays)
            var trailMa = calcMaSeries(klines, maPeriods.trailMaDays)
            var delay = getTradeDelayDays(strategy)
            var n = klines.length
            var cash = 1
            var shares = 0
            var inPosition = false
            var entryPrice = 0
            var buyStreak = 0
            var pendingBuyWait = -1
            var pendingSellWait = -1
            var pendingSellNote = ''
            var initialBuyApplied = false
            var stateByDate = {}
            var i, bar, close, sellSig, tradedToday

            for (i = 0; i < n; i++) {
                bar = klines[i]
                close = bar.close
                if (close == null || isNaN(close)) continue

                if (i < entryIdx) {
                    stateByDate[normalizeTradeDate(bar.date)] = {
                        inPosition: false,
                        entryPrice: null,
                        openingInPosition: false,
                        openingEntryPrice: null
                    }
                    continue
                }

                var openingInPosition = inPosition && shares > 0
                var openingEntryPrice = openingInPosition ? entryPrice : null
                tradedToday = false

                if (!initialBuyApplied && cash > 0 && !inPosition) {
                    shares = cash / close
                    cash = 0
                    inPosition = true
                    entryPrice = close
                    initialBuyApplied = true
                    tradedToday = true
                } else if (delay > 0) {
                    if (pendingSellWait > 0) pendingSellWait--
                    if (pendingBuyWait > 0) pendingBuyWait--
                    if (pendingSellWait === 0 && inPosition && shares > 0) {
                        cash = shares * close
                        shares = 0
                        inPosition = false
                        entryPrice = 0
                        pendingSellWait = -1
                        pendingSellNote = ''
                        tradedToday = true
                    } else if (pendingBuyWait === 0 && !inPosition && cash > 0) {
                        shares = cash / close
                        cash = 0
                        inPosition = true
                        entryPrice = close
                        pendingBuyWait = -1
                        tradedToday = true
                    }
                }

                if (!tradedToday && pendingSellWait < 0 && pendingBuyWait < 0) {
                    if (inPosition && shares > 0) {
                        sellSig = evalStrategySellSignal(strategy, close, entryPrice, baseMa[i], trailMa[i])
                        if (sellSig.shouldSell) {
                            if (delay <= 0) {
                                cash = shares * close
                                shares = 0
                                inPosition = false
                                entryPrice = 0
                                tradedToday = true
                            } else {
                                pendingSellWait = delay
                                pendingSellNote = sellSig.note
                            }
                        }
                    } else if (cash > 0 && baseMa[i] != null) {
                        if (close > baseMa[i] * strategy.buyThreshold) {
                            buyStreak++
                        } else {
                            buyStreak = 0
                        }
                        if (buyStreak >= strategy.confirmDays) {
                            if (delay <= 0) {
                                shares = cash / close
                                cash = 0
                                inPosition = true
                                entryPrice = close
                                buyStreak = 0
                                tradedToday = true
                            } else {
                                pendingBuyWait = delay
                                buyStreak = 0
                            }
                        }
                    }
                }

                stateByDate[normalizeTradeDate(bar.date)] = {
                    inPosition: inPosition && shares > 0,
                    entryPrice: inPosition && shares > 0 ? entryPrice : null,
                    openingInPosition: openingInPosition,
                    openingEntryPrice: openingEntryPrice
                }
            }
            return stateByDate
        }

        function buildSimDetailGuideByDate(klines, market, currentPrice, entryStartDate) {
            klines = sortKlinesByDate(klines)
            var strategy = getTradeStrategy(market)
            var maPeriods = resolveStrategyMaPeriods(strategy, market)
            var levelsByDate = buildStrategyLevelsByDate(klines, market, currentPrice)
            var trailMaSeries = calcMaSeries(klines, maPeriods.trailMaDays)
            var positionByDate = buildSimPositionStateByDate(klines, strategy, market, entryStartDate)
            var maPeriod = getRefMaDays(market)
            var maByDate = buildDailyMaByDate(klines, currentPrice, market, maPeriod)
            var trailMaByDate = buildDailyMaByDate(klines, currentPrice, market, maPeriods.trailMaDays)
            var maBaseLabel = 'MA' + maPeriods.baseMaDays
            var maTrailLabel = 'MA' + maPeriods.trailMaDays
            var marketToday = getMarketDateString(market)
            var livePrice = currentPrice != null && !isNaN(currentPrice) ? Number(currentPrice) : null
            var result = {}
            var i

            for (i = 0; i < klines.length; i++) {
                var k = klines[i]
                var d = normalizeTradeDate(k.date)
                var lv = levelsByDate[d] || {}
                var close = k.close
                if (livePrice != null && d === marketToday) close = livePrice
                var entry = {
                    close: close,
                    ma: maByDate[d] != null ? maByDate[d] : maByDate[k.date],
                    maLabel: maBaseLabel,
                    buy: lv.buy,
                    sell: lv.sell,
                    stop: null,
                    trailProfit: null,
                    trailActive: false
                }
                var pos = positionByDate[d]
                var refEntry = null
                if (pos) {
                    if (pos.openingInPosition && pos.openingEntryPrice > 0) {
                        refEntry = pos.openingEntryPrice
                    } else if (pos.inPosition && pos.entryPrice > 0) {
                        refEntry = pos.entryPrice
                    }
                }
                if (refEntry != null) {
                    if (isStopLossEnabled(strategy)) {
                        entry.stop = refEntry * (1 + strategy.stopLossPct / 100)
                    }
                    var pnlPct = close != null && !isNaN(close)
                        ? ((close - refEntry) / refEntry) * 100
                        : null
                    var useTrail = pnlPct != null && shouldUseTrailProfit(strategy, pnlPct)
                    var trailMaVal = null
                    if (useTrail) {
                        trailMaVal = trailMaByDate[d] != null ? trailMaByDate[d] : trailMaByDate[k.date]
                        if (trailMaVal == null && trailMaSeries[i] != null) trailMaVal = trailMaSeries[i]
                        if (trailMaVal != null) {
                            entry.ma = trailMaVal
                            entry.maLabel = maTrailLabel
                        }
                    }
                    if (isTrailProfitEnabled(strategy)) {
                        if (useTrail && trailMaVal != null) {
                            entry.trailProfit = trailMaVal * strategy.sellThreshold
                            entry.trailActive = true
                            entry.sell = entry.trailProfit
                        } else {
                            entry.trailProfit = refEntry * (1 + strategy.trailProfitPct / 100)
                        }
                    }
                }
                result[d] = entry
            }
            return result
        }

        function calendarDaysBetween(fromDate, toDate) {
            var a = new Date(fromDate + 'T00:00:00')
            var b = new Date(toDate + 'T00:00:00')
            return Math.round((b.getTime() - a.getTime()) / 86400000)
        }

        function getDefaultTradeStrategies() {
            return {
                tw: {
                    shortMaDays: 5,
                    longMaDays: 10,
                    buyThreshold: 1.005,
                    sellThreshold: 0.995,
                    confirmDays: 1,
                    tradeDelayDays: 0,
                    enableStopLoss: true,
                    stopLossPct: -3,
                    enableTrailProfit: true,
                    trailProfitPct: 5
                },
                cn: {
                    baseMaDays: 10,
                    buyThreshold: 1.005,
                    sellThreshold: 0.995,
                    confirmDays: 2,
                    tradeDelayDays: 1,
                    enableStopLoss: true,
                    stopLossPct: -8,
                    enableTrailProfit: true,
                    trailProfitPct: 5,
                    trailMaDays: 20
                }
            }
        }

        function normalizeStrategyNumber(val, fallback) {
            var n = parseFloat(val)
            return isNaN(n) ? fallback : n
        }

        function normalizeStrategyInt(val, fallback, min) {
            var n = parseInt(val, 10)
            if (isNaN(n)) return fallback
            if (min != null && n < min) return min
            return n
        }

        function mergeTradeStrategy(raw, defaults) {
            var out = {}
            var k
            for (k in defaults) {
                if (!Object.prototype.hasOwnProperty.call(defaults, k)) continue
                var v = raw && raw[k] != null ? raw[k] : defaults[k]
                if (k.indexOf('Days') >= 0 || k === 'confirmDays' || k === 'tradeDelayDays') {
                    out[k] = normalizeStrategyInt(v, defaults[k], k === 'confirmDays' ? 1 : 0)
                } else if (k.indexOf('enable') === 0) {
                    out[k] = raw && Object.prototype.hasOwnProperty.call(raw, k) ? !!raw[k] : defaults[k]
                } else if (k.indexOf('Pct') >= 0) {
                    out[k] = normalizeStrategyNumber(v, defaults[k])
                } else {
                    out[k] = normalizeStrategyNumber(v, defaults[k])
                }
            }
            return out
        }

        function loadTradeStrategies() {
            var defaults = getDefaultTradeStrategies()
            try {
                var raw = localStorage.getItem(STRATEGY_STORAGE_KEY)
                if (!raw) return defaults
                var parsed = JSON.parse(raw)
                return {
                    tw: mergeTradeStrategy(parsed.tw, defaults.tw),
                    cn: mergeTradeStrategy(parsed.cn, defaults.cn)
                }
            } catch (e) {
                return defaults
            }
        }

        function saveTradeStrategies(strategies) {
            localStorage.setItem(STRATEGY_STORAGE_KEY, JSON.stringify(strategies))
        }

        function getTradeStrategy(market) {
            var all = loadTradeStrategies()
            return all[market] || all.cn
        }

        function isStopLossEnabled(strategy) {
            return strategy.enableStopLoss !== false
        }

        function isTrailProfitEnabled(strategy) {
            return strategy.enableTrailProfit !== false
        }

        function shouldUseTrailProfit(strategy, pnlPct) {
            return isTrailProfitEnabled(strategy) && pnlPct > strategy.trailProfitPct
        }

        function getTradeDelayDays(strategy) {
            return normalizeStrategyInt(strategy && strategy.tradeDelayDays, 0, 0)
        }

        function resolveStrategyMaPeriods(strategy, market) {
            if (market === 'tw') {
                return {
                    baseMaDays: strategy.shortMaDays,
                    trailMaDays: strategy.longMaDays
                }
            }
            return {
                baseMaDays: strategy.baseMaDays,
                trailMaDays: strategy.trailMaDays
            }
        }

        function getStrategyMaSummary(market, strategy) {
            var ma = resolveStrategyMaPeriods(strategy, market)
            return 'MA' + ma.baseMaDays + '/MA' + ma.trailMaDays
        }

        function formatTradeDelaySummary(strategy) {
            var delay = getTradeDelayDays(strategy)
            if (delay <= 0) return '收盘确认当日成交'
            if (delay === 1) return '收盘确认T+1成交'
            return '收盘确认T+' + delay + '成交'
        }

        function formatTradeDelayAdviceNote(strategy, actionLabel) {
            var delay = getTradeDelayDays(strategy)
            if (delay <= 0) return '今日收盘确认' + actionLabel + '并成交。'
            if (delay === 1) return '今日收盘确认' + actionLabel + '，明日 T+1 成交。'
            return '今日收盘确认' + actionLabel + '，' + delay + ' 个交易日后成交。'
        }

        function formatTradeDelayPendingNote(strategy, actionLabel) {
            var delay = getTradeDelayDays(strategy)
            if (delay <= 0) return '今日收盘确认' + actionLabel + '并成交。'
            if (delay === 1) return '前一日已确认' + actionLabel + '，今日 T+1 成交。'
            return '前 ' + delay + ' 日已确认' + actionLabel + '，今日按延迟规则成交。'
        }

        function formatSimTradeConfirmNote(strategy, signalNote) {
            var delay = getTradeDelayDays(strategy)
            var note = signalNote || '信号'
            if (delay <= 0) return note === '确认买入' ? note : note
            if (delay === 1) return note + ' T+1确认'
            return note + ' T+' + delay + '确认'
        }

        function evalStrategySellSignal(strategy, close, entryPrice, baseMaVal, trailMaVal) {
            var pnlPct = entryPrice ? ((close - entryPrice) / entryPrice) * 100 : 0
            if (isStopLossEnabled(strategy) && pnlPct <= strategy.stopLossPct) {
                return { shouldSell: true, note: '止损', reason: 'stop' }
            }
            var useTrail = shouldUseTrailProfit(strategy, pnlPct)
            var sellMa = useTrail ? trailMaVal : baseMaVal
            if (sellMa != null && close < sellMa * strategy.sellThreshold) {
                return {
                    shouldSell: true,
                    note: useTrail ? '移动止盈' : '信号',
                    reason: useTrail ? 'trail' : 'signal'
                }
            }
            return { shouldSell: false, note: '', reason: '' }
        }

        function getStrategySummaryText(market) {
            var s = getTradeStrategy(market)
            var stopPart = isStopLossEnabled(s) ? ' · 止损' + s.stopLossPct + '%' : ''
            var trailPart = isTrailProfitEnabled(s) ? ' · 移动止盈+' + s.trailProfitPct + '%' : ''
            return getStrategyMaSummary(market, s) +
                ' · 确认' + s.confirmDays + '日 · ' + formatTradeDelaySummary(s) + stopPart + trailPart
        }

        function buildHoldPositionRowHtml(itemId, market, holdPos, adviceHtml, rowClass) {
            var held = !!(holdPos && holdPos.held)
            var costVal = holdPos && holdPos.costPrice != null ? formatPrice(holdPos.costPrice, market) : ''
            var step = market === 'tw' ? '0.01' : '0.001'
            return '<div class="' + (rowClass || 'card-hold-row') + '">' +
                '<label class="hold-position-check">' +
                    '<input type="checkbox" class="hold-position-input" data-item-id="' + escapeHtml(itemId) + '"' +
                        ' data-market="' + escapeHtml(market) + '"' + (held ? ' checked' : '') + '>' +
                    '<span class="hold-position-label">已持有</span>' +
                '</label>' +
                '<label class="hold-cost-field">' +
                    '<span class="hold-cost-label">成本</span>' +
                    '<input type="number" class="hold-cost-input" data-item-id="' + escapeHtml(itemId) + '"' +
                        ' data-market="' + escapeHtml(market) + '" step="' + step + '" min="0"' +
                        ' value="' + escapeHtml(costVal) + '" placeholder="--"' + (held ? '' : ' disabled') + '>' +
                '</label>' +
                (adviceHtml || '') +
            '</div>'
        }

        function replaySignalsBeforeToday(klines, strategy, market) {
            var empty = {
                buyStreak: 0,
                inPosition: false,
                entryPrice: null,
                pendingBuy: false,
                pendingSell: false,
                pendingSellReason: ''
            }
            var n = klines.length
            if (n < 2) return empty

            var maPeriods = resolveStrategyMaPeriods(strategy, market)
            var baseMa = calcMaSeries(klines, maPeriods.baseMaDays)
            var trailMa = calcMaSeries(klines, maPeriods.trailMaDays)
            var delay = getTradeDelayDays(strategy)
            var inPosition = false
            var entryPrice = 0
            var buyStreak = 0
            var pendingBuyWait = -1
            var pendingSellWait = -1
            var pendingSellReason = ''
            var i, close, sellSig, tradedToday

            for (i = 0; i < n - 1; i++) {
                close = klines[i].close
                if (close == null || isNaN(close)) continue
                tradedToday = false

                if (delay > 0) {
                    if (pendingSellWait > 0) pendingSellWait--
                    if (pendingBuyWait > 0) pendingBuyWait--
                    if (pendingSellWait === 0 && inPosition) {
                        inPosition = false
                        entryPrice = 0
                        pendingSellWait = -1
                        pendingSellReason = ''
                        tradedToday = true
                    } else if (pendingBuyWait === 0 && !inPosition) {
                        inPosition = true
                        entryPrice = close
                        pendingBuyWait = -1
                        tradedToday = true
                    }
                }

                if (!tradedToday && pendingSellWait < 0 && pendingBuyWait < 0) {
                    if (inPosition) {
                        sellSig = evalStrategySellSignal(strategy, close, entryPrice, baseMa[i], trailMa[i])
                        if (sellSig.shouldSell) {
                            if (delay <= 0) {
                                inPosition = false
                                entryPrice = 0
                                tradedToday = true
                            } else {
                                pendingSellWait = delay
                                pendingSellReason = sellSig.reason
                            }
                        }
                    } else if (baseMa[i] != null) {
                        if (close > baseMa[i] * strategy.buyThreshold) {
                            buyStreak++
                        } else {
                            buyStreak = 0
                        }
                        if (buyStreak >= strategy.confirmDays) {
                            if (delay <= 0) {
                                inPosition = true
                                entryPrice = close
                                buyStreak = 0
                                tradedToday = true
                            } else {
                                pendingBuyWait = delay
                                buyStreak = 0
                            }
                        }
                    }
                }
            }

            return {
                buyStreak: buyStreak,
                inPosition: inPosition,
                entryPrice: inPosition ? entryPrice : null,
                pendingBuy: delay > 0 && pendingBuyWait >= 0,
                pendingSell: delay > 0 && pendingSellWait >= 0,
                pendingSellReason: pendingSellReason
            }
        }

        function getCnSellAdviceLabel(reason) {
            if (reason === 'stop') return '建议止损'
            if (reason === 'trail') return '建议止盈'
            return '卖出信号'
        }

        function buildSellAdviceRefPrices(sellReason, strategy, sellMaConfig, simEntry, close) {
            var refs = []
            var hasSimEntry = simEntry != null && simEntry > 0
            var pnlPct = hasSimEntry ? ((close - simEntry) / simEntry) * 100 : null
            var useTrail = hasSimEntry && shouldUseTrailProfit(strategy, pnlPct)

            if (sellReason === 'stop' && hasSimEntry && isStopLossEnabled(strategy)) {
                refs.push({
                    label: '止损',
                    op: 'lt',
                    price: simEntry * (1 + strategy.stopLossPct / 100)
                })
                return refs
            }

            var sellMaVal = (sellReason === 'trail' || useTrail) ? sellMaConfig.trailMa : sellMaConfig.baseMa
            var sellLine = sellMaVal != null ? sellMaVal * strategy.sellThreshold : null
            if (sellLine != null) {
                refs.push({
                    label: sellReason === 'trail' || useTrail ? '止盈' : '卖',
                    op: 'lt',
                    price: sellLine
                })
            }
            return refs
        }

        function buildHoldAdviceRefPrices(strategy, sellMaConfig, simEntry, useTrail, sellLine) {
            var refs = []
            var hasSimEntry = simEntry != null && simEntry > 0
            if (sellLine != null) {
                refs.push({ label: useTrail ? '止盈' : '卖', op: 'lt', price: sellLine })
            }
            if (hasSimEntry && isStopLossEnabled(strategy)) {
                refs.push({
                    label: '止损',
                    op: 'lt',
                    price: simEntry * (1 + strategy.stopLossPct / 100)
                })
            }
            if (hasSimEntry && isTrailProfitEnabled(strategy) && !useTrail) {
                refs.push({
                    label: '止盈+' + strategy.trailProfitPct + '%',
                    op: 'gt',
                    price: simEntry * (1 + strategy.trailProfitPct / 100)
                })
            }
            return refs
        }

        function getHeldPositionAdvice(close, market, strategy, sellMaConfig, simEntry) {
            var priceStr = formatPrice(close, market)
            var useTrail = false
            var pnlPct = null
            var sellMaVal, sellMaLabel, sellLine, holdReason, hasSimEntry, delayNote

            delayNote = formatTradeDelayAdviceNote(strategy, '卖出')
            hasSimEntry = simEntry != null && simEntry > 0
            if (hasSimEntry) {
                pnlPct = ((close - simEntry) / simEntry) * 100
                useTrail = shouldUseTrailProfit(strategy, pnlPct)
                if (isStopLossEnabled(strategy) && pnlPct <= strategy.stopLossPct) {
                    return {
                        action: 'sell',
                        label: '建议止损',
                        reason: '当前价 ' + priceStr + ' 相对成本 ' + formatPrice(simEntry, market) +
                            ' 亏损 ' + formatPct(pnlPct) + '，触发止损线 ' + strategy.stopLossPct + '%。' + delayNote,
                        refPrices: buildSellAdviceRefPrices('stop', strategy, sellMaConfig, simEntry, close)
                    }
                }
            }

            sellMaVal = useTrail ? sellMaConfig.trailMa : sellMaConfig.baseMa
            sellMaLabel = useTrail ? sellMaConfig.trailLabel : sellMaConfig.baseLabel
            sellLine = null
            if (sellMaVal != null) {
                sellLine = sellMaVal * strategy.sellThreshold
                if (close < sellLine) {
                    return {
                        action: 'sell',
                        label: useTrail ? '建议止盈' : '卖出信号',
                        reason: useTrail
                            ? '盈利已超过 +' + strategy.trailProfitPct + '% 移动止盈线，按 ' + sellMaLabel +
                                ' 判断：当前价 ' + priceStr + ' 低于 ' + sellMaLabel + '×' + strategy.sellThreshold +
                                '（' + formatPrice(sellLine, market) + '）。' + delayNote
                            : '当前价 ' + priceStr + ' 低于 ' + sellMaLabel + '×' + strategy.sellThreshold +
                                '（' + formatPrice(sellLine, market) + '），满足卖出条件。' + delayNote,
                        refPrices: buildSellAdviceRefPrices(useTrail ? 'trail' : 'signal', strategy, sellMaConfig, simEntry, close)
                    }
                }
            }
            holdReason = sellLine != null
                ? '当前价 ' + priceStr + ' 仍高于卖出线 ' + sellMaLabel + '×' + strategy.sellThreshold +
                    '（' + formatPrice(sellLine, market) + '），暂不满足卖出。'
                : '当前价 ' + priceStr + '，暂不满足卖出条件。'
            if (isTrailProfitEnabled(strategy)) {
                if (hasSimEntry && useTrail) {
                    holdReason += '盈利已过 +' + strategy.trailProfitPct + '% 移动止盈线，止盈参考已改用 ' +
                        sellMaConfig.trailLabel + '。'
                } else if (hasSimEntry) {
                    holdReason += '盈利未达 +' + strategy.trailProfitPct + '% 移动止盈线，止盈参考仍为 ' +
                        sellMaConfig.baseLabel + '。'
                } else {
                    holdReason += '止盈参考 ' + sellMaConfig.baseLabel + '。'
                }
            } else {
                holdReason += '移动止盈已关闭，仅按 ' + sellMaConfig.baseLabel + ' 均线信号判断。'
            }
            var refPrices = buildHoldAdviceRefPrices(strategy, sellMaConfig, simEntry, useTrail, sellLine)
            return { action: 'hold', label: '建议持有', reason: holdReason, refPrices: refPrices }
        }

        function getCnHeldPositionAdvice(close, market, strategy, sellMaConfig, simEntry) {
            return getHeldPositionAdvice(close, market, strategy, sellMaConfig, simEntry)
        }

        function getMarketTradeAdvice(klines, currentPrice, market, strategy, position) {
            var maPeriods = resolveStrategyMaPeriods(strategy, market)
            if (!klines || klines.length < maPeriods.baseMaDays + 1) {
                return {
                    action: 'unknown',
                    label: '数据不足',
                    reason: '历史数据不足，无法根据 MA' + maPeriods.baseMaDays + ' 策略判断。'
                }
            }
            var state = replaySignalsBeforeToday(klines, strategy, market)
            var lastIdx = klines.length - 1
            var close = getBarEffectiveClose(klines, lastIdx, currentPrice, market)
            if (close == null) {
                return { action: 'unknown', label: '数据不足', reason: '暂无有效价格。' }
            }
            var baseMa = getLatestMa(klines, currentPrice, market, maPeriods.baseMaDays)
            var trailMa = getLatestMa(klines, currentPrice, market, maPeriods.trailMaDays)
            var maBaseLabel = 'MA' + maPeriods.baseMaDays
            var maTrailLabel = 'MA' + maPeriods.trailMaDays
            var priceStr = formatPrice(close, market)
            var buyLine, streak, todayMeetsBuy, sellLabel, delay

            if (position && position.held) {
                if (state.pendingSell) {
                    sellLabel = getCnSellAdviceLabel(state.pendingSellReason)
                    return {
                        action: 'sell',
                        label: sellLabel,
                        reason: formatTradeDelayPendingNote(strategy, sellLabel),
                        refPrices: buildSellAdviceRefPrices(state.pendingSellReason || 'signal', strategy, {
                            baseMa: baseMa,
                            trailMa: trailMa,
                            baseLabel: maBaseLabel,
                            trailLabel: maTrailLabel
                        }, position.costPrice, close)
                    }
                }
                return getHeldPositionAdvice(close, market, strategy, {
                    baseMa: baseMa,
                    trailMa: trailMa,
                    baseLabel: maBaseLabel,
                    trailLabel: maTrailLabel
                }, position.costPrice)
            }

            if (state.pendingBuy) {
                buyLine = baseMa != null ? baseMa * strategy.buyThreshold : null
                return {
                    action: 'add',
                    label: '建议买入',
                    reason: formatTradeDelayPendingNote(strategy, '买入'),
                    refPrices: buyLine != null ? [{ label: '买', op: 'gt', price: buyLine }] : []
                }
            }

            buyLine = baseMa != null ? baseMa * strategy.buyThreshold : null
            streak = state.buyStreak
            todayMeetsBuy = baseMa != null && close > buyLine
            if (todayMeetsBuy) {
                streak++
            } else {
                streak = 0
            }

            delay = getTradeDelayDays(strategy)
            if (streak >= strategy.confirmDays) {
                return {
                    action: delay > 0 ? 'watch' : 'add',
                    label: delay > 0 ? '建议观望' : '建议买入',
                    reason: '已连续 ' + strategy.confirmDays + ' 日收盘价高于 ' + maBaseLabel + '×' + strategy.buyThreshold +
                        '（' + formatThresholdOffset(strategy.buyThreshold) + '），' +
                        formatTradeDelayAdviceNote(strategy, '买入'),
                    refPrices: buyLine != null ? [{ label: '买', op: 'gt', price: buyLine }] : []
                }
            }
            if (streak > 0) {
                return {
                    action: 'watch',
                    label: '建议观望',
                    reason: '空仓。已连续 ' + streak + ' 日满足买入条件（需连续 ' + strategy.confirmDays + ' 日）。当前价 ' + priceStr +
                        ' > ' + maBaseLabel + '×' + strategy.buyThreshold + '（' + formatPrice(buyLine, market) + '）。',
                    refPrices: buyLine != null ? [{ label: '买', op: 'gt', price: buyLine }] : []
                }
            }
            return {
                action: 'watch',
                label: '建议观望',
                reason: '空仓。当前价 ' + priceStr + (baseMa != null
                    ? ' 未连续满足买入条件（需收盘价 > ' + maBaseLabel + '×' + strategy.buyThreshold +
                        '，即 ' + formatPrice(buyLine, market) + '，并连续 ' + strategy.confirmDays + ' 日确认）。'
                    : '，均线数据不足。'),
                refPrices: buyLine != null ? [{ label: '买', op: 'gt', price: buyLine }] : []
            }
        }

        function getTradeAdvice(klines, currentPrice, market, itemId) {
            var strategy = getTradeStrategy(market)
            if (!klines || klines.length < 5) {
                return { action: 'unknown', label: '数据不足', reason: '历史数据不足，无法判断。' }
            }
            var position = getHoldPosition(itemId)
            return getMarketTradeAdvice(klines, currentPrice, market, strategy, position)
        }

        function buildFundNameHtml(name) {
            var text = name || ''
            return '<span class="fund-name-text" title="' + escapeHtml(text) + '">' + escapeHtml(text) + '</span>'
        }

        function buildAdviceRefPricesHtml(advice, market) {
            if (!advice) return ''
            var refs = advice.refPrices
            if (!refs || !refs.length) return ''
            var html = '<div class="signal-advice-refs">'
            refs.forEach(function (ref) {
                if (!ref || ref.price == null || ref.price <= 0) return
                var op = ref.op === 'gt' ? '>' : '<'
                var cls = ref.op === 'gt' ? 'up' : 'down'
                var label = ref.label || (ref.op === 'gt' ? '买' : '卖')
                html += '<div class="signal-ref-row ' + cls + '">' + escapeHtml(label) +
                    ' ' + op + ' ' + formatPrice(ref.price, market) + '</div>'
            })
            html += '</div>'
            return html

        function buildSignalAdviceHtml(advice, market) {

        function pushSimOperation(operations, date, action, price, startEquity, equity, note) {
            operations.push({

            })
