<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETF 投资辅助分析</title>
    <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0 !important; }

        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --surface-2: #21262d;
            --border: #30363d;
            --text: #e6edf3;
            --text-muted: #8b949e;
            --primary: #388bfd;
            --primary-hover: #1f6feb;
            --up: #f85149;
            --up-bg: rgba(248, 81, 73, .15);
            --down: #3fb950;
            --down-bg: rgba(63, 185, 80, .15);
            --red: #f85149;
            --green: #3fb950;
            --red-bg: rgba(248, 81, 73, .15);
            --green-bg: rgba(63, 185, 80, .15);
            --sidebar-w: 380px;
            --shadow: 0 1px 0 rgba(255, 255, 255, .04);
            --chart-bg: #161b22;
            --chart-grid: #30363d;
            --chart-text: #8b949e;
            --scrollbar-thumb: #484f58;
            --scrollbar-thumb-hover: #6e7681;
            --scrollbar-track: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100%;
            min-height: 100vh;
            line-height: 1.5;
            overflow: hidden;
        }

        html {
            height: 100%;
        }

        .app {
            display: flex;
            height: 100vh;
            min-height: 100vh;
            overflow: hidden;
        }

        /* ===== Sidebar ===== */
        .sidebar {
            width: var(--sidebar-w);
            min-width: var(--sidebar-w);
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .sidebar-header p {
            font-size: .8rem;
            color: var(--text-muted);
        }

        .search-form {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .form-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-row label {
            font-size: .75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: .04em;
        }

        select, input[type="text"] {
            padding: 8px 12px;
            border: 1px solid var(--border);
            font-size: .9rem;
            background: var(--surface-2);
            color: var(--text);
            outline: none;
            transition: border-color .15s;
        }

        select:focus, input[type="text"]:focus {
            border-color: var(--primary);
        }

        .search-row {
            display: flex;
            gap: 8px;
        }

        .search-row input { flex: 1; }

        .btn {
            padding: 8px 16px;
            border: none;
            font-size: .875rem;
            font-weight: 600;
            cursor: pointer;
            transition: background .15s, opacity .15s;
            white-space: nowrap;
        }

        .btn:disabled { opacity: .5; cursor: not-allowed; }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }

        .btn-success {
            background: var(--green);
            color: #fff;
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }

        .btn-success:hover:not(:disabled) { background: #2ea043; }

        .btn-ghost {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 4px 10px;
            font-size: .8rem;
        }

        .btn-ghost:hover { background: var(--surface-2); }

        .detail-panel,
        .sim-detail-table-wrap {
            scrollbar-width: thin;
            scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
        }

        .detail-panel::-webkit-scrollbar,
        .sim-detail-table-wrap::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .detail-panel::-webkit-scrollbar-track,
        .sim-detail-table-wrap::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
        }

        .detail-panel::-webkit-scrollbar-thumb,
        .sim-detail-table-wrap::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
        }

        .detail-panel::-webkit-scrollbar-thumb:hover,
        .sim-detail-table-wrap::-webkit-scrollbar-thumb:hover {
            background: var(--scrollbar-thumb-hover);
        }

        .detail-panel {
            flex: 1;
            padding: 16px 20px 24px;
            overflow-y: auto;
        }

        .detail-empty {
            text-align: center;
            color: var(--text-muted);
            padding: 40px 0;
            font-size: .9rem;
        }

        .detail-meta {
            font-size: .8rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .market-badge {
            display: inline-block;
            padding: 1px 8px;
            font-size: .7rem;
            font-weight: 600;
            background: rgba(56, 139, 253, .15);
            color: #58a6ff;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 14px;
        }

        .detail-panel .card-stats {
            flex-wrap: nowrap;
            gap: 12px;
            margin-bottom: 14px;
        }

        .detail-panel .card-stat {
            flex: 1;
            min-width: 0;
        }

        .stat-item {
            background: var(--surface-2);
            padding: 10px 12px;
        }

        .stat-label {
            font-size: .7rem;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .stat-value {
            font-size: 1rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .stat-value.up { color: var(--up); }
        .stat-value.down { color: var(--down); }

        .signal-badge-wrap {
            position: relative;
            flex-shrink: 0;
        }

        .signal-badge {
            display: inline-flex;
            align-items: center;
            padding: 3px 10px;
            font-size: .75rem;
            font-weight: 700;
            white-space: nowrap;
            cursor: default;
        }

        .signal-badge.add { background: var(--up-bg); color: var(--up); }
        .signal-badge.hold { background: rgba(139, 148, 158, .18); color: var(--text-muted); }
        .signal-badge.sell { background: var(--down-bg); color: var(--down); }

        .signal-advice-popup {
            min-width: 280px;
            max-width: 360px;
        }

        .signal-advice-reason {
            font-size: .78rem;
            line-height: 1.55;
            color: var(--text);
        }

        .card-header .signal-badge-wrap .flow-hover-popup,
        .detail-meta-row .signal-badge-wrap .flow-hover-popup {
            top: calc(100% + 4px);
            bottom: auto;
            left: auto;
            right: 0;
        }

        .detail-meta-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .detail-meta-row .detail-meta {
            margin-bottom: 0;
        }

        .chart-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 8px;
        }

        .chart-tab {
            padding: 4px 14px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            font-size: .8rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        .chart-tab.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .chart-tabs-sm {
            margin-bottom: 6px;
        }

        .chart-tabs-sm .chart-tab {
            padding: 2px 10px;
            font-size: .7rem;
        }

        .card-chart-wrap {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .chart-container,
        .mini-chart {
            position: relative;
        }

        .chart-empty {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 12px;
            text-align: center;
            color: var(--text-muted);
            font-size: .8rem;
            line-height: 1.5;
        }

        .chart-tooltip {
            position: absolute;
            z-index: 10;
            pointer-events: none;
            display: none;
            padding: 8px 10px;
            background: rgba(13, 17, 23, .95);
            color: #e6edf3;
            border: 1px solid var(--border);
            font-size: .75rem;
            line-height: 1.5;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .4);
            white-space: nowrap;
        }

        .chart-tooltip-date {
            color: #8b949e;
            margin-bottom: 2px;
        }

        .chart-tooltip-value {
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .chart-container table a,
        .mini-chart table a,
        .chart-container [class*="watermark"],
        .mini-chart [class*="watermark"] {
            display: none !important;
            visibility: hidden !important;
        }

        .chart-container {
            width: 100%;
            height: 280px;
            overflow: hidden;
            margin-bottom: 14px;
            border: 1px solid var(--border);
            background: var(--chart-bg);
        }

        .flow-section h3 {
            font-size: .8rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .flow-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .flow-item {
            display: flex;
            justify-content: space-between;
            font-size: .8rem;
            padding: 4px 0;
            border-bottom: 1px solid var(--border);
        }

        .flow-item:last-child { border-bottom: none; }

        .flow-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: .85rem;
            padding: 8px 0;
            cursor: default;
        }

        .flow-summary-label {
            color: var(--text-muted);
            font-weight: 600;
        }

        .flow-summary-value.up { color: var(--up); font-weight: 600; }
        .flow-summary-value.down { color: var(--down); font-weight: 600; }

        .flow-hover-trigger {
            position: relative;
            display: inline-block;
            cursor: default;
        }

        .flow-hover-popup {
            display: none;
            position: absolute;
            left: 0;
            right: auto;
            bottom: calc(100% + 6px);
            background: var(--surface-2);
            border: 1px solid var(--border);
            padding: 10px 12px;
            z-index: 20;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .25);
        }

        .flow-hover-trigger:hover .flow-hover-popup {
            display: block;
        }

        .flow-popup-title {
            font-size: .75rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .flow-popup-item {
            display: flex;
            justify-content: space-between;
            font-size: .8rem;
            padding: 4px 0;
            border-bottom: 1px solid var(--border);
        }

        .flow-popup-item:last-child { border-bottom: none; }

        .intro-text {
            font-size: .85rem;
            color: var(--text-muted);
            margin-bottom: 14px;
            line-height: 1.6;
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            color: var(--text-muted);
        }

        .loading-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .loading-panda {
            width: 20px;
            height: 20px;
            animation: loading-panda-spin 1s linear infinite;
            image-rendering: pixelated;
            flex-shrink: 0;
        }

        @keyframes loading-panda-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .error-msg {
            background: var(--red-bg);
            color: var(--red);
            padding: 10px 14px;
            font-size: .85rem;
            margin-bottom: 12px;
            border: 1px solid rgba(248, 81, 73, .3);
        }

        /* ===== Main ===== */
        .main {
            flex: 1;
            min-height: 0;
            padding: 24px;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .main::-webkit-scrollbar {
            display: none;
        }

        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 12px;
        }

        .main-header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .main-header h2 {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .watchlist-empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .watchlist-empty svg {
            width: 48px;
            height: 48px;
            margin-bottom: 12px;
            opacity: .3;
        }

        .cards {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background: var(--surface);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            padding: 20px;
            position: relative;
            container-type: inline-size;
            container-name: watchlist-card;
        }

        .card-body {
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            gap: 20px;
            align-items: flex-start;
        }

        .card-left {
            flex: 0 0 300px;
            width: 300px;
            min-width: 0;
        }

        .remove-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            z-index: 2;
            width: 28px;
            height: 28px;
            padding: 0;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 1.05rem;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .15s, color .15s;
        }

        .remove-btn:hover {
            background: var(--red-bg);
            color: var(--red);
        }

        .hold-position-wrap {
            position: relative;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
        }

        .hold-position-check {
            display: inline-flex;
            align-items: center;
            cursor: pointer;
            user-select: none;
            margin: 0;
            line-height: 1;
        }

        .hold-position-check input {
            width: 14px;
            height: 14px;
            margin: 0;
            cursor: pointer;
            accent-color: var(--primary);
            vertical-align: middle;
        }

        .hold-position-wrap .flow-hover-popup {
            top: calc(100% + 4px);
            bottom: auto;
            left: 0;
            right: auto;
            min-width: auto;
            white-space: nowrap;
            padding: 6px 10px;
            font-size: .72rem;
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
            font-weight: 700;
        }

        .detail-name {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .card-header-main {
            min-width: 0;
            flex: 1;
        }

        .card-symbol {
            font-size: .8rem;
            color: var(--text-muted);
        }

        .card-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            margin-bottom: 10px;
        }

        .card-stat .label {
            font-size: .7rem;
            color: var(--text-muted);
        }

        .card-stat .value {
            font-size: .95rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .card-stat .value.up { color: var(--up); }
        .card-stat .value.down { color: var(--down); }

        .card-flow {
            font-size: .8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .card-flow .flow-summary {
            justify-content: flex-start;
            gap: 12px;
            padding: 2px 0;
        }

        .card-flow .flow-popup-item {
            justify-content: flex-start;
            gap: 12px;
        }

        .card-flow .flow-hover-popup {
            top: calc(100% + 4px);
            bottom: auto;
            min-width: 220px;
        }

        .card-sim {
            font-size: .8rem;
            color: var(--text-muted);
            margin-top: 0;
        }

        .card-actual {
            font-size: .8rem;
            color: var(--text-muted);
            margin-top: 0;
        }

        .card-actual .flow-summary {
            justify-content: flex-start;
            gap: 12px;
            padding: 2px 0;
        }

        .card-sim .sim-summary-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 12px;
            width: 100%;
            padding: 2px 0;
        }

        .card-sim .sim-detail-btn {
            margin-left: auto;
            padding: 2px 10px;
            font-size: .72rem;
            line-height: 1.4;
        }

        .card-sim .flow-hover-popup {
            top: calc(100% + 4px);
            bottom: auto;
            min-width: 240px;
        }

        .sim-popup-row {
            font-size: .78rem;
            padding: 4px 0;
            border-bottom: 1px solid var(--border);
        }

        .sim-popup-row:last-of-type {
            border-bottom: none;
        }

        .sim-popup-hint {
            font-size: .7rem;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .chart-tabs-mini {
            margin-bottom: 0;
        }

        .chart-tabs-mini .chart-tab {
            padding: 2px 10px;
            font-size: .7rem;
        }

        .card-right {
            flex: 1 1 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }

        .card-right .chart-tabs {
            padding-right: 32px;
        }

        .card-right .mini-chart {
            width: calc(100% + 8px);
            margin-right: -8px;
        }

        @container watchlist-card (max-width: 599px) {
            .card-body {
                flex-direction: column;
            }

            .card-left {
                flex: none;
                width: 100%;
            }
        }

        .card.card-narrow .card-body {
            flex-direction: column;
        }

        .card.card-narrow .card-left {
            flex: none;
            width: 100%;
        }

        .card.card-narrow .card-right .mini-chart {
            width: 100%;
            margin-right: 0;
        }

        .mini-chart {
            width: 100%;
            height: 150px;
            border: 1px solid var(--border);
            overflow: hidden;
            background: var(--chart-bg);
        }

        .card-loading {
            display: flex;
            align-items: center;
            color: var(--text-muted);
            font-size: .85rem;
            padding: 20px 0;
        }

        .card-error {
            color: var(--red);
            font-size: .85rem;
        }

        .confirm-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, .65);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .confirm-overlay.show {
            display: flex;
        }

        .confirm-dialog {
            background: var(--surface);
            box-shadow: 0 8px 32px rgba(0, 0, 0, .5);
            padding: 24px;
            width: 100%;
            max-width: 360px;
            border: 1px solid var(--border);
        }

        .confirm-dialog p {
            font-size: .95rem;
            line-height: 1.6;
            margin-bottom: 20px;
            color: var(--text);
        }

        .confirm-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .confirm-actions .btn-cancel {
            background: var(--surface-2);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .confirm-actions .btn-cancel:hover {
            background: var(--border);
        }

        .confirm-actions .btn-danger {
            background: var(--red);
            color: #fff;
        }

        .confirm-actions .btn-danger:hover {
            background: #da3633;
        }

        .sim-detail-dialog {
            background: var(--surface);
            box-shadow: 0 8px 32px rgba(0, 0, 0, .5);
            padding: 20px 24px 24px;
            width: 100%;
            max-width: 520px;
            max-height: 80vh;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .sim-detail-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 8px;
        }

        .sim-detail-header h3 {
            font-size: 1rem;
            font-weight: 700;
            line-height: 1.4;
        }

        .sim-detail-hint {
            font-size: .75rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .sim-detail-table-wrap {
            overflow-y: auto;
            flex: 1;
            min-height: 0;
            margin-bottom: 16px;
            border: 1px solid var(--border);
        }

        .sim-detail-table {
            width: 100%;
            font-size: .78rem;
            border-collapse: collapse;
        }

        .sim-detail-table th,
        .sim-detail-table td {
            padding: 8px 10px;
            border-bottom: 1px solid var(--border);
            text-align: left;
            font-variant-numeric: tabular-nums;
        }

        .sim-detail-table th {
            position: sticky;
            top: 0;
            background: var(--surface-2);
            color: var(--text-muted);
            font-weight: 600;
        }

        .sim-detail-table tr:last-child td {
            border-bottom: none;
        }

        .sim-detail-empty {
            padding: 24px 12px;
            text-align: center;
            color: var(--text-muted);
            font-size: .85rem;
        }

        .sim-detail-table .action-buy { color: var(--up); font-weight: 600; }

    <script>
    (function () {
        'use strict'

        /* ===== 常量 ===== */
        // 可选：自建 Cloudflare Worker 代理，格式如 'https://xxx.workers.dev/?url='
        var CUSTOM_PROXY_URL = ''
        var LOCAL_DEV_PROXY_URL = 'http://localhost:8787/proxy?url='
        // 可选：FinMind 注册 token，可将限额提升至 600 次/小时，见 https://finmindtrade.com/
        var FINMIND_TOKEN = ''
        var TW_CACHE_TTL_LIGHT = 300000
        var TW_CACHE_TTL_FULL = 600000
        var STORAGE_KEY = 'etf_watchlist'
        var STRATEGY_STORAGE_KEY = 'etf_trade_strategy'
        var HOLD_POSITION_STORAGE_KEY = 'etf_hold_position'
        var REFRESH_INTERVAL = 60000
        var HISTORY_DAYS = 260
        var CHART_30DAYS = 30
        var MARKET_LABELS = { cn: '大陆', tw: '台湾' }

        function isTraditionalChineseLocale() {
            var langs = navigator.languages && navigator.languages.length
                ? Array.prototype.slice.call(navigator.languages)
                : [navigator.language || navigator.userLanguage || 'zh-CN']
            var i, lang, seenZh = false
            for (i = 0; i < langs.length; i++) {
                lang = String(langs[i] || '').toLowerCase()
                if (lang.indexOf('zh-hant') >= 0 || lang.indexOf('zh-tw') >= 0 ||
                    lang.indexOf('zh-hk') >= 0 || lang.indexOf('zh-mo') >= 0) {
                    return true
                }
                if (lang.indexOf('zh-hans') >= 0 || lang.indexOf('zh-cn') >= 0 ||
                    lang.indexOf('zh-sg') >= 0 || lang.indexOf('zh-my') >= 0) {
                    return false
                }
                if (lang === 'zh' || lang.indexOf('zh-') === 0) {
                    seenZh = true
                }
            }
            var docLang = (document.documentElement.lang || '').toLowerCase()
            if (docLang.indexOf('hant') >= 0 || docLang.indexOf('tw') >= 0 ||
                docLang.indexOf('hk') >= 0 || docLang.indexOf('mo') >= 0) {
                return true
            }
            if (docLang.indexOf('hans') >= 0 || docLang.indexOf('cn') >= 0) {
                return false
            }
            return false
        }

        function initMarketSelect() {
            var order = isTraditionalChineseLocale() ? ['tw', 'cn'] : ['cn', 'tw']
            marketSelect.innerHTML = order.map(function (m) {
                return '<option value="' + m + '">' + MARKET_LABELS[m] + '</option>'
            }).join('')
        }

        /* ===== 状态 ===== */
        var currentDetail = null
        var detailChart = null
        var detailChartMode = 'day30'
        var miniCharts = {}
        var cardChartModes = {}
        var watchlistDataCache = {}
        var watchlistPriceCache = {}
        var watchlistIntradayCache = {}
        var watchlistMetaCache = {}
        var watchlistMutualFundCache = {}
        var watchlistMarketCache = {}
        var watchlistSimCache = {}
        var refreshTimer = null
        // corsproxy.io 免费开发源前缀，见 https://corsproxy.io/
        var CORS_PROXY_IO_PREFIX = 'https://corsproxy.io/?url='
        var twDataCache = {}

        /* ===== DOM ===== */
        var searchForm = document.getElementById('searchForm')
        var marketSelect = document.getElementById('marketSelect')
        var symbolInput = document.getElementById('symbolInput')
        var searchBtn = document.getElementById('searchBtn')
        var detailPanel = document.getElementById('detailPanel')
        var watchlistContainer = document.getElementById('watchlistContainer')
        var refreshBtn = document.getElementById('refreshBtn')

        /* ===== 工具函数 ===== */
        function formatPrice(val, market) {
            if (val == null || isNaN(val)) return '--'
            var decimals = market === 'tw' ? 2 : 3
            return Number(val).toFixed(decimals)
        }

        function formatPct(val) {
            if (val == null || isNaN(val)) return '--'
            var sign = val >= 0 ? '+' : ''
            return sign + Number(val).toFixed(2) + '%'
        }

        function formatFlow(val) {
            if (val == null || isNaN(val)) return '--'
            var abs = Math.abs(val)
            var sign = val >= 0 ? '+' : '-'
            if (abs >= 1e8) return sign + (abs / 1e8).toFixed(2) + '亿'
            if (abs >= 1e4) return sign + (abs / 1e4).toFixed(2) + '万'
            return sign + abs.toFixed(0)
        }

        function debounce(fn, ms) {
            var timer
            return function () {
                var args = arguments
                var ctx = this
                clearTimeout(timer)
                timer = setTimeout(function () { fn.apply(ctx, args) }, ms)
            }
        }

        function escapeHtml(str) {
            var div = document.createElement('div')
            div.textContent = str
            return div.innerHTML
        }

        /* ===== localStorage ===== */
        function getWatchlist() {
            try {
                var raw = localStorage.getItem(STORAGE_KEY)
                return raw ? JSON.parse(raw) : []
            } catch (e) {
                return []
            }
        }

        function saveWatchlist(list) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(list))
        }

        function addToWatchlist(item) {
            var list = getWatchlist()
            if (list.some(function (w) { return w.id === item.id })) return false
            list.push(item)
            saveWatchlist(list)
            return true
        }

        function removeFromWatchlist(id) {
            var list = getWatchlist().filter(function (w) { return w.id !== id })
            saveWatchlist(list)
            clearHoldPosition(id)
        }

        function loadHoldPositionMap() {
            try {
                var raw = localStorage.getItem(HOLD_POSITION_STORAGE_KEY)
                return raw ? JSON.parse(raw) : {}
            } catch (e) {
                return {}
            }
        }

        function saveHoldPositionMap(map) {
            localStorage.setItem(HOLD_POSITION_STORAGE_KEY, JSON.stringify(map))
        }

        function getHoldPosition(itemId) {
            if (!itemId) return { held: false }
            var map = loadHoldPositionMap()
            var rec = map[itemId]
            return { held: !!(rec && rec.held) }
        }

        function setHoldPosition(itemId, held) {
            if (!itemId) return
            var map = loadHoldPositionMap()
            if (held) {
                map[itemId] = { held: true }
            } else {
                delete map[itemId]
            }
            saveHoldPositionMap(map)
        }

        function clearHoldPosition(itemId) {
            if (!itemId) return
            var map = loadHoldPositionMap()
            if (map[itemId]) {
                delete map[itemId]
                saveHoldPositionMap(map)
            }
        }

        /* ===== 均线策略（参考信号 / 图表） ===== */
        function getRefMaDays(market) {
            var s = getTradeStrategy(market)
            return market === 'tw' ? s.shortMaDays : s.baseMaDays
        }

        function getMaLabel(market) {
            return 'MA' + getRefMaDays(market)
        }

        function getLatestMa(klines, currentPrice, market, period) {
            period = Math.max(2, parseInt(period, 10) || 2)
            if (!klines || klines.length < period - 1) return null
            market = market || 'cn'

            var lastIdx = klines.length - 1
            var lastDate = klines[lastIdx].date
            var marketToday = getMarketDateString(market)
            var livePrice = currentPrice != null && !isNaN(currentPrice) ? Number(currentPrice) : null
            var sessionOpen = isMarketOpen(market)

            if (sessionOpen && livePrice != null) {
                if (lastDate === marketToday) {
                    if (klines.length < period) return null
                    var sumToday = livePrice
                    for (var i = lastIdx - period + 1; i < lastIdx; i++) sumToday += klines[i].close
                    return sumToday / period
                }
                if (klines.length < period - 1) return null
                var sumNewDay = livePrice
                for (var j = lastIdx - (period - 2); j <= lastIdx; j++) sumNewDay += klines[j].close
                return sumNewDay / period
            }

            if (klines.length < period) return null
            return calcMaSeries(klines, period)[lastIdx]
        }

        function buildDailyMaByDate(klines, currentPrice, market, period) {
            period = period || getRefMaDays(market)
            var map = {}
            var maSeries = calcMaSeries(klines, period)
            var i
            for (i = 0; i < klines.length; i++) {
                if (maSeries[i] != null) map[klines[i].date] = maSeries[i]
            }
            var latest = getLatestMa(klines, currentPrice, market, period)
            if (latest == null) return map

            var lastDate = klines[klines.length - 1].date
            var marketToday = getMarketDateString(market)
            if (lastDate === marketToday) {
                map[lastDate] = latest
            }
            return map
        }

        function calcDiffPct(price, maVal) {
            if (!price || !maVal) return null
            return ((price - maVal) / maVal) * 100
        }

        function getBarEffectiveClose(klines, index, currentPrice, market) {
            var bar = klines[index]
            if (!bar || bar.close == null || isNaN(bar.close)) return null
            if (index !== klines.length - 1) return bar.close
            var live = currentPrice != null && !isNaN(currentPrice) ? Number(currentPrice) : null
            if (live == null) return bar.close
            var marketToday = getMarketDateString(market)
            if (bar.date === marketToday || isMarketOpen(market)) return live
            return bar.close
        }

        function formatThresholdOffset(threshold) {
            var pct = (threshold - 1) * 100
            var sign = pct >= 0 ? '+' : ''
            return sign + pct.toFixed(2) + '%'
        }

        function getMarketTimezone(market) {
            if (market === 'tw') return 'Asia/Taipei'
            return 'Asia/Shanghai'
        }

        function getMarketDateString(market) {
            return new Intl.DateTimeFormat('en-CA', {
                timeZone: getMarketTimezone(market),
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            }).format(new Date())
        }

        function getMarketClock(market) {
            var tz = getMarketTimezone(market)
            var parts = new Intl.DateTimeFormat('en-US', {
                timeZone: tz,
                hour: '2-digit',
                minute: '2-digit',
                hour12: false,
                weekday: 'short'
            }).formatToParts(new Date())
            var hour = 0
            var minute = 0
            var weekday = ''
            parts.forEach(function (p) {
                if (p.type === 'hour') hour = parseInt(p.value, 10)
                if (p.type === 'minute') minute = parseInt(p.value, 10)
                if (p.type === 'weekday') weekday = p.value
            })
            return { minutes: hour * 60 + minute, weekday: weekday }
        }

        function isMarketOpen(market) {
            var clock = getMarketClock(market)
            if (clock.weekday === 'Sat' || clock.weekday === 'Sun') return false
            var m = clock.minutes
            if (market === 'cn') {
                return m >= 570 && m < 900
            }
            if (market === 'tw') {
                return m >= 540 && m < 810
            }
            return false
        }

        var MARKET_SESSION = {
            cn: { open: [9, 30], close: [15, 0] },
            tw: { open: [9, 0], close: [13, 30] }
        }

        function pad2(n) {
            return String(n).padStart(2, '0')
        }

        function getMarketClockAt(market, ms) {
            var tz = getMarketTimezone(market)
            var parts = new Intl.DateTimeFormat('en-US', {
                timeZone: tz,
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            }).formatToParts(new Date(ms))
            var y = ''
            var mo = ''
            var da = ''
            var hour = 0
            var minute = 0
            parts.forEach(function (p) {
                if (p.type === 'year') y = p.value
                if (p.type === 'month') mo = p.value
                if (p.type === 'day') da = p.value
                if (p.type === 'hour') hour = parseInt(p.value, 10)
                if (p.type === 'minute') minute = parseInt(p.value, 10)
            })
            return {
                dateStr: y + '-' + mo + '-' + da,
                hour: hour,
                minute: minute
            }
        }

        function marketLocalTimeToUnix(market, dateStr, hour, minute) {
            var y = parseInt(dateStr.slice(0, 4), 10)
            var mo = parseInt(dateStr.slice(5, 7), 10)
            var da = parseInt(dateStr.slice(8, 10), 10)
            var target = hour * 60 + minute
            var guess = Date.UTC(y, mo - 1, da, hour, minute, 0)
            for (var offset = -14; offset <= 14; offset++) {
                for (var m = 0; m < 60; m++) {
                    var t = guess + (offset * 3600000) + (m * 60000)
                    var clock = getMarketClockAt(market, t)
                    if (clock.dateStr === dateStr && clock.hour * 60 + clock.minute === target) {
                        return Math.floor(t / 1000)
                    }
                }
            }
            return Math.floor(guess / 1000)
        }

        function formatMarketTimeLabel(market, unixTime) {
            var clock = getMarketClockAt(market, unixTime * 1000)
            return pad2(clock.hour) + ':' + pad2(clock.minute)
        }

        function getSessionUnixBounds(market, tradingDate) {
            var cfg = MARKET_SESSION[market] || MARKET_SESSION.cn
            return {
                start: marketLocalTimeToUnix(market, tradingDate, cfg.open[0], cfg.open[1]),
                end: marketLocalTimeToUnix(market, tradingDate, cfg.close[0], cfg.close[1])
            }
        }

        function getAnnualKlines(klines) {
            if (!klines || klines.length < 6) return klines || []
            var cutoff = new Date()
            cutoff.setFullYear(cutoff.getFullYear() - 1)
            var cutoffStr = formatDateISO(cutoff)
            var sliced = klines.filter(function (k) { return k.date >= cutoffStr })
            if (sliced.length >= 6) return sliced
            return klines.slice(-Math.min(klines.length, 252))
        }

        function calcAnnualActualReturn(klines) {
            var yearKlines = getAnnualKlines(klines)
            if (!yearKlines || yearKlines.length < 2) return null
            var firstClose = yearKlines[0].close
            var lastClose = yearKlines[yearKlines.length - 1].close
            if (firstClose == null || isNaN(firstClose) || !firstClose) return null
            if (lastClose == null || isNaN(lastClose)) return null
            return {
                returnPct: ((lastClose - firstClose) / firstClose) * 100,
                startDate: yearKlines[0].date,
                endDate: yearKlines[yearKlines.length - 1].date
            }
        }

        function calcMaSeries(klines, period) {
            var p = Math.max(2, parseInt(period, 10) || 2)
            var result = []
            var i, j, sum
            for (i = 0; i < klines.length; i++) {
                if (i < p - 1) {
                    result.push(null)
                    continue
                }
                sum = 0
                for (j = i - p + 1; j <= i; j++) sum += klines[j].close
                result.push(sum / p)
            }
            return result
        }

        function calendarDaysBetween(fromDate, toDate) {
            var a = new Date(fromDate + 'T00:00:00')
            var b = new Date(toDate + 'T00:00:00')
            return Math.round((b.getTime() - a.getTime()) / 86400000)
        }

        function getDefaultTradeStrategies() {
            return {
                tw: {
                    shortMaDays: 5,
                    longMaDays: 10,
                    buyThreshold: 1.005,
                    sellThreshold: 0.995,
                    confirmDays: 1,
                    enableStopLoss: true,
                    stopLossPct: -3,
                    enableTrailProfit: true,
                    trailProfitPct: 5
                },
                cn: {
                    baseMaDays: 10,
                    buyThreshold: 1.005,
                    sellThreshold: 0.995,
                    confirmDays: 2,
                    enableStopLoss: true,
                    stopLossPct: -8,
                    enableTrailProfit: true,
                    trailProfitPct: 5,
                    trailMaDays: 20
                }
            }
        }

        function normalizeStrategyNumber(val, fallback) {
            var n = parseFloat(val)
            return isNaN(n) ? fallback : n
        }

        function normalizeStrategyInt(val, fallback, min) {
            var n = parseInt(val, 10)
            if (isNaN(n)) return fallback
            if (min != null && n < min) return min
            return n
        }

        function mergeTradeStrategy(raw, defaults) {
            var out = {}
            var k
            for (k in defaults) {
                if (!Object.prototype.hasOwnProperty.call(defaults, k)) continue
                var v = raw && raw[k] != null ? raw[k] : defaults[k]
                if (k.indexOf('Days') >= 0 || k === 'confirmDays') {
                    out[k] = normalizeStrategyInt(v, defaults[k], k === 'confirmDays' ? 1 : 2)
                } else if (k.indexOf('enable') === 0) {
                    out[k] = raw && Object.prototype.hasOwnProperty.call(raw, k) ? !!raw[k] : defaults[k]
                } else if (k.indexOf('Pct') >= 0) {
                    out[k] = normalizeStrategyNumber(v, defaults[k])
                } else {
                    out[k] = normalizeStrategyNumber(v, defaults[k])
                }
            }
            return out
        }

        function loadTradeStrategies() {
            var defaults = getDefaultTradeStrategies()
            try {
                var raw = localStorage.getItem(STRATEGY_STORAGE_KEY)
                if (!raw) return defaults
                var parsed = JSON.parse(raw)
                return {
                    tw: mergeTradeStrategy(parsed.tw, defaults.tw),
                    cn: mergeTradeStrategy(parsed.cn, defaults.cn)
                }
            } catch (e) {
                return defaults
            }
        }

        function saveTradeStrategies(strategies) {
            localStorage.setItem(STRATEGY_STORAGE_KEY, JSON.stringify(strategies))

        function isStopLossEnabled(strategy) {
            return strategy.enableStopLoss !== false
        }

        function isTrailProfitEnabled(strategy) {
            return strategy.enableTrailProfit !== false
        }

        function shouldUseTrailProfit(strategy, pnlPct) {
            return isTrailProfitEnabled(strategy) && pnlPct > strategy.trailProfitPct
        }

            if (market === 'tw') {

            }

        function replayTwBuySignalsBeforeToday(klines, strategy) {
            var n = klines.length
            if (n < 2) return { pendingBuy: false, buyStreak: 0, inPosition: false, entryPrice: null }
            var shortMa = calcMaSeries(klines, strategy.shortMaDays)
            var longMa = calcMaSeries(klines, strategy.longMaDays)
            var inPosition = false
            var entryPrice = 0
            var pendingBuy = false
            var buyStreak = 0
            var i, close, pnlPct, useTrail, sellMa, shouldSell

            for (i = 0; i < n - 1; i++) {
                close = klines[i].close
                if (close == null || isNaN(close)) continue

                if (pendingBuy && !inPosition) {
                    inPosition = true
                    entryPrice = close
                    pendingBuy = false
                }
                if (inPosition) {
                    pnlPct = entryPrice ? ((close - entryPrice) / entryPrice) * 100 : 0
                    shouldSell = false
                    if (isStopLossEnabled(strategy) && pnlPct <= strategy.stopLossPct) {
                        shouldSell = true
                    } else {
                        useTrail = shouldUseTrailProfit(strategy, pnlPct)
                        sellMa = useTrail ? longMa[i] : shortMa[i]
                        if (sellMa != null && close < sellMa * strategy.sellThreshold) {
                            shouldSell = true
                        }
                    }
                    if (shouldSell) inPosition = false
                }
                if (!inPosition && !pendingBuy && shortMa[i] != null) {
                    if (close > shortMa[i] * strategy.buyThreshold) {
                        buyStreak++
                    } else {
                        buyStreak = 0
                    }
                    if (buyStreak >= strategy.confirmDays) {
                        pendingBuy = true
                        buyStreak = 0
                    }
                }
            }
            return {
                pendingBuy: pendingBuy,
                buyStreak: buyStreak,
                inPosition: inPosition,
                entryPrice: inPosition ? entryPrice : null
            }
        }

        function getHeldPositionAdvice(close, market, strategy, sellMaConfig, simEntry) {
            var priceStr = formatPrice(close, market)
            var useTrail = false
            var pnlPct = null
            var sellMaVal, sellMaLabel, sellLine, holdReason, hasSimEntry

            hasSimEntry = simEntry != null && simEntry > 0
            if (hasSimEntry) {
                pnlPct = ((close - simEntry) / simEntry) * 100
                useTrail = shouldUseTrailProfit(strategy, pnlPct)
                if (isStopLossEnabled(strategy) && pnlPct <= strategy.stopLossPct) {
                    return {
                        action: 'sell',
                        label: '建议抛出',
                        reason: '当前价 ' + priceStr + ' 触发紧急止损线 ' + strategy.stopLossPct + '%。'
                    }
                }
            }

            sellMaVal = useTrail ? sellMaConfig.trailMa : sellMaConfig.baseMa
            sellMaLabel = useTrail ? sellMaConfig.trailLabel : sellMaConfig.baseLabel
            if (sellMaVal != null) {
                sellLine = sellMaVal * strategy.sellThreshold
                if (close < sellLine) {
                    return {
                        action: 'sell',
                        label: '建议抛出',
                        reason: useTrail
                            ? '盈利已超过 +' + strategy.trailProfitPct + '% 移动止盈线，按 ' + sellMaLabel +
                                ' 判断：当前价 ' + priceStr + ' 低于 ' + sellMaLabel + '×' + strategy.sellThreshold +
                                '（' + formatPrice(sellLine, market) + '）。'
                            : '当前价 ' + priceStr + ' 低于 ' + sellMaLabel + '×' + strategy.sellThreshold +
                                '（' + formatPrice(sellLine, market) + '），满足卖出条件。'
                    }
                }
            }
            holdReason = '当前价 ' + priceStr + ' 仍高于卖出线 ' + sellMaLabel + '×' + strategy.sellThreshold +
                '（' + formatPrice(sellLine, market) + '），暂不满足卖出。'
            if (isTrailProfitEnabled(strategy)) {
                if (hasSimEntry && useTrail) {
                    holdReason += '盈利已过 +' + strategy.trailProfitPct + '% 移动止盈线，止盈参考已改用 ' +
                        sellMaConfig.trailLabel + '（原为 ' + sellMaConfig.baseLabel + '）。'
                } else if (hasSimEntry) {
                    holdReason += '盈利未达 +' + strategy.trailProfitPct + '% 移动止盈线，止盈参考仍为 ' +
                        sellMaConfig.baseLabel + '。'
                } else {
                    holdReason += '止盈参考 ' + sellMaConfig.baseLabel + '。'
                }
            } else {
                holdReason += '移动止盈已关闭，仅按 ' + sellMaConfig.baseLabel + ' 均线信号判断。'
            }
            return { action: 'hold', label: '建议持有', reason: holdReason }
        }

        function getTwTradeAdvice(klines, currentPrice, market, strategy, position) {
            if (!klines || klines.length < strategy.shortMaDays + 1) {
                return {
                    action: 'unknown',
                    label: '数据不足',
                    reason: '历史数据不足，无法根据 MA' + strategy.shortMaDays + ' 策略判断。'
                }
            }
            var state = replayTwBuySignalsBeforeToday(klines, strategy)
            var lastIdx = klines.length - 1
            var close = getBarEffectiveClose(klines, lastIdx, currentPrice, market)
            if (close == null) {
                return { action: 'unknown', label: '数据不足', reason: '暂无有效价格。' }
            }
            var shortMa = getLatestMa(klines, currentPrice, market, strategy.shortMaDays)
            var longMa = getLatestMa(klines, currentPrice, market, strategy.longMaDays)
            var maShortLabel = 'MA' + strategy.shortMaDays
            var priceStr = formatPrice(close, market)
            var buyLine, streak, todayMeetsBuy

            if (position && position.held) {
                return getHeldPositionAdvice(close, market, strategy, {
                    baseMa: shortMa,
                    trailMa: longMa,
                    baseLabel: maShortLabel,
                    trailLabel: 'MA' + strategy.longMaDays
                }, state.inPosition ? state.entryPrice : null)
            }

            if (state.pendingBuy) {
                return {
                    action: 'add',
                    label: '建议买入',
                    reason: '前 ' + strategy.confirmDays + ' 个交易日已连续满足买入条件，今日收盘确认买入。'
                }
            }

            buyLine = shortMa != null ? shortMa * strategy.buyThreshold : null
            streak = state.buyStreak
            todayMeetsBuy = shortMa != null && close > buyLine
            if (todayMeetsBuy) {
                streak++
            } else {
                streak = 0
            }

            if (streak >= strategy.confirmDays) {
                return {
                    action: 'none',
                    label: '',
                    reason: '空仓。已连续 ' + strategy.confirmDays + ' 日收盘价高于 ' + maShortLabel + '×' + strategy.buyThreshold +
                        '（' + formatThresholdOffset(strategy.buyThreshold) + '），今日收盘后将触发买入信号，明日收盘确认买入。'
                }
            }
            if (streak > 0) {
                return {
                    action: 'none',
                    label: '',
                    reason: '空仓。已连续 ' + streak + ' 日满足买入条件（需连续 ' + strategy.confirmDays + ' 日）。当前价 ' + priceStr +
                        ' > ' + maShortLabel + '×' + strategy.buyThreshold + '（' + formatPrice(buyLine, market) + '）。'
                }
            }
            return {
                action: 'none',
                label: '',
                reason: '空仓。当前价 ' + priceStr + (shortMa != null
                    ? ' 未连续满足买入条件（需收盘价 > ' + maShortLabel + '×' + strategy.buyThreshold +
                        ' 并连续 ' + strategy.confirmDays + ' 日确认）。'
                    : '，均线数据不足。')
            }
        }

        function pushSimOperation(operations, date, action, price, startEquity, equity, note) {
            operations.push({
                date: date,
                action: action,
                price: price,
                valuePct: startEquity ? (equity / startEquity) * 100 : 100,
                note: note || ''
            })
        }

        function finalizeSimResult(equityCurve, yearKlines, buyCount, sellCount, operations) {
            if (!equityCurve.length) return null
            var startEquity = equityCurve[0].equity
            var finalEquity = equityCurve[equityCurve.length - 1].equity
            var returnPct = startEquity ? ((finalEquity - startEquity) / startEquity) * 100 : 0
            var maxProfitPoint = { date: equityCurve[0].date, returnPct: 0 }
            var maxDrawdownPoint = { date: equityCurve[0].date, returnPct: 0 }
            var i
            for (i = 0; i < equityCurve.length; i++) {
                var point = equityCurve[i]
                var retFromStart = startEquity ? ((point.equity - startEquity) / startEquity) * 100 : 0
                if (retFromStart > maxProfitPoint.returnPct) {
                    maxProfitPoint = { date: point.date, returnPct: retFromStart }
                }
                if (retFromStart < maxDrawdownPoint.returnPct) {
                    maxDrawdownPoint = { date: point.date, returnPct: retFromStart }
                }
            }
            return {
                returnPct: returnPct,
                buyCount: buyCount,
                sellCount: sellCount,
                maxProfitPoint: maxProfitPoint,
                maxDrawdownPoint: maxDrawdownPoint,
                startDate: yearKlines[0].date,
                endDate: yearKlines[yearKlines.length - 1].date,
                operations: operations
            }
        }

        function simulateTwAnnualReturn(yearKlines, strategy) {
            var shortMa = calcMaSeries(yearKlines, strategy.shortMaDays)
            var longMa = calcMaSeries(yearKlines, strategy.longMaDays)
            var n = yearKlines.length
            var cash = 1
            var shares = 0
            var inPosition = false
            var entryPrice = 0
            var buyStreak = 0
            var pendingBuy = false
            var buyCount = 0
            var sellCount = 0
            var equityCurve = []
            var operations = []
            var startEquity = 1
            var i, bar, close, pnlPct, useTrail, sellMa, sellLine

            for (i = 0; i < n; i++) {
                bar = yearKlines[i]
                close = bar.close
                if (close == null || isNaN(close)) continue

                if (pendingBuy && !inPosition && cash > 0) {
                    shares = cash / close
                    cash = 0
                    inPosition = true
                    entryPrice = close
                    pendingBuy = false
                    buyCount++
                    pushSimOperation(operations, bar.date, 'buy', close, startEquity, shares * close, '确认买入')
                }

                if (inPosition && shares > 0) {
                    pnlPct = entryPrice ? ((close - entryPrice) / entryPrice) * 100 : 0
                    if (isStopLossEnabled(strategy) && pnlPct <= strategy.stopLossPct) {
                        cash = shares * close
                        shares = 0
                        inPosition = false
                        sellCount++
                        pushSimOperation(operations, bar.date, 'sell', close, startEquity, cash, '止损')
                    } else {
                        useTrail = shouldUseTrailProfit(strategy, pnlPct)
                        sellMa = useTrail ? longMa[i] : shortMa[i]
                        if (sellMa != null) {
                            sellLine = sellMa * strategy.sellThreshold
                            if (close < sellLine) {
                                cash = shares * close
                                shares = 0
                                inPosition = false
                                sellCount++
                                pushSimOperation(operations, bar.date, 'sell', close, startEquity, cash,
                                    useTrail ? '移动止盈' : '信号')
                            }
                        }
                    }
                }

                if (!inPosition && !pendingBuy && shortMa[i] != null) {
                    if (close > shortMa[i] * strategy.buyThreshold) {
                        buyStreak++
                    } else {
                        buyStreak = 0
                    }
                    if (buyStreak >= strategy.confirmDays) {
                        pendingBuy = true
                        buyStreak = 0
                    }
                }

                equityCurve.push({
                    date: bar.date,
                    equity: inPosition ? shares * close : cash
                })
            }

            return finalizeSimResult(equityCurve, yearKlines, buyCount, sellCount, operations)
        }

        function isPrivateLanHost(host) {
            if (/^192\.168\.\d{1,3}\.\d{1,3}$/.test(host)) return true
            if (/^10\.\d{1,3}\.\d{1,3}\.\d{1,3}$/.test(host)) return true
            if (/^172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}$/.test(host)) return true
            return false
        }

        function isCorsProxyFreeOrigin() {
            var host = (location.hostname || '').toLowerCase()
            var proto = (location.protocol || '').toLowerCase()
            if (!host && proto !== 'file:') return false
            if (host === 'localhost' || host === '127.0.0.1') return true
            if (isPrivateLanHost(host)) return true
            if (proto === 'capacitor:' || proto === 'ionic:') return true

            var freeSuffixes = [
                '.github.io', '.github.dev',
                '.codesandbox.io', '.csb.app',
                '.stackblitz.io', '.stackblitz.com',

            }

        async function fetchRemote(url, options) {
            options = options || {}
            var fetchOpts = {}
            if (options.headers) fetchOpts.headers = options.headers
            var asJson = options.asJson === true
            var allowHtml = options.allowHtml === true

            async function parseResponse(resp) {
                if (!resp.ok) throw new Error('HTTP ' + resp.status)
                var text = await resp.text()
                if (!allowHtml && text.trim().charAt(0) === '<') {
                    throw new Error('接口返回异常')
                }
                return asJson ? JSON.parse(text) : text
            }

            var lastErr = null
            try {
                return await parseResponse(await fetch(url, fetchOpts))
            } catch (e) {
                lastErr = e
            }

            var proxies = buildCorsProxyUrls(url)
            for (var i = 0; i < proxies.length; i++) {
                try {
                    return await parseResponse(await fetch(proxies[i], fetchOpts))
                } catch (e) {
                    lastErr = e
                }
            }

            if (lastErr && lastErr.message === 'Failed to fetch') {
                throw new Error('网络请求失败，请检查网络连接后重试')
            }
            throw lastErr || new Error('网络请求失败')
        }

        async function fetchFinMindTWData(symbol, options) {
            options = options || {}
            var code = normalizeTWSymbol(symbol)
            if (!code) throw new Error('请输入有效的台湾 ETF 代码，如 0050 或 00685L')

            var endDate = formatDateISO(new Date())
            var start = new Date()
            start.setFullYear(start.getFullYear() - 1)
            var startDate = formatDateISO(start)
            var klines

            if (options.lightweight && options.cachedData && options.cachedData.klines && options.cachedData.klines.length) {
                var shortStart = new Date()
                shortStart.setDate(shortStart.getDate() - 14)
                try {
                    var recentRows = await fetchFinMindTWKlines(code, formatDateISO(shortStart), endDate)
                    klines = mergeTWKlines(options.cachedData.klines, recentRows)
                } catch (e) {
                    if (isFinMindRateLimitError(e)) throw e
                    klines = options.cachedData.klines
                }
            } else {
                klines = await fetchFinMindTWKlines(code, startDate, endDate)
            }

            var last = klines[klines.length - 1]
            var name = (options.cachedData && options.cachedData.name) || code

            if (!options.lightweight) {
                try {
                    var infoUrl = 'https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockInfo&data_id=' +
                        encodeURIComponent(code)
                    var infoData = await fetchFinMindJSON(infoUrl)
                    if (infoData && infoData.data && infoData.data[0] && infoData.data[0].stock_name) {
                        name = infoData.data[0].stock_name
                    }
                } catch (e) { /* ignore */ }
            }

            var flow = []
            var flowLabel = '成交量（量能参考）'
            if (options.lightweight && options.cachedData && options.cachedData.flow && options.cachedData.flow.length) {
                flow = options.cachedData.flow
                flowLabel = options.cachedData.flowLabel || flowLabel
            } else if (!options.lightweight) {
                try {
                    var flowStart = new Date()
                    flowStart.setDate(flowStart.getDate() - 40)
                    var flowUrl = 'https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockInstitutionalInvestorsBuySell&data_id=' +
                        encodeURIComponent(code) + '&start_date=' + formatDateISO(flowStart) + '&end_date=' + endDate
                    var flowData = await fetchFinMindJSON(flowUrl)
                    if (flowData && flowData.data && flowData.data.length) {
                        var byDate = {}
                        flowData.data.forEach(function (row) {
                            if (!byDate[row.date]) byDate[row.date] = 0
                            byDate[row.date] += (row.buy || 0) - (row.sell || 0)
                        })
                        flow = Object.keys(byDate).sort().slice(-10).map(function (date) {
                            return { date: date, mainNet: byDate[date] }
                        })
                        if (flow.length) flowLabel = '机构资金流向'
                    }
                } catch (e) { /* ignore */ }
            }

            if (!flow.length) {
                for (var j = Math.max(0, klines.length - 5); j < klines.length; j++) {
                    flow.push({ date: klines[j].date, mainNet: klines[j].volume || 0 })
                }
            }

            var payload = {
                market: 'tw',
                symbol: code,
                name: name,
                price: last.close,
                changePct: last.changePct,
                klines: klines,
                flow: flow,
                flowLabel: flowLabel,
                secid: null
            }

            if (options.skipIntraday) return payload
            return enrichWithIntraday(payload)
        }

        async function fetchYahooTWData(symbol, options) {
            options = options || {}
            var code = normalizeTWSymbol(symbol)
            var ySymbol = code + '.TW'
            var url = 'https://query1.finance.yahoo.com/v8/finance/chart/' + encodeURIComponent(ySymbol) +
                '?interval=1d&range=1y&includePrePost=false'
            var data = await fetchJSON(url)
            if (!data || !data.chart || !data.chart.result || !data.chart.result[0]) {
                throw new Error('未找到该 ETF，请检查代码是否正确（如 0050、00685L）')
            }

            var result = data.chart.result[0]
            var meta = result.meta
            var timestamps = result.timestamp || []
            var q = result.indicators.quote[0]
            var klines = []

            for (var i = 0; i < timestamps.length; i++) {
                if (q.close[i] == null) continue
                var d = new Date(timestamps[i] * 1000)
                var dateStr = d.getFullYear() + '-' +
                    String(d.getMonth() + 1).padStart(2, '0') + '-' +
                    String(d.getDate()).padStart(2, '0')
                var prevClose = i > 0 && q.close[i - 1] != null ? q.close[i - 1] : q.close[i]
                var changePct = prevClose ? ((q.close[i] - prevClose) / prevClose) * 100 : 0
                klines.push({
                    date: dateStr,
                    open: q.open[i],
                    close: q.close[i],
                    high: q.high[i],
                    low: q.low[i],
                    volume: q.volume[i],
                    changePct: changePct
                })
            }

            if (!klines.length) throw new Error('暂无 K 线数据')

            var last = klines[klines.length - 1]
            var flow = []
            for (var j = Math.max(0, klines.length - 5); j < klines.length; j++) {
                flow.push({ date: klines[j].date, mainNet: klines[j].volume || 0 })
            }

            var payload = {
                market: 'tw',
                symbol: code,
                name: meta.longName || meta.shortName || code,
                price: meta.regularMarketPrice || last.close,
                changePct: last.changePct,
                klines: klines.slice(-HISTORY_DAYS),
                flow: flow,
                flowLabel: '成交量（量能参考）',
                secid: null
            }

            if (options.skipIntraday) return payload
            return enrichWithIntraday(payload)
        }

        async function fetchTWData(symbol, options) {
            options = options || {}
            var code = normalizeTWSymbol(symbol)
            if (!code) throw new Error('请输入有效的台湾 ETF 代码，如 0050 或 00685L')

            var cached = twDataCache[code]
            if (options.useCache !== false && cached && cached.data) {
                var ttl = options.lightweight ? TW_CACHE_TTL_LIGHT : TW_CACHE_TTL_FULL
                if (Date.now() - cached.ts < ttl) {
                    return cached.data
                }
            }

            if (options.lightweight && cached && cached.data) {
                try {
                    var lightData = await fetchFinMindTWData(code, {
                        lightweight: true,
                        cachedData: cached.data,
                        skipIntraday: true
                    })
                    twDataCache[code] = { data: lightData, ts: Date.now() }
                    return lightData
                } catch (e) {
                    if (cached.data) return cached.data
                }
            }

            try {
                var finData = await fetchFinMindTWData(code, {
                    skipIntraday: !!options.skipIntraday
                })
                twDataCache[code] = { data: finData, ts: Date.now() }
                return finData
            } catch (finErr) {
                try {
                    var yahooData = await fetchYahooTWData(code, {
                        skipIntraday: !!options.skipIntraday
                    })
                    twDataCache[code] = { data: yahooData, ts: Date.now() }
                    return yahooData
                } catch (yahooErr) {
                    if (cached && cached.data) return cached.data
                    if (isFinMindRateLimitError(finErr)) {
                        throw new Error('台湾 ETF 数据请求已达 FinMind 上限（约 300 次/小时），请稍后再试或使用备用源')
                    }
                    if (finErr.message === 'Failed to fetch' || yahooErr.message === 'Failed to fetch') {
                        throw new Error('台湾 ETF 数据加载失败，请检查网络连接后重试')
                    }
                    throw finErr
                }
            }
        }

        function aggregateKlinesBy5Days(klines) {
            var result = []
            for (var i = 0; i < klines.length; i += 5) {
                var chunk = klines.slice(i, i + 5)
                if (!chunk.length) continue
                var high = chunk[0].high
                var low = chunk[0].low
                for (var j = 1; j < chunk.length; j++) {
                    if (chunk[j].high > high) high = chunk[j].high
                    if (chunk[j].low < low) low = chunk[j].low
                }
                result.push({
                    date: chunk[chunk.length - 1].date,
                    open: chunk[0].open,
                    close: chunk[chunk.length - 1].close,
                    high: high,
                    low: low,
                    volume: chunk.reduce(function (sum, k) { return sum + (k.volume || 0) }, 0)
                })
            }
            return result
        }

        function attachIntradayTooltip(chart, container, intraday, market) {
            var tooltip = document.createElement('div')
            tooltip.className = 'chart-tooltip'
            container.appendChild(tooltip)

            chart.subscribeCrosshairMove(function (param) {
                if (!param.time || !param.point ||
                    param.point.x < 0 || param.point.y < 0 ||
                    param.point.x > container.clientWidth ||
                    param.point.y > container.clientHeight) {
                    tooltip.style.display = 'none'
                    return
                }

                var price = null
                if (param.seriesData) {
                    param.seriesData.forEach(function (v) {
                        if (v && v.value != null && !isNaN(v.value)) price = v.value
                    })
                }
                if (price == null) {
                    tooltip.style.display = 'none'
                    return
                }

                var ts = typeof param.time === 'number' ? param.time : null
                if (!ts) {
                    tooltip.style.display = 'none'
                    return
                }

                tooltip.innerHTML =
                    '<div class="chart-tooltip-date">' + escapeHtml(formatMarketTimeLabel(market, ts)) + '</div>' +
                    '<div class="chart-tooltip-value">价格：' + formatPrice(price, market) + '</div>'
                tooltip.style.display = 'block'

                var pad = 10
                var maxX = container.clientWidth - tooltip.offsetWidth - pad
                var maxY = container.clientHeight - tooltip.offsetHeight - pad
                var x = param.point.x + 14
                var y = param.point.y + 14
                if (x > maxX) x = param.point.x - tooltip.offsetWidth - 14
                if (y > maxY) y = param.point.y - tooltip.offsetHeight - 14
                tooltip.style.left = Math.max(pad, x) + 'px'
                tooltip.style.top = Math.max(pad, y) + 'px'

        function buildValueByDate(mode, klines, currentPrice, market) {
            var map = {}
            var maPeriod = getRefMaDays(market)
            var maLabel = getMaLabel(market)
            var dailyMaByDate = buildDailyMaByDate(klines, currentPrice, market, maPeriod)
            if (mode === 'year5d') {
                var dailyYear = klines.slice(-HISTORY_DAYS)
                var aggKlines = aggregateKlinesBy5Days(dailyYear)
                aggKlines.forEach(function (k) {
                    if (dailyMaByDate[k.date] != null) {
                        map[k.date] = dailyMaByDate[k.date]
                    }
                })
            } else {
                var daily30 = klines.slice(-CHART_30DAYS)
                var marketToday = getMarketDateString(market)
                var livePrice = currentPrice != null && !isNaN(currentPrice) ? Number(currentPrice) : null
                var sessionOpen = isMarketOpen(market)
                daily30.forEach(function (k) {
                    var close = k.close
                    if (sessionOpen && livePrice != null && k.date === marketToday) {
                        close = livePrice
                    }
                    map[k.date] = {
                        close: close,
                        ma: dailyMaByDate[k.date] != null ? dailyMaByDate[k.date] : null
                    }
                })
            }
            map._maLabel = maLabel
            return map
        }

        function buildSimDetailTableHtml(cached) {
            var sim = cached.sim
            var market = cached.market
            var ops = sim.operations || []
            if (!ops.length) {
                return '<div class="sim-detail-empty">模拟期内无买卖操作</div>'
            }
            var rows = ''
            var prevPrice = null
            ops.forEach(function (op) {
                var actionCls = op.action === 'buy' ? 'action-buy' : 'action-sell'
                var actionLabel = op.action === 'buy' ? '买入' : '卖出'
                var valueCls = op.valuePct >= 100 ? 'up' : 'down'
                var priceDeltaHtml = ''
                if (prevPrice != null && prevPrice > 0) {
                    var priceChg = ((op.price - prevPrice) / prevPrice) * 100
                    var deltaCls
                    if (op.action === 'buy') {
                        deltaCls = priceChg >= 0 ? 'down' : 'up'
                    } else {
                        deltaCls = priceChg >= 0 ? 'up' : 'down'
                    }
                    priceDeltaHtml = '<span class="sim-price-delta ' + deltaCls + '">(' + formatPct(priceChg) + ')</span>'
                } else {
                    priceDeltaHtml = '<span class="sim-price-delta muted">(--)</span>'
                }
                prevPrice = op.price
                rows += '<tr>' +
                    '<td>' + escapeHtml(op.date) + '</td>' +
                    '<td class="' + actionCls + '">' + actionLabel + (op.note ? ' · ' + escapeHtml(op.note) : '') + '</td>' +
                    '<td>' + formatPrice(op.price, market) + priceDeltaHtml + '</td>' +
                    '<td class="' + valueCls + '">' + formatSimValuePct(op.valuePct) + '</td>' +
                '</tr>'
            })
            return '<table class="sim-detail-table">' +
                '<thead><tr><th>日期</th><th>操作</th><th>成交价</th><th>账户净值</th></tr></thead>' +
                '<tbody>' + rows + '</tbody>' +
            '</table>'
        }

            tabsEl.querySelectorAll('.strategy-tab').forEach(function (t) {

            var panel = document.getElementById('strategyPanel-' + market)
            if (!panel) return defaults
            var raw = {}
            panel.querySelectorAll('input[data-key]').forEach(function (input) {
                if (input.type === 'checkbox') {
                    raw[input.dataset.key] = input.checked
                } else {
                    raw[input.dataset.key] = input.value
                }
            })
            return mergeTradeStrategy(raw, defaults)

                panel.querySelectorAll('input[data-key]').forEach(function (input) {
                    var key = input.dataset.key
                    if (input.type === 'checkbox') {

            if (list.length) {

                    var item = list[i]
                    var cardEl = document.getElementById('card-' + item.id)
                    if (!cardEl) continue
                    var data = buildWatchlistDataFromCache(item)
                    if (!data) continue
                    updateWatchlistCardSilent(cardEl, item, data)

        function bindHoldPositionCheckbox() {

                var input = e.target.closest('.hold-position-input')
                if (!input) return
                var itemId = input.dataset.itemId
                var cardEl = input.closest('.card')

                setHoldPosition(itemId, input.checked)

                if (cardEl) {
                    var list = getWatchlist()
                    var item = null
                    for (var i = 0; i < list.length; i++) {
                        if (list[i].id === itemId) {
                            item = list[i]
                            break
                        }
                    }
                    if (item) {
                        var data = buildWatchlistDataFromCache(item)
                        if (data) updateWatchlistCardSilent(cardEl, item, data)
                    }
                } else if (currentDetail && (currentDetail.market + '-' + currentDetail.symbol) === itemId) {
                    renderDetailPanel(currentDetail)
                }
            })
        }

            if (cancelBtn) cancelBtn.addEventListener('click', closeStrategyDialog)
            if (overlay) {
                overlay.addEventListener('click', function (e) {
                    if (e.target === overlay) closeStrategyDialog()
                })

            if (resetBtn) {
                resetBtn.addEventListener('click', function () {
                    var defaults = getDefaultTradeStrategies()
                    fillStrategyForm(defaults)

                    refreshWatchlistAfterStrategySave()
