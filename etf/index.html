                disableWheel: true,
                market: data.market,
                currentPrice: data.price,
                intraday: data.intraday,
                isMutualFund: !!data.isMutualFund
            }
            detailChartMode = 'day30'
            detailChart = renderChart(chartEl, data.klines, 'day30', chartOpts)

            document.getElementById('addWatchBtn').addEventListener('click', function () {
                var item = {
                    id: data.market + '-' + data.symbol,
                    market: data.market,
                    symbol: data.symbol,
                    name: data.name,
                    addedAt: Date.now()
                }
                if (addToWatchlist(item)) {
                    appendWatchlistCard(item)
                    resetSearchPanel()
                } else {
                    this.textContent = '已在关注中'
                    this.disabled = true
                }
            })

            var list = getWatchlist()
            if (list.some(function (w) { return w.id === data.market + '-' + data.symbol })) {
                var btn = document.getElementById('addWatchBtn')
                btn.textContent = '已在关注中'
                btn.disabled = true
            }
        }

        async function handleSearch(e) {
            e.preventDefault()
            var market = marketSelect.value
            var symbol = symbolInput.value.trim()
            if (!symbol) return

            searchBtn.disabled = true
            showDetailLoading(market, symbol)

            try {
                var data = await fetchETFData(market, symbol)
                detailChartMode = 'day30'
                renderDetailPanel(data)
            } catch (err) {
                showDetailError(err.message || '加载失败，请检查网络后重试')
            } finally {
                searchBtn.disabled = false
            }
        }

        /* ===== UI：关注卡片 ===== */
        function buildRemoveBtn(item) {
            var label = item.name || item.symbol
            return '<button type="button" class="remove-btn" data-id="' + escapeHtml(item.id) +
                '" data-name="' + escapeHtml(label) + '" title="移除" aria-label="移除">✕</button>'
        }

        var removeDelegationBound = false
        var chartTabDelegationBound = false
        var confirmDialogOpen = false

        function confirmRemoveWatchlistItem(name) {
            return new Promise(function (resolve) {
                if (confirmDialogOpen) {
                    resolve(false)
                    return
                }
                var overlay = document.getElementById('confirmOverlay')
                var messageEl = document.getElementById('confirmMessage')
                var okBtn = document.getElementById('confirmOk')
                var cancelBtn = document.getElementById('confirmCancel')
                if (!overlay || !messageEl || !okBtn || !cancelBtn) {
                    resolve(window.confirm('确定从关注移除「' + name + '」吗？'))
                    return
                }

                confirmDialogOpen = true
                messageEl.textContent = '确定从关注移除「' + name + '」吗？'
                overlay.classList.add('show')

                function cleanup(result) {
                    confirmDialogOpen = false
                    overlay.classList.remove('show')
                    okBtn.removeEventListener('click', onOk)
                    cancelBtn.removeEventListener('click', onCancel)
                    overlay.removeEventListener('click', onOverlayClick)
                    document.removeEventListener('keydown', onKeydown)
                    resolve(result)
                }

                function onOk() { cleanup(true) }
                function onCancel() { cleanup(false) }
                function onOverlayClick(e) {
                    if (e.target === overlay) cleanup(false)
                }
                function onKeydown(e) {
                    if (e.key === 'Escape') cleanup(false)
                }

                okBtn.addEventListener('click', onOk)
                cancelBtn.addEventListener('click', onCancel)
                overlay.addEventListener('click', onOverlayClick)
                document.addEventListener('keydown', onKeydown)
                cancelBtn.focus()
            })
        }

        async function loadCardData(item, options) {
            if (item.market !== 'cn' && item.market !== 'tw') {
                return { error: '已移除美国市场，请移除此关注' }
            }
            try {
                var fetchOpts = item.market === 'tw' ? {
                    lightweight: !!(options && options.silent),
                    useCache: true,
                    skipIntraday: !!(options && options.silent)
                } : undefined
                return await fetchETFData(item.market, item.symbol, fetchOpts)
            } catch (e) {
                return { error: e.message }
            }
        }

        function buildWatchlistCardLeftInner(item, data) {
            if (data.error) {
                return '<div class="card-header">' +
                    '<div class="card-header-main">' +
                        '<div class="card-title">' + escapeHtml(item.name) + '</div>' +
                        '<div class="card-symbol"><span class="market-badge">' + MARKET_LABELS[item.market] + '</span> ' + escapeHtml(item.symbol) + '</div>' +
                    '</div></div>' +
                    '<div class="card-error">加载失败：' + escapeHtml(data.error) + '</div>'
            }

            var maPeriod = getRefMaDays(item.market)
            var maLabel = getMaLabel(item.market)
            var maVal = getLatestMa(data.klines, data.price, data.market, maPeriod)
            var diffPct = calcDiffPct(data.price, maVal)
            var changeCls = (data.changePct || 0) >= 0 ? 'up' : 'down'

            var flowHtml = buildCardFlowHtml(data)
            var actualHtml = buildCardActualHtml(data)
            var simHtml = buildCardSimHtml(item, data)
            var holdPos = getHoldPosition(item.id)
            var advice = getTradeAdvice(data.klines, data.price, data.market, item.id)
            var adviceHtml = buildSignalAdviceHtml(advice)
            var holdCheckHtml = buildHoldPositionCheckboxHtml(item.id, item.market, holdPos.held)

            return '<div class="card-header">' +
                    '<div class="card-header-main">' +
                        '<div class="card-title">' + holdCheckHtml + escapeHtml(data.name || item.name) + '</div>' +
                        '<div class="card-symbol"><span class="market-badge">' + MARKET_LABELS[item.market] + '</span> ' + escapeHtml(item.symbol) + '</div>' +
                    '</div>' +
                    adviceHtml +
                '</div>' +
                '<div class="card-stats">' +
                    '<div class="card-stat"><div class="label">当前价格</div><div class="value ' + changeCls + '">' + formatPrice(data.price, item.market) + '</div></div>' +
                    '<div class="card-stat"><div class="label">今日涨跌</div><div class="value ' + changeCls + '">' + formatPct(data.changePct) + '</div></div>' +
                    '<div class="card-stat"><div class="label">' + escapeHtml(maLabel) + '</div><div class="value">' + formatPrice(maVal, item.market) + '</div></div>' +
                    '<div class="card-stat"><div class="label">相对' + escapeHtml(maLabel) + '</div><div class="value ' + (diffPct >= 0 ? 'up' : 'down') + '">' + formatPct(diffPct) + '</div></div>' +
                '</div>' +
                flowHtml +
                actualHtml +
                simHtml
        }

        function renderWatchlistCard(item, data) {
            var cardId = 'card-' + item.id

            if (data.error) {
                return '<div class="card" id="' + cardId + '">' +
                    buildRemoveBtn(item) +
                    '<div class="card-body"><div class="card-left">' + buildWatchlistCardLeftInner(item, data) + '</div></div></div>'
            }

            var chartMode = cardChartModes[item.id] || 'day30'

            return '<div class="card" id="' + cardId + '">' +
                buildRemoveBtn(item) +
                '<div class="card-body">' +
                '<div class="card-left">' + buildWatchlistCardLeftInner(item, data) + '</div>' +
                '<div class="card-right">' +
                    buildChartTabsHtml(chartMode, item.id) +
                    '<div class="mini-chart" id="mini-' + escapeHtml(item.id) + '"></div>' +
                '</div>' +
                '</div>' +
            '</div>'
        }

        function mountWatchlistCardChart(item, data) {
            if (data.error || !data.klines) return

            watchlistDataCache[item.id] = data.klines
            watchlistPriceCache[item.id] = data.price
            watchlistIntradayCache[item.id] = data.intraday || null
            watchlistMetaCache[item.id] = {
                market: item.market,
                symbol: data.symbol || item.symbol,
                name: data.name || item.name,
                changePct: data.changePct,
                flow: data.flow,
                flowLabel: data.flowLabel,
                tencentSymbol: data.tencentSymbol,
                secid: data.secid,
                isMutualFund: !!data.isMutualFund,
                klines: data.klines
            }
            watchlistMutualFundCache[item.id] = !!data.isMutualFund
            watchlistMarketCache[item.id] = item.market
            var mode = cardChartModes[item.id] || 'day30'
            var miniEl = document.getElementById('mini-' + item.id)
            if (miniEl) {
                miniCharts[item.id] = renderChart(miniEl, data.klines, mode, {
                    compact: true,
                    market: item.market,
                    currentPrice: data.price,
                    intraday: data.intraday,
                    isMutualFund: !!data.isMutualFund
                })
            }
        }

        function replaceWatchlistCardElement(cardEl, item, data) {
            var temp = document.createElement('div')
            temp.innerHTML = renderWatchlistCard(item, data)
            cardEl.replaceWith(temp.firstElementChild)
            mountWatchlistCardChart(item, data)
            var newCard = document.getElementById('card-' + item.id)
            if (newCard) updateCardLayout(newCard)
        }

        var CARD_LAYOUT_BREAKPOINT = 600
        var cardLayoutObserver = null

        function updateCardLayout(card) {
            if (!card || !card.classList.contains('card')) return
            if (!card.querySelector('.card-body')) return
            card.classList.toggle('card-narrow', card.clientWidth < CARD_LAYOUT_BREAKPOINT)
            var cardId = card.id.replace(/^card-/, '')
            if (!cardId) return
            var miniEl = document.getElementById('mini-' + cardId)
            var chart = miniCharts[cardId]
            if (miniEl && chart && chart.applyOptions) {
                chart.applyOptions({ width: miniEl.clientWidth })
            }
        }

        function initCardLayoutObserver() {
            if (cardLayoutObserver || !window.ResizeObserver) return
            cardLayoutObserver = new ResizeObserver(function (entries) {
                entries.forEach(function (entry) {
                    updateCardLayout(entry.target)
                })
            })
        }

        function observeWatchlistCards() {
            initCardLayoutObserver()
            watchlistContainer.querySelectorAll('.card').forEach(function (card) {
                updateCardLayout(card)
                if (cardLayoutObserver && !card.dataset.layoutObserved) {
                    card.dataset.layoutObserved = '1'
                    cardLayoutObserver.observe(card)
                }
            })
        }

        function ensureCardBody(cardEl) {
            var bodyEl = cardEl.querySelector('.card-body')
            if (bodyEl) return bodyEl
            bodyEl = document.createElement('div')
            bodyEl.className = 'card-body'
            var leftEl = cardEl.querySelector('.card-left')
            if (leftEl) {
                cardEl.insertBefore(bodyEl, leftEl)
                bodyEl.appendChild(leftEl)
            } else {
                cardEl.appendChild(bodyEl)
            }
            return bodyEl
        }

        function updateWatchlistCardSilent(cardEl, item, data) {
            var bodyEl = ensureCardBody(cardEl)
            var leftEl = bodyEl.querySelector('.card-left')
            if (!leftEl) {
                leftEl = document.createElement('div')
                leftEl.className = 'card-left'
                bodyEl.insertBefore(leftEl, bodyEl.firstChild)
            }

            leftEl.innerHTML = buildWatchlistCardLeftInner(item, data)

            if (data.error) {
                var rightEl = bodyEl.querySelector('.card-right')
                if (rightEl) rightEl.remove()
                if (miniCharts[item.id]) {
                    destroyChart(miniCharts[item.id])
                    delete miniCharts[item.id]
                }
                delete watchlistDataCache[item.id]
                delete watchlistPriceCache[item.id]
                delete watchlistIntradayCache[item.id]
                delete watchlistMetaCache[item.id]
                delete watchlistMutualFundCache[item.id]
                delete watchlistMarketCache[item.id]
                updateCardLayout(cardEl)
                return
            }

            var rightEl = bodyEl.querySelector('.card-right')
            var chartMode = cardChartModes[item.id] || 'day30'
            if (!rightEl) {
                var temp = document.createElement('div')
                temp.innerHTML = '<div class="card-right">' +
                    buildChartTabsHtml(chartMode, item.id) +
                    '<div class="mini-chart" id="mini-' + escapeHtml(item.id) + '"></div>' +
                '</div>'
                bodyEl.appendChild(temp.firstElementChild)
            } else {
                var tabsEl = rightEl.querySelector('.chart-tabs')
                if (tabsEl) {
                    tabsEl.outerHTML = buildChartTabsHtml(chartMode, item.id)
                }
            }

            watchlistIntradayCache[item.id] = data.intraday || null
            watchlistMetaCache[item.id] = {
                market: item.market,
                symbol: data.symbol || item.symbol,
                name: data.name || item.name,
                changePct: data.changePct,
                flow: data.flow,
                flowLabel: data.flowLabel,
                tencentSymbol: data.tencentSymbol,
                secid: data.secid,
                isMutualFund: !!data.isMutualFund,
                klines: data.klines
            }

            mountWatchlistCardChart(item, data)
            updateCardLayout(cardEl)
        }

        function clearWatchlistItemCache(id) {
            if (miniCharts[id]) {
                destroyChart(miniCharts[id])
                delete miniCharts[id]
            }
            delete watchlistDataCache[id]
            delete watchlistPriceCache[id]
            delete watchlistIntradayCache[id]
            delete watchlistMetaCache[id]
            delete watchlistMutualFundCache[id]
            delete watchlistMarketCache[id]
            delete watchlistSimCache[id]
        }

        function getWatchlistEmptyHtml() {
            return '<div class="watchlist-empty">' +
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>' +
                '<p>暂无关注 ETF，搜索后点击「加入关注」</p></div>'
        }

        async function loadAndMountWatchlistCard(item, options) {
            options = options || {}
            var cardEl = document.getElementById('card-' + item.id)
            if (!cardEl) return
            var data = await loadCardData(item, options)
            cardEl = document.getElementById('card-' + item.id)
            if (!cardEl) return
            if (options.silent && cardEl.querySelector('.card-right')) {
                updateWatchlistCardSilent(cardEl, item, data)
            } else {
                replaceWatchlistCardElement(cardEl, item, data)
            }
        }

        async function appendWatchlistCard(item) {
            var list = getWatchlist()
            if (list.length === 0) return
            if (list.length === 1) {
                await renderWatchlist()
                return
            }
            syncWatchlistCardsContainer(list)
            await loadAndMountWatchlistCard(item)
            observeWatchlistCards()
        }

        function removeWatchlistCardFromUi(id) {
            removeFromWatchlist(id)
            clearWatchlistItemCache(id)
            var list = getWatchlist()
            if (list.length === 0) {
                clearWatchlistCharts()
                watchlistContainer.innerHTML = getWatchlistEmptyHtml()
                return
            }
            syncWatchlistCardsContainer(list)
            observeWatchlistCards()
        }

        function clearWatchlistCharts() {
            Object.keys(miniCharts).forEach(function (k) {
                destroyChart(miniCharts[k])
            })
            miniCharts = {}
            watchlistDataCache = {}
            watchlistPriceCache = {}
            watchlistIntradayCache = {}
            watchlistMetaCache = {}
            watchlistMutualFundCache = {}
            watchlistMarketCache = {}
            watchlistSimCache = {}
        }

        function syncWatchlistCardsContainer(list) {
            var cardsEl = watchlistContainer.querySelector('.cards')
            if (!cardsEl) {
                watchlistContainer.innerHTML = '<div class="cards"></div>'
                cardsEl = watchlistContainer.querySelector('.cards')
            }

            var listIds = {}
            list.forEach(function (item) { listIds[item.id] = true })

            cardsEl.querySelectorAll('.card').forEach(function (card) {
                var id = card.id.replace(/^card-/, '')
                if (!listIds[id]) {
                    clearWatchlistItemCache(id)
                    card.remove()
                }
            })

            list.forEach(function (item) {
                if (!document.getElementById('card-' + item.id)) {
                    var card = document.createElement('div')
                    card.className = 'card'
                    card.id = 'card-' + item.id
                    card.innerHTML = buildRemoveBtn(item) +
                        '<div class="card-left"><div class="card-loading">' + buildLoadingHtml(formatLoadingLabel(item.market, item.symbol)) + '</div></div>'
                    cardsEl.appendChild(card)
                }
            })

            return cardsEl
        }

        async function renderWatchlist(options) {
            options = options || {}
            var silent = !!options.silent
            var list = getWatchlist()

            if (list.length === 0) {
                clearWatchlistCharts()
                watchlistContainer.innerHTML = getWatchlistEmptyHtml()
                return
            }

            if (silent) {
                syncWatchlistCardsContainer(list)
            } else {
                clearWatchlistCharts()
                watchlistContainer.innerHTML = '<div class="cards">' +
                    list.map(function (item) {
                        return '<div class="card" id="card-' + item.id + '"><div class="card-loading">' + buildLoadingHtml(formatLoadingLabel(item.market, item.symbol)) + '</div></div>'
                    }).join('') +
                '</div>'
            }

            for (var i = 0; i < list.length; i++) {
                var item = list[i]
                var cardEl = document.getElementById('card-' + item.id)
                if (!cardEl) continue

                if (silent && cardEl.querySelector('.card-right')) {
                    var data = await loadCardData(item, options)
                    cardEl = document.getElementById('card-' + item.id)
                    if (!cardEl) continue
                    updateWatchlistCardSilent(cardEl, item, data)
                } else {
                    await loadAndMountWatchlistCard(item, options)
                }
            }

            observeWatchlistCards()
        }

        function bindChartTabDelegation() {
            if (chartTabDelegationBound) return
            chartTabDelegationBound = true
            watchlistContainer.addEventListener('click', function (e) {
                var tab = e.target.closest('.chart-tabs[data-card-id] .chart-tab[data-mode]')
                if (!tab) return
                var tabsEl = tab.closest('.chart-tabs[data-card-id]')
                if (!tabsEl) return
                var cardId = tabsEl.dataset.cardId
                var mode = tab.dataset.mode
                cardChartModes[cardId] = mode
                tabsEl.querySelectorAll('.chart-tab[data-mode]').forEach(function (t) {
                    t.classList.toggle('active', t.dataset.mode === mode)
                })
                var miniEl = document.getElementById('mini-' + cardId)
                if (!miniEl) return
                var meta = watchlistMetaCache[cardId] || {}
                var chartOpts = {
                    compact: true,
                    market: watchlistMarketCache[cardId] || 'cn',
                    currentPrice: watchlistPriceCache[cardId],
                    intraday: watchlistIntradayCache[cardId],
                    isMutualFund: !!watchlistMutualFundCache[cardId]
                }
                if (mode === 'today' && !chartOpts.isMutualFund &&
                    (!chartOpts.intraday || !chartOpts.intraday.points || !chartOpts.intraday.points.length)) {
                    showChartLoading(miniEl, '加载分时…')
                    fetchIntradayForPayload(meta).then(function (intraday) {
                        watchlistIntradayCache[cardId] = intraday
                        chartOpts.intraday = intraday
                        miniCharts[cardId] = renderChart(miniEl, watchlistDataCache[cardId] || [], mode, chartOpts)
                    })
                    return
                }
                miniCharts[cardId] = renderChart(miniEl, watchlistDataCache[cardId] || [], mode, chartOpts)
            })
        }

        function bindRemoveButtonDelegation() {
            if (removeDelegationBound) return
            removeDelegationBound = true
            watchlistContainer.addEventListener('click', function (e) {
                var btn = e.target.closest('.remove-btn')
                if (!btn) return
                e.preventDefault()
                e.stopPropagation()
                var id = btn.dataset.id
                var name = btn.dataset.name || id
                confirmRemoveWatchlistItem(name).then(function (ok) {
                    if (!ok) return
                    removeWatchlistCardFromUi(id)
                })
            })
        }

        /* ===== 初始化 ===== */
        function startAutoRefresh() {
            if (refreshTimer) clearInterval(refreshTimer)
            refreshTimer = setInterval(function () {
                if (getWatchlist().length > 0) renderWatchlist({ silent: true })
            }, REFRESH_INTERVAL)
        }

        searchForm.addEventListener('submit', handleSearch)
        refreshBtn.addEventListener('click', function () {
            renderWatchlist({ silent: true })
        })

        window.addEventListener('resize', debounce(function () {
            observeWatchlistCards()
            if (detailChart && document.getElementById('detailChart')) {
                var el = document.getElementById('detailChart')
                detailChart.applyOptions({ width: el.clientWidth })
            }
        }, 200))

        bindRemoveButtonDelegation()
        bindChartTabDelegation()
        bindSimDetailDialog()
        bindStrategyDialog()
        bindHoldPositionCheckbox()
        initMarketSelect()
        renderWatchlist()
        startAutoRefresh()
    })()
    </script>
</body>
</html>
