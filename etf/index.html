        function finalizeSimResult(equityCurve, yearKlines, buyCount, sellCount, operations, endState) {
            if (!equityCurve.length) return null
            var startEquity = equityCurve[0].equity
            var finalEquity = equityCurve[equityCurve.length - 1].equity
            var returnPct = startEquity ? ((finalEquity - startEquity) / startEquity) * 100 : 0
            var maxProfitPoint = { date: equityCurve[0].date, returnPct: 0 }
            var maxDrawdownPoint = { date: equityCurve[0].date, returnPct: 0 }
            var i
            for (i = 0; i < equityCurve.length; i++) {
                var point = equityCurve[i]
                var retFromStart = startEquity ? ((point.equity - startEquity) / startEquity) * 100 : 0
                if (retFromStart > maxProfitPoint.returnPct) {
                    maxProfitPoint = { date: point.date, returnPct: retFromStart }
                }
                if (retFromStart < maxDrawdownPoint.returnPct) {
                    maxDrawdownPoint = { date: point.date, returnPct: retFromStart }
                }
            }
            var result = {
                returnPct: returnPct,
                buyCount: buyCount,
                sellCount: sellCount,
                maxProfitPoint: maxProfitPoint,
                maxDrawdownPoint: maxDrawdownPoint,
                startDate: yearKlines[0].date,
                endDate: yearKlines[yearKlines.length - 1].date,
                operations: operations,
                holdingAtEnd: false,
                holdPrice: null,
                holdValuePct: null
            }
            if (endState && endState.holdingAtEnd) {
                result.holdingAtEnd = true
                result.holdPrice = endState.holdPrice
                result.holdValuePct = endState.holdValuePct
            }
            if (endState && endState.entryStartDate) {
                result.entryStartDate = endState.entryStartDate
                result.startDate = endState.entryStartDate
            }
            return result
        }

        function findKlineIndexByDate(klines, dateStr) {
            if (!klines || !klines.length || !dateStr) return -1
            dateStr = normalizeTradeDate(dateStr)
            var i
            for (i = 0; i < klines.length; i++) {
                if (normalizeTradeDate(klines[i].date) >= dateStr) return i
            }
            return -1
        }

        function findKlineIndexOnOrBeforeDate(klines, dateStr) {
            if (!klines || !klines.length || !dateStr) return -1
            dateStr = normalizeTradeDate(dateStr)
            var i, last = -1
            for (i = 0; i < klines.length; i++) {
                var d = normalizeTradeDate(klines[i].date)
                if (d > dateStr) break
                last = i
            }
            return last
        }

        function normalizeSimEntryDate(klines, dateStr) {
            if (!klines || !klines.length) return dateStr
            var bounds = getSimEntryDateBounds(klines)
            dateStr = normalizeTradeDate(dateStr)
            if (!dateStr || dateStr > bounds.maxDate) dateStr = bounds.maxDate
            if (dateStr < bounds.minDate) dateStr = bounds.minDate
            var sorted = sortKlinesByDate(klines)
            var idx = findKlineIndexOnOrBeforeDate(sorted, dateStr)
            if (idx < 0) return normalizeTradeDate(sorted[0].date)
            return normalizeTradeDate(sorted[idx].date)
        }

        function simulateStrategyAnnualReturn(yearKlines, strategy, market, options) {
            options = options || {}
            yearKlines = sortKlinesByDate(yearKlines)
            var bounds = getSimEntryDateBounds(yearKlines)
            var entryStartDate = options.entryStartDate || bounds.minDate
            var entryIdx = findKlineIndexOnOrBeforeDate(yearKlines, entryStartDate)
            if (entryIdx < 0) entryIdx = 0
            entryStartDate = normalizeTradeDate(yearKlines[entryIdx].date)
            var maPeriods = resolveStrategyMaPeriods(strategy, market)
            var baseMa = calcMaSeries(yearKlines, maPeriods.baseMaDays)
            var trailMa = calcMaSeries(yearKlines, maPeriods.trailMaDays)
            var delay = getTradeDelayDays(strategy)
            var n = yearKlines.length
            var cash = 1
            var shares = 0
            var inPosition = false
            var entryPrice = 0
            var buyStreak = 0
            var pendingBuyWait = -1
            var pendingSellWait = -1
            var pendingSellNote = ''
            var buyCount = 0
            var sellCount = 0
            var equityCurve = []
            var operations = []
            var startEquity = 1
            var i, bar, close, sellSig, tradedToday
            var initialBuyApplied = false
            var lastClose = null

            for (i = 0; i < n; i++) {
                bar = yearKlines[i]
                close = bar.close
                if (close == null || isNaN(close)) continue
                lastClose = close

                if (i < entryIdx) {
                    equityCurve.push({ date: bar.date, equity: startEquity })
                    continue
                }

                tradedToday = false

                if (!initialBuyApplied && cash > 0 && !inPosition) {
                    shares = cash / close
                    cash = 0
                    inPosition = true
                    entryPrice = close
                    buyCount++
                    pushSimOperation(operations, bar.date, 'buy', close, startEquity, shares * close,
                        entryIdx === 0 ? '首日买入' : '建仓买入')
                    initialBuyApplied = true
                    tradedToday = true
                } else if (delay > 0) {
                    if (pendingSellWait > 0) pendingSellWait--
                    if (pendingBuyWait > 0) pendingBuyWait--
                    if (pendingSellWait === 0 && inPosition && shares > 0) {
                        cash = shares * close
                        shares = 0
                        inPosition = false
                        sellCount++
                        pushSimOperation(operations, bar.date, 'sell', close, startEquity, cash,
                            formatSimTradeConfirmNote(strategy, pendingSellNote || '信号'))
                        pendingSellWait = -1
                        pendingSellNote = ''
                        tradedToday = true
                    } else if (pendingBuyWait === 0 && !inPosition && cash > 0) {
                        shares = cash / close
                        cash = 0
                        inPosition = true
                        entryPrice = close
                        buyCount++
                        pushSimOperation(operations, bar.date, 'buy', close, startEquity, shares * close,
                            formatSimTradeConfirmNote(strategy, '确认买入'))
                        pendingBuyWait = -1
                        tradedToday = true
                    }
                }

                if (!tradedToday && pendingSellWait < 0 && pendingBuyWait < 0) {
                    if (inPosition && shares > 0) {
                        sellSig = evalStrategySellSignal(strategy, close, entryPrice, baseMa[i], trailMa[i])
                        if (sellSig.shouldSell) {
                            if (delay <= 0) {
                                cash = shares * close
                                shares = 0
                                inPosition = false
                                sellCount++
                                pushSimOperation(operations, bar.date, 'sell', close, startEquity, cash, sellSig.note)
                                tradedToday = true
                            } else {
                                pendingSellWait = delay
                                pendingSellNote = sellSig.note
                            }
                        }
                    } else if (cash > 0 && baseMa[i] != null) {
                        if (close > baseMa[i] * strategy.buyThreshold) {
                            buyStreak++
                        } else {
                            buyStreak = 0
                        }
                        if (buyStreak >= strategy.confirmDays) {
                            if (delay <= 0) {
                                shares = cash / close
                                cash = 0
                                inPosition = true
                                entryPrice = close
                                buyCount++
                                pushSimOperation(operations, bar.date, 'buy', close, startEquity, shares * close, '确认买入')
                                buyStreak = 0
                                tradedToday = true
                            } else {
                                pendingBuyWait = delay
                                buyStreak = 0
                            }
                        }
                    }
                }

                equityCurve.push({
                    date: bar.date,
                    equity: inPosition ? shares * close : cash
                })
            }

            var finalEquity = equityCurve.length ? equityCurve[equityCurve.length - 1].equity : startEquity
            return finalizeSimResult(equityCurve, yearKlines, buyCount, sellCount, operations, {
                holdingAtEnd: inPosition && shares > 0,
                holdPrice: lastClose,
                holdValuePct: startEquity ? (finalEquity / startEquity) * 100 : 100,
                entryStartDate: entryStartDate
            })
        }

        function simulateAnnualReturn(klines, market, options) {
            var yearKlines = getAnnualKlines(klines)

            var strategy = getTradeStrategy(market)

            if (/^192\.168\.\d{1,3}\.\d{1,3}$/.test(host)) return true

            return false

        function isCorsProxyFreeOrigin() {
            var host = (location.hostname || '').toLowerCase()
            var proto = (location.protocol || '').toLowerCase()
            if (!host && proto !== 'file:') return false
            if (host === 'localhost' || host === '127.0.0.1') return true
            if (isPrivateLanHost(host)) return true
            if (proto === 'capacitor:' || proto === 'ionic:') return true

            var freeSuffixes = [
                '.github.io', '.github.dev',
                '.codesandbox.io', '.csb.app',
                '.stackblitz.io', '.stackblitz.com',
                '.replit.dev', '.repl.co',
                '.glitch.me',
                '.gitpod.io',
                '.codepen.io', '.codepen.dev',
                '.jsfiddle.net',
                '.vscode.dev', '.codeanywhere.com'
            ]
            var i
            for (i = 0; i < freeSuffixes.length; i++) {
                var suffix = freeSuffixes[i]
                if (host === suffix.slice(1) || host.slice(-suffix.length) === suffix) return true
            }
            if (host.indexOf('ngrok') >= 0 || host.indexOf('trycloudflare.com') >= 0) return true
            return false
        }

        function buildCorsProxyUrls(targetUrl) {
            var urls = []
            if (CUSTOM_PROXY_URL) {

            }
            var host = location.hostname
            if (host === 'localhost' || host === '127.0.0.1') {
                urls.push(LOCAL_DEV_PROXY_URL + encodeURIComponent(targetUrl))
            }
            if (isCorsProxyFreeOrigin()) {

            }
            return urls
        }

        async function fetchRemote(url, options) {
            options = options || {}
            var fetchOpts = {}
            if (options.headers) fetchOpts.headers = options.headers
            var asJson = options.asJson === true
            var allowHtml = options.allowHtml === true

            async function parseResponse(resp) {
                if (!resp.ok) throw new Error('HTTP ' + resp.status)
                var text = await resp.text()
                if (!allowHtml && text.trim().charAt(0) === '<') {
                    throw new Error('接口返回异常')
                }
                return asJson ? JSON.parse(text) : text
            }

            var lastErr = null
            try {
                return await parseResponse(await fetch(url, fetchOpts))
            } catch (e) {
                lastErr = e
            }

            var proxies = buildCorsProxyUrls(url)
            for (var i = 0; i < proxies.length; i++) {
                try {
                    return await parseResponse(await fetch(proxies[i], fetchOpts))
                } catch (e) {
                    lastErr = e
                }
            }

            if (lastErr && lastErr.message === 'Failed to fetch') {
                throw new Error('网络请求失败，请检查网络连接后重试')
            }
            throw lastErr || new Error('网络请求失败')
        }

            options = options || {}

                return {

                }
            }).filter(Boolean).sort(function (a, b) {

        function getTWSplitFactorBeforeDate(splitEvents, date) {

            splitEvents.forEach(function (sp) {

        function applyTWSplitAdjustments(klines, splitEvents) {
            if (!klines.length || !splitEvents.length) return klines
            return klines.map(function (k) {
                var factor = getTWSplitFactorBeforeDate(splitEvents, k.date)
                if (factor === 1) return k
                return {
                    date: k.date,
                    open: k.open / factor,
                    close: k.close / factor,
                    high: k.high / factor,
                    low: k.low / factor,
                    volume: k.volume != null ? k.volume * factor : k.volume,
                    changePct: k.changePct

            })
        }

                var bid = parseTWSEBookSide(row.b)
                var ask = parseTWSEBookSide(row.a)
                if (bid != null && ask != null) price = (bid + ask) / 2
                else if (bid != null) price = bid
                else if (ask != null) price = ask
            }
            if (price == null) return null
            var preClose = parseTWSEPriceField(row.y)
            var changePct = null
            if (preClose != null && preClose > 0) {
                changePct = ((price - preClose) / preClose) * 100
            }

                preClose: preClose,
                ts: parseTWSEQuoteTimestamp(row)

                } catch (e) {
                    if (isFinMindRateLimitError(e)) throw e
                    klines = options.cachedData.klines
                    if (!options.cachedData.splitAdjusted) {
                        klines = applyTWSplitAdjustments(klines, splitEvents)
                    }
                }
            } else {
                klines = await fetchFinMindTWKlines(code, startDate, endDate)
                klines = applyTWSplitAdjustments(klines, splitEvents)
            }

            var last = klines[klines.length - 1]
            var name = (options.cachedData && options.cachedData.name) || code

            if (!options.lightweight) {
                try {
                    var infoUrl = 'https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockInfo&data_id=' +
                        encodeURIComponent(code)
                    var infoData = await fetchFinMindJSON(infoUrl)
                    if (infoData && infoData.data && infoData.data[0] && infoData.data[0].stock_name) {
                        name = infoData.data[0].stock_name
                    }
                } catch (e) { /* ignore */ }
            }

            var flow = []
            var flowLabel = '成交量（量能参考）'
            if (options.lightweight && options.cachedData && options.cachedData.flow && options.cachedData.flow.length) {
                flow = options.cachedData.flow
                flowLabel = options.cachedData.flowLabel || flowLabel
            } else if (!options.lightweight) {
                try {
                    var flowStart = new Date()
                    flowStart.setDate(flowStart.getDate() - 40)
                    var flowUrl = 'https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockInstitutionalInvestorsBuySell&data_id=' +
                        encodeURIComponent(code) + '&start_date=' + formatDateISO(flowStart) + '&end_date=' + endDate
                    var flowData = await fetchFinMindJSON(flowUrl)
                    if (flowData && flowData.data && flowData.data.length) {
                        var byDate = {}
                        flowData.data.forEach(function (row) {
                            if (!byDate[row.date]) byDate[row.date] = 0
                            byDate[row.date] += (row.buy || 0) - (row.sell || 0)
                        })
                        flow = Object.keys(byDate).sort().slice(-10).map(function (date) {
                            return { date: date, mainNet: byDate[date] }
                        })
                        if (flow.length) flowLabel = '机构资金流向'
                    }
                } catch (e) { /* ignore */ }
            }

            if (!flow.length) {
                for (var j = Math.max(0, klines.length - 5); j < klines.length; j++) {
                    flow.push({ date: klines[j].date, mainNet: klines[j].volume || 0 })
                }
            }

            var payload = {
                market: 'tw',
                symbol: code,
                name: name,
                price: last.close,
                changePct: last.changePct,
                klines: klines,
                flow: flow,
                flowLabel: flowLabel,
                secid: null,
                splitAdjusted: true
            }

            if (options.skipIntraday) {
                await enrichTWLiveQuote(payload, { quoteOnly: true })
                return finalizeQuotePayload(payload)
            }
            return enrichWithIntraday(payload)
        }

        async function fetchYahooTWData(symbol, options) {
            options = options || {}
            var code = normalizeTWSymbol(symbol)
            var ySymbol = code + '.TW'
            var url = 'https://query1.finance.yahoo.com/v8/finance/chart/' + encodeURIComponent(ySymbol) +
                '?interval=1d&range=1y&includePrePost=false'
            var data = await fetchJSON(url)
            if (!data || !data.chart || !data.chart.result || !data.chart.result[0]) {
                throw new Error('未找到该 ETF，请检查代码是否正确（如 0050、00685L）')
            }

            var result = data.chart.result[0]
            var meta = result.meta
            var timestamps = result.timestamp || []
            var q = result.indicators.quote[0]
            var klines = []

            for (var i = 0; i < timestamps.length; i++) {
                if (q.close[i] == null) continue
                var d = new Date(timestamps[i] * 1000)
                var dateStr = d.getFullYear() + '-' +
                    String(d.getMonth() + 1).padStart(2, '0') + '-' +
                    String(d.getDate()).padStart(2, '0')
                var prevClose = i > 0 && q.close[i - 1] != null ? q.close[i - 1] : q.close[i]
                var changePct = prevClose ? ((q.close[i] - prevClose) / prevClose) * 100 : 0
                klines.push({
                    date: dateStr,
                    open: q.open[i],
                    close: q.close[i],
                    high: q.high[i],
                    low: q.low[i],
                    volume: q.volume[i],
                    changePct: changePct
                })
            }

            if (!klines.length) throw new Error('暂无 K 线数据')

            klines = await adjustTWKlinesForSplits(code, klines)

            var last = klines[klines.length - 1]
            var flow = []
            for (var j = Math.max(0, klines.length - 5); j < klines.length; j++) {
                flow.push({ date: klines[j].date, mainNet: klines[j].volume || 0 })
            }

            var price = meta.regularMarketPrice || last.close
            var preClose = meta.chartPreviousClose != null ? meta.chartPreviousClose : meta.previousClose
            var changePct = last.changePct
            if (preClose != null && preClose > 0 && price != null) {
                changePct = ((price - preClose) / preClose) * 100
            } else if (meta.regularMarketChangePercent != null && !isNaN(meta.regularMarketChangePercent)) {
                changePct = meta.regularMarketChangePercent
            }

            var payload = {
                market: 'tw',
                symbol: code,
                name: meta.longName || meta.shortName || code,
                price: price,
                changePct: changePct,
                klines: klines.slice(-HISTORY_DAYS),
                flow: flow,
                flowLabel: '成交量（量能参考）',
                secid: null,
                splitAdjusted: true,
                quoteTime: meta.regularMarketTime != null ? meta.regularMarketTime * 1000 : null
            }

            if (options.skipIntraday) return finalizeQuotePayload(payload)
            return enrichWithIntraday(payload)
        }

        async function fetchTWData(symbol, options) {
            options = options || {}
            var code = normalizeTWSymbol(symbol)
            if (!code) throw new Error('请输入有效的台湾 ETF 代码，如 0050 或 00685L')

            var cached = twDataCache[code]
            if (options.useCache !== false && cached && cached.data) {
                var ttl = options.lightweight ? TW_CACHE_TTL_LIGHT : TW_CACHE_TTL_FULL
                var cacheValid = Date.now() - cached.ts < ttl
                if (cacheValid && options.lightweight && needsTWLiveQuote(cached.data)) {
                    var quoteAge = Date.now() - (cached.quoteTs || 0)
                    if (quoteAge >= TW_QUOTE_REFRESH_MS) {
                        await enrichTWLiveQuote(cached.data, { quoteOnly: true })
                        twDataCache[code] = { data: cached.data, ts: cached.ts, quoteTs: Date.now() }
                    }
                    return cached.data
                }
                if (cacheValid) {
                    return cached.data
                }
            }

            if (options.lightweight && cached && cached.data) {
                try {
                    var lightData = await fetchFinMindTWData(code, {
                        lightweight: true,
                        cachedData: cached.data,
                        skipIntraday: true
                    })
                    twDataCache[code] = { data: lightData, ts: Date.now(), quoteTs: Date.now() }
                    return lightData
                } catch (e) {
                    if (cached.data) return cached.data
                }
            }

            try {
                var finData = await fetchFinMindTWData(code, {
                    skipIntraday: !!options.skipIntraday
                })
                twDataCache[code] = { data: finData, ts: Date.now(), quoteTs: Date.now() }
                return finData
            } catch (finErr) {
                try {
                    var yahooData = await fetchYahooTWData(code, {
                        skipIntraday: !!options.skipIntraday
                    })
                    twDataCache[code] = { data: yahooData, ts: Date.now(), quoteTs: Date.now() }
                    return yahooData
                } catch (yahooErr) {
                    if (cached && cached.data) return cached.data
                    if (isFinMindRateLimitError(finErr)) {
                        throw new Error('台湾 ETF 数据请求已达 FinMind 上限（约 300 次/小时），请稍后再试或使用备用源')
                    }
                    if (finErr.message === 'Failed to fetch' || yahooErr.message === 'Failed to fetch') {
                        throw new Error('台湾 ETF 数据加载失败，请检查网络连接后重试')
                    }
                    throw finErr
                }
            }
        }

        async function fetchETFData(market, symbol, options) {

            if (market === 'tw') return fetchTWData(symbol, options)

        }

        function aggregateKlinesBy5Days(klines) {
            var result = []
            for (var i = 0; i < klines.length; i += 5) {
                var chunk = klines.slice(i, i + 5)
                if (!chunk.length) continue
                var high = chunk[0].high
                var low = chunk[0].low
                for (var j = 1; j < chunk.length; j++) {
                    if (chunk[j].high > high) high = chunk[j].high
                    if (chunk[j].low < low) low = chunk[j].low
                }
                result.push({
                    date: chunk[chunk.length - 1].date,
                    open: chunk[0].open,
                    close: chunk[chunk.length - 1].close,
                    high: high,
                    low: low,
                    volume: chunk.reduce(function (sum, k) { return sum + (k.volume || 0) }, 0)
                })
            }
            return result
        }

                var price = null
                if (param.seriesData) {
                    param.seriesData.forEach(function (v) {
                        if (v && v.value != null && !isNaN(v.value)) price = v.value

                        return
                    }
                    html = '<div class="chart-tooltip-date">' + escapeHtml(dateStr) + '</div>' +
                        buildChartTooltipRow('收盘价', entry.close, CHART_LINE_COLOR, market)
                    if (entry.ma != null && !isNaN(entry.ma)) {
                        html += buildChartTooltipRow(maLabel, entry.ma, CHART_MA5_COLOR, market)
                    }
                    if (entry.buy != null && !isNaN(entry.buy)) {
                        html += buildChartTooltipRow('建议买入', entry.buy, CHART_STRATEGY_BUY_COLOR, market)
                    }
                    if (entry.sell != null && !isNaN(entry.sell)) {
                        html += buildChartTooltipRow('建议卖出', entry.sell, CHART_STRATEGY_SELL_COLOR, market)
                    }
                } else {
                    if (entry == null || isNaN(entry)) {
                        tooltip.style.display = 'none'
                        return
                    }
                    html = '<div class="chart-tooltip-date">' + escapeHtml(dateStr) + '</div>' +
                        buildChartTooltipRow(maLabel, entry, CHART_MA5_COLOR, market)
                }

                tooltip.innerHTML = html
                positionChartTooltip(tooltip, container, param)
            })
        }

        function buildValueByDate(mode, klines, currentPrice, market) {
            var map = {}
            var maPeriod = getRefMaDays(market)
            var maLabel = getMaLabel(market)
            var dailyMaByDate = buildDailyMaByDate(klines, currentPrice, market, maPeriod)
            if (isYearMaChartMode(mode)) {
                var dailyYear = klines.slice(-HISTORY_DAYS)
                var aggKlines = aggregateKlinesBy5Days(dailyYear)
                aggKlines.forEach(function (k) {
                    if (dailyMaByDate[k.date] != null) {
                        map[k.date] = dailyMaByDate[k.date]
                    }
                })
            } else if (isDailyLineChartMode(mode)) {
                var sliceDays = getChartSliceDays(mode)
                var dailySlice = klines.slice(-sliceDays)
                var marketToday = getMarketDateString(market)
                var livePrice = currentPrice != null && !isNaN(currentPrice) ? Number(currentPrice) : null
                var sessionOpen = isMarketOpen(market)
                var levelsByDate = buildStrategyLevelsByDate(klines, market, currentPrice)
                dailySlice.forEach(function (k) {
                    var close = k.close
                    if (sessionOpen && livePrice != null && k.date === marketToday) {
                        close = livePrice
                    }
                    var lv = levelsByDate[k.date] || {}
                    map[k.date] = {
                        close: close,
                        ma: dailyMaByDate[k.date] != null ? dailyMaByDate[k.date] : null,
                        buy: lv.buy,
                        sell: lv.sell
                    }
                })
            }
            map._maLabel = maLabel
            return map
        }

        /* ===== 图表 ===== */
        var chartContainerObserver = null

        function destroyChart(chart) {
            if (chart) {
                try { chart.remove() } catch (e) { /* ignore */ }
            }
        }

        function unobserveChartContainer(container) {
            if (!container || !chartContainerObserver || !container.dataset.chartObserved) return
            chartContainerObserver.unobserve(container)
            delete container.dataset.chartObserved
        }

        function whenChartContainerReady(container, fn, attempt) {
            if (!container || !container.isConnected) return
            attempt = attempt || 0
            if (container.clientWidth > 0 && container.clientHeight > 0) {
                fn()
                return
            }
            if (attempt >= 24) return
            requestAnimationFrame(function () {
                whenChartContainerReady(container, fn, attempt + 1)
            })
        }

        function refreshChartLayout(container) {
            var chart = container && container._chartInstance
            if (!chart || !container.isConnected) return
            var width = container.clientWidth
            var height = container.clientHeight
            if (width <= 0 || height <= 0) {
                whenChartContainerReady(container, function () {
                    refreshChartLayout(container)
                })
                return
            }
            try {
                chart.applyOptions({ width: width, height: height })
            } catch (e) { /* ignore */ }
            if (container._chartMode && container._chartMode !== 'today') {
                try { chart.timeScale().fitContent() } catch (e) { /* ignore */ }
            }
        }

        function initChartContainerObserver() {
            if (chartContainerObserver || !window.ResizeObserver) return
            chartContainerObserver = new ResizeObserver(function (entries) {
                entries.forEach(function (entry) {
                    refreshChartLayout(entry.target)
                })
            })
        }

        function observeChartContainer(container) {
            if (!container) return
            initChartContainerObserver()
            whenChartContainerReady(container, function () {
                refreshChartLayout(container)
                if (chartContainerObserver && !container.dataset.chartObserved) {
                    container.dataset.chartObserved = '1'
                    chartContainerObserver.observe(container)
                }
            })
        }

        function refreshAllChartLayouts() {
            requestAnimationFrame(function () {
                requestAnimationFrame(function () {
                    observeWatchlistCards()
                    document.querySelectorAll('.chart-container, .mini-chart').forEach(function (el) {
                        refreshChartLayout(el)
                    })
                })
            })
        }

        var scheduleChartLayoutRefresh = debounce(function () {
            refreshAllChartLayouts()
        }, 100)

        function renderChart(container, klines, mode, opts) {
            opts = opts || {}
            var compact = !!opts.compact
            var disableWheel = !!opts.disableWheel
            var market = opts.market || 'cn'

            unobserveChartContainer(container)
            destroyChart(container._chartInstance)
            container.innerHTML = ''
            delete container._chartInstance
            delete container._chartMode

            if (mode === 'today') {
                var todayChart = renderTodayChart(container, opts.intraday, market, opts)
                if (todayChart) {
                    container._chartMode = 'today'
                    observeChartContainer(container)
                }
                return todayChart
            }

            if (!klines || klines.length === 0) return null

            var handleScroll = false
            var handleScale = false
            if (!compact) {
                if (disableWheel) {
                    handleScroll = {
                        mouseWheel: false,
                        pressedMouseMove: true,
                        horzTouchDrag: true,
                        vertTouchDrag: false
                    }
                    handleScale = {
                        mouseWheel: false,
                        pinch: false,
                        axisPressedMouseMove: true,
                        axisDoubleClickReset: true
                    }
                } else {
                    handleScroll = true
                    handleScale = true
                }
            }

            var chart = LightweightCharts.createChart(container, {
                width: Math.max(container.clientWidth, 1),
                height: Math.max(container.clientHeight, 1),
                layout: {
                    background: { color: '#161b22' },
                    textColor: '#8b949e',
                    attributionLogo: false
                },
                grid: {
                    vertLines: { color: '#30363d', visible: !compact },
                    horzLines: { color: '#30363d' }
                },
                rightPriceScale: compact ? {
                    borderColor: '#30363d',
                    borderVisible: false,
                    minimumWidth: 42
                } : {
                    borderColor: '#30363d',
                    borderVisible: true
                },
                timeScale: { borderColor: '#30363d', timeVisible: !compact, visible: !compact },
                crosshair: {
                    vertLine: { labelVisible: false },
                    horzLine: { visible: false, labelVisible: false }
                },
                handleScroll: handleScroll,
                handleScale: handleScale
            })

            var currentPrice = opts.currentPrice
            var valueByDate = buildValueByDate(mode, klines, currentPrice, market)

            if (isYearMaChartMode(mode)) {
                var dailyYear = klines.slice(-HISTORY_DAYS)
                var aggKlines = aggregateKlinesBy5Days(dailyYear)

                var candleSeries = chart.addCandlestickSeries(Object.assign({
                    upColor: CHART_UP_COLOR,
                    downColor: CHART_DOWN_COLOR,
                    borderUpColor: CHART_UP_COLOR,
                    borderDownColor: CHART_DOWN_COLOR,
                    wickUpColor: CHART_UP_COLOR,
                    wickDownColor: CHART_DOWN_COLOR
                }, SERIES_LABEL_OPTS))
                candleSeries.setData(aggKlines.map(function (k) {
                    return { time: k.date, open: k.open, high: k.high, low: k.low, close: k.close }
                }))
            } else if (isDailyLineChartMode(mode)) {
                var dailySlice = klines.slice(-getChartSliceDays(mode))
                var maPeriod = getRefMaDays(market)
                var dailyMaByDate = buildDailyMaByDate(klines, currentPrice, market, maPeriod)

                var lineSeries = chart.addLineSeries(Object.assign({
                    color: CHART_LINE_COLOR,
                    lineWidth: compact ? 1.5 : 2
                }, SERIES_LABEL_OPTS))
                lineSeries.setData(dailySlice.map(function (k) {
                    return { time: k.date, value: k.close }
                }))

                var maLine = chart.addLineSeries(Object.assign({
                    color: CHART_MA5_COLOR,
                    lineWidth: compact ? 1.5 : 2
                }, SERIES_LABEL_OPTS))
                var maData = []
                for (var d = 0; d < dailySlice.length; d++) {
                    var dateKey = dailySlice[d].date
                    if (dailyMaByDate[dateKey] != null) {
                        maData.push({ time: dateKey, value: dailyMaByDate[dateKey] })
                    }
                }
                maLine.setData(maData)

                var levelsByDate = buildStrategyLevelsByDate(klines, market, currentPrice)
                addStrategyGuideLines(chart, dailySlice, levelsByDate, compact)
            }

            chart.timeScale().fitContent()
            var maLabel = valueByDate._maLabel || getMaLabel(market)
            attachChartTooltip(chart, container, mode, valueByDate, market, maLabel)
            container._chartInstance = chart
            container._chartMode = mode
            observeChartContainer(container)
            return chart
        }

        function buildLoadingHtml(text) {

        function buildCardFlowHtml(data) {
            if (!data.flow || !data.flow.length) return ''
            var latest = data.flow[data.flow.length - 1]
            var latestCls = latest.mainNet >= 0 ? 'up' : 'down'
            var rows = data.flow.slice().reverse()
            var popupHtml = rows.map(function (f) {

                return '<div class="flow-popup-item"><span>' + escapeHtml(f.date) + '</span>' +
                    '<span class="stat-value ' + cls + '">' + formatFlow(f.mainNet) + '</span></div>'
            }).join('')
            return '<div class="card-flow">' +
                '<div class="flow-summary">' +
                    '<span class="flow-summary-label">' + escapeHtml(data.flowLabel) + '</span>' +
                    '<span class="flow-hover-trigger">' +

                        '<div class="flow-hover-popup">' +

        function buildCardSimHtml(item, data) {
            if (!data.klines || data.klines.length < 10) return ''
            var yearKlines = sortKlinesByDate(getAnnualKlines(data.klines))
            var sim = simulateAnnualReturn(data.klines, data.market)
            if (!sim) return ''
            var summary = getStrategySummaryText(data.market)
            var entryBounds = getSimEntryDateBounds(yearKlines)
            watchlistSimCache[item.id] = {
                sim: sim,
                detailSim: sim,
                klines: yearKlines,

            var maxEqCls = sim.maxProfitPoint.returnPct >= 0 ? 'up' : 'down'

                '<div class="sim-summary-row">' +

                            '<div class="sim-popup-row">买入 ' + sim.buyCount + ' 次 · 卖出 ' + sim.sellCount + ' 次</div>' +
                            '<div class="sim-popup-row">最大收益点：' + escapeHtml(sim.maxProfitPoint.date) +
                                ' <span class="flow-summary-value ' + maxEqCls + '">' + formatPct(sim.maxProfitPoint.returnPct) + '</span></div>' +
                            '<div class="sim-popup-row">最大回撤点：' + escapeHtml(sim.maxDrawdownPoint.date) +
                                ' <span class="flow-summary-value ' + ddCls + '">' + formatPct(sim.maxDrawdownPoint.returnPct) + '</span></div>' +
                            '<div class="sim-popup-hint">模拟时间段：' + escapeHtml(sim.startDate) + ' ~ ' + escapeHtml(sim.endDate) + '</div>' +
                        '</div>' +

                    '<button type="button" class="sim-detail-btn btn-ghost" data-item-id="' + escapeHtml(item.id) + '">操作记录</button>' +

        }

        function formatSimValuePct(valuePct) {
            if (valuePct == null || isNaN(valuePct)) return '--'
            return Number(valuePct).toFixed(2) + '%'
        }

        function formatSimOperationLabel(op, index) {
            if (op.action === 'holding') return '持仓中'
            if (op.action === 'buy') return '买入'
            var note = op.note || ''
            if (note.indexOf('止损') >= 0) return '止损'
            if (note.indexOf('止盈') >= 0 || note.indexOf('移动止盈') >= 0) return '止盈'
            return '卖出'
        }

        function formatSimOperationClass(op, index) {
            var label = formatSimOperationLabel(op, index)
            if (label === '持仓中') return 'action-hold'
            if (label === '买入') return 'action-buy'
            return 'action-sell'
        }

        function getSimTradeMarkerColor(trade) {
            if (!trade) return CHART_LINE_COLOR
            if (trade.action === 'buy') return CHART_UP_COLOR
            return CHART_DOWN_COLOR
        }

        function buildSimTradeByDate(cached) {
            var sim = cached.detailSim || cached.sim
            var ops = sim.operations || []
            var map = {}
            ops.forEach(function (op, index) {
                var d = normalizeTradeDate(op.date)
                map[d] = {
                    label: formatSimOperationLabel(op, index),
                    action: op.action,
                    price: op.price,
                    valuePct: op.valuePct,
                    note: op.note || '',
                    index: index
                }
            })
            return map
        }

        function buildSimTradeMarkers(slice, tradeByDate) {
            var markers = []
            slice.forEach(function (k) {
                var trade = tradeByDate[k.date]
                if (!trade) return
                markers.push({
                    time: k.date,
                    position: 'inBar',
                    shape: 'circle',
                    color: getSimTradeMarkerColor(trade),
                    size: 1
                })
            })
            return markers
        }

        var simDetailChartState = {
            chart: null,
            lineSeries: null,
            rowMeta: [],
            klineDates: [],
            priceByDate: {},
            guideByDate: {},
            tradeByDate: {},
            market: 'cn',
            maLabel: '',
            tooltipEl: null,
            containerEl: null,
            suppressSync: false
        }

        function getSimDetailChartKlines(cached) {
            var klines = sortKlinesByDate(cached.klines || [])
            if (!klines.length) return []
            var startDate = normalizeSimEntryDate(klines, cached.entryStartDate || klines[0].date)
            var startIdx = findKlineIndexOnOrBeforeDate(klines, startDate)
            if (startIdx < 0) startIdx = 0
            var slice = klines.slice(startIdx).map(function (k) {
                return {
                    date: normalizeTradeDate(k.date),
                    open: k.open,
                    close: k.close,
                    high: k.high,
                    low: k.low,
                    volume: k.volume
                }
            })
            var sim = cached.detailSim || cached.sim
            if (sim && sim.holdingAtEnd && cached.price != null && !isNaN(cached.price)) {
                var today = formatDateISO(new Date())
                var last = slice[slice.length - 1]
                if (last && last.date < today) {
                    slice.push({
                        date: today,
                        open: cached.price,
                        close: cached.price,
                        high: cached.price,
                        low: cached.price,
                        volume: 0
                    })
                } else if (last && last.date === today) {
                    slice = slice.slice()
                    slice[slice.length - 1] = Object.assign({}, last, {
                        close: cached.price,
                        high: Math.max(last.high, cached.price),
                        low: Math.min(last.low, cached.price)
                    })
                }
            }
            return slice
        }

        function resolveSimChartHoverDate(hoverDate, klineDates) {
            hoverDate = normalizeTradeDate(hoverDate)
            if (!hoverDate || !klineDates.length) return null
            var i
            for (i = 0; i < klineDates.length; i++) {
                if (klineDates[i] === hoverDate) return hoverDate
                if (klineDates[i] > hoverDate) {
                    return i > 0 ? klineDates[i - 1] : klineDates[0]
                }
            }
            return klineDates[klineDates.length - 1]
        }

        function findSimRowIndexForDate(targetDate, rowMeta) {
            targetDate = normalizeTradeDate(targetDate)
            if (!targetDate || !rowMeta.length) return -1
            var best = -1
            var i
            for (i = 0; i < rowMeta.length; i++) {
                if (rowMeta[i].date <= targetDate) best = rowMeta[i].index
                else break
            }
            return best
        }

        function clearSimDetailRowHighlight() {
            var bodyEl = document.getElementById('simDetailBody')
            if (!bodyEl) return
            bodyEl.querySelectorAll('.sim-detail-row-active').forEach(function (tr) {
                tr.classList.remove('sim-detail-row-active')
            })
        }

        function highlightSimDetailRow(rowIndex) {
            var bodyEl = document.getElementById('simDetailBody')
            if (!bodyEl || rowIndex == null || rowIndex < 0) {
                clearSimDetailRowHighlight()
                return
            }
            clearSimDetailRowHighlight()
            var tr = bodyEl.querySelector('tr[data-sim-row="' + rowIndex + '"]')
            if (tr) {
                tr.classList.add('sim-detail-row-active')
                scrollSimDetailRowIntoView(tr, bodyEl)
            }
        }

        function scrollSimDetailRowIntoView(tr, wrapEl) {
            if (!tr || !wrapEl) return
            var headerEl = wrapEl.querySelector('.sim-detail-table thead')
            var headerH = headerEl ? headerEl.offsetHeight : 0
            var trRect = tr.getBoundingClientRect()
            var wrapRect = wrapEl.getBoundingClientRect()
            if (trRect.top < wrapRect.top + headerH) {
                wrapEl.scrollTop += trRect.top - wrapRect.top - headerH
            } else if (trRect.bottom > wrapRect.bottom) {
                wrapEl.scrollTop += trRect.bottom - wrapRect.bottom
            }
        }

        function hideSimDetailTooltip() {
            if (simDetailChartState.tooltipEl) {
                simDetailChartState.tooltipEl.style.display = 'none'
            }
        }

        function updateSimDetailTooltip(resolvedDate, param) {
            var st = simDetailChartState
            if (!st.tooltipEl || !st.containerEl || !resolvedDate) {
                hideSimDetailTooltip()
                return
            }
            var guide = st.guideByDate[resolvedDate]
            var trade = st.tradeByDate[resolvedDate]
            var html = buildSimDetailTooltipHtml(resolvedDate, guide, st.market, st.maLabel, trade)
            if (!html) {
                hideSimDetailTooltip()
                return
            }
            st.tooltipEl.innerHTML = html
            if (param && param.point) {
                positionChartTooltip(st.tooltipEl, st.containerEl, param)
            } else {
                st.tooltipEl.style.display = 'block'
                st.tooltipEl.style.left = '12px'
                st.tooltipEl.style.top = '12px'
            }
        }

        function setSimDetailCrosshair(dateStr) {
            var st = simDetailChartState
            if (!st.chart || !st.lineSeries || !dateStr) return
            dateStr = normalizeTradeDate(dateStr)
            var resolved = st.priceByDate[dateStr] != null
                ? dateStr
                : resolveSimChartHoverDate(dateStr, st.klineDates)
            if (!resolved) return
            var price = st.priceByDate[resolved]
            if (price == null) return
            st.suppressSync = true
            try {
                st.chart.setCrosshairPosition(price, resolved, st.lineSeries)
            } catch (e) { /* ignore */ }
            updateSimDetailTooltip(resolved, null)
            st.suppressSync = false
        }

        function clearSimDetailCrosshair() {
            var st = simDetailChartState
            if (!st.chart) return
            try {
                st.chart.clearCrosshairPosition()
            } catch (e) { /* ignore */ }
            hideSimDetailTooltip()
        }

        function destroySimDetailChart() {
            var chartEl = document.getElementById('simDetailChart')
            if (chartEl) {
                destroyChart(chartEl._chartInstance)
                chartEl.innerHTML = ''
                delete chartEl._chartInstance
            }
            simDetailChartState.chart = null
            simDetailChartState.lineSeries = null
            simDetailChartState.klineDates = []
            simDetailChartState.priceByDate = {}
            simDetailChartState.guideByDate = {}
            simDetailChartState.tradeByDate = {}
            simDetailChartState.tooltipEl = null
            simDetailChartState.containerEl = null
            simDetailChartState.suppressSync = false
        }

        function mountSimDetailChart(cached) {
            destroySimDetailChart()
            var chartEl = document.getElementById('simDetailChart')
            if (!chartEl) return

            var slice = getSimDetailChartKlines(cached)

            var lineData = slice.map(function (k) {

            simDetailChartState.priceByDate = priceByDate
            simDetailChartState.klineDates = klineDates
            simDetailChartState.guideByDate = guideByDate
            simDetailChartState.tradeByDate = buildSimTradeByDate(cached)
            simDetailChartState.market = market
            simDetailChartState.maLabel = getMaLabel(market)

            whenChartContainerReady(chartEl, function () {
                if (!chartEl.isConnected) return
                var width = Math.max(chartEl.clientWidth, 1)
                var height = Math.max(chartEl.clientHeight, 1)
                var tooltip = document.createElement('div')
                tooltip.className = 'chart-tooltip'
                chartEl.appendChild(tooltip)
                simDetailChartState.tooltipEl = tooltip
                simDetailChartState.containerEl = chartEl

                var chart = LightweightCharts.createChart(chartEl, {
                    width: width,
                    height: height,
                    layout: {
                        background: { color: '#161b22' },
                        textColor: '#8b949e',
                        attributionLogo: false
                    },

                    },
                    rightPriceScale: {

                    },
                    timeScale: {
                        borderColor: '#30363d',
                        timeVisible: true,
                        fixLeftEdge: true,
                        fixRightEdge: true
                    },
                    crosshair: {
                        vertLine: { color: '#58a6ff', width: 1, style: 2, labelVisible: true },
                        horzLine: { visible: false, labelVisible: false }
                    },
                    handleScroll: {
                        mouseWheel: true,
                        pressedMouseMove: true,
                        horzTouchDrag: true,
                        vertTouchDrag: false
                    },
                    handleScale: {
                        mouseWheel: true,
                        pinch: true,
                        axisPressedMouseMove: true
                    }
                })

                var lineSeries = chart.addLineSeries(Object.assign({
                    color: CHART_LINE_COLOR,
                    lineWidth: 2,
                    lastValueVisible: true,
                    priceLineVisible: false
                }, SERIES_LABEL_OPTS))
                lineSeries.setData(lineData)
                lineSeries.setMarkers(buildSimTradeMarkers(slice, simDetailChartState.tradeByDate))
                addSimDetailGuideLines(chart, slice, guideByDate)

                chart.timeScale().fitContent()

                chart.subscribeCrosshairMove(function (param) {
                    if (simDetailChartState.suppressSync) return
                    if (!param.time || !param.point ||
                        param.point.x < 0 || param.point.y < 0 ||
                        param.point.x > chartEl.clientWidth ||
                        param.point.y > chartEl.clientHeight) {
                        clearSimDetailRowHighlight()
                        hideSimDetailTooltip()
                        return
                    }
                    var hoverDate = formatCrosshairTime(param.time)
                    var resolved = resolveSimChartHoverDate(hoverDate, simDetailChartState.klineDates)
                    if (!resolved) {
                        clearSimDetailRowHighlight()
                        hideSimDetailTooltip()
                        return
                    }
                    var rowIndex = findSimRowIndexForDate(resolved, simDetailChartState.rowMeta)
                    if (rowIndex >= 0) {
                        highlightSimDetailRow(rowIndex)
                    } else {
                        clearSimDetailRowHighlight()
                    }
                    updateSimDetailTooltip(resolved, param)
                })

                chartEl.addEventListener('mouseleave', function () {
                    if (simDetailChartState.suppressSync) return
                    clearSimDetailRowHighlight()
                    hideSimDetailTooltip()
                })

                chartEl._chartInstance = chart
                simDetailChartState.chart = chart
                simDetailChartState.lineSeries = lineSeries
            })
        }

        function bindSimDetailTableHover() {
            var bodyEl = document.getElementById('simDetailBody')
            if (!bodyEl || bodyEl.dataset.simHoverBound === '1') return
            bodyEl.dataset.simHoverBound = '1'

            bodyEl.addEventListener('mouseover', function (e) {
                var tr = e.target.closest('tr[data-sim-row]')
                if (!tr || !bodyEl.contains(tr)) return
                var rowIndex = parseInt(tr.dataset.simRow, 10)
                var dateStr = tr.dataset.simDate
                if (isNaN(rowIndex) || !dateStr) return
                simDetailChartState.suppressSync = true
                highlightSimDetailRow(rowIndex)
                setSimDetailCrosshair(dateStr)
                simDetailChartState.suppressSync = false
            })

            bodyEl.addEventListener('mouseleave', function (e) {
                if (e.relatedTarget && bodyEl.contains(e.relatedTarget)) return
                clearSimDetailRowHighlight()
                clearSimDetailCrosshair()
            })

        function appendSimDetailRow(op, index, market, prevPrice) {
            var actionCls = formatSimOperationClass(op, index)
            var actionLabel = formatSimOperationLabel(op, index)
            var valueCls = op.valuePct >= 100 ? 'up' : 'down'
            var priceDeltaHtml = ''
            if (prevPrice != null && prevPrice > 0) {
                var priceChg = ((op.price - prevPrice) / prevPrice) * 100
                var deltaCls
                if (op.action === 'buy') {
                    deltaCls = priceChg >= 0 ? 'down' : 'up'
                } else {
                    deltaCls = priceChg >= 0 ? 'up' : 'down'
                }
                priceDeltaHtml = '<span class="sim-price-delta ' + deltaCls + '">(' + formatPct(priceChg) + ')</span>'
            } else {
                priceDeltaHtml = '<span class="sim-price-delta muted">(--)</span>'
            }
            return {
                html: '<tr data-sim-row="' + index + '" data-sim-date="' + escapeHtml(normalizeTradeDate(op.date)) + '">' +
                    '<td>' + escapeHtml(op.date) + '</td>' +
                    '<td class="' + actionCls + '">' + actionLabel + '</td>' +
                    '<td>' + formatPrice(op.price, market) + priceDeltaHtml + '</td>' +
                    '<td class="' + valueCls + '">' + formatSimValuePct(op.valuePct) + '</td>' +
                '</tr>',
                prevPrice: op.price,
                rowMeta: {
                    index: index,
                    date: normalizeTradeDate(op.date)
                }
            }
        }

        function buildSimDetailControlsHtml(itemId, cached) {
            var klines = cached.klines || []
            var tradingDates = getSimTradingDates(klines)
            if (!tradingDates.length) return ''
            var bounds = getSimEntryDateBounds(klines)
            var entryDate = normalizeSimEntryDate(klines, cached.entryStartDate || bounds.minDate)
            cached.entryStartDate = entryDate
            var options = ''
            var i
            for (i = tradingDates.length - 1; i >= 0; i--) {
                var d = tradingDates[i]
                options += '<option value="' + escapeHtml(d) + '"' + (d === entryDate ? ' selected' : '') + '>' +
                    escapeHtml(d) + '</option>'
            }
            return '<div class="sim-detail-entry-row">' +
                '<label class="sim-detail-entry-label" for="simEntryDateSelect">买入时间</label>' +
                '<select class="sim-detail-entry-input" id="simEntryDateSelect"' +
                    ' data-item-id="' + escapeHtml(itemId) + '">' +
                    options +
                '</select>' +
            '</div>'
        }

        function buildSimDetailTableHtml(cached) {
            var sim = cached.detailSim || cached.sim
            var market = cached.market
            var ops = sim.operations || []
            if (!ops.length && !sim.holdingAtEnd) {
                simDetailChartState.rowMeta = []
                return '<div class="sim-detail-empty">模拟期内无买卖操作</div>'
            }
            var rows = ''
            var prevPrice = null
            var rowMeta = []
            ops.forEach(function (op, index) {
                var row = appendSimDetailRow(op, index, market, prevPrice)
                rows += row.html
                rowMeta.push(row.rowMeta)
                prevPrice = row.prevPrice
            })
            if (sim.holdingAtEnd) {
                var markPrice = cached.price != null && !isNaN(cached.price) ? cached.price : sim.holdPrice
                var holdValuePct = sim.holdValuePct
                if (markPrice != null && sim.holdPrice > 0 && markPrice !== sim.holdPrice) {
                    holdValuePct = sim.holdValuePct * (markPrice / sim.holdPrice)
                }
                var holdDate = formatDateISO(new Date())
                var holdRow = appendSimDetailRow({
                    date: holdDate,
                    action: 'holding',
                    price: markPrice,
                    valuePct: holdValuePct
                }, ops.length, market, prevPrice)
                rows += holdRow.html
                rowMeta.push(holdRow.rowMeta)
            }
            simDetailChartState.rowMeta = rowMeta
            return '<table class="sim-detail-table">' +
                '<thead><tr><th>交易日期</th><th>操作</th><th>成交价</th><th>账户净值</th></tr></thead>' +
                '<tbody>' + rows + '</tbody>' +
            '</table>'
        }

        function confirmRemoveWatchlistItem(name) {
            return new Promise(function (resolve) {
                if (confirmDialogOpen) {
                    resolve(false)
                    return
                }
                var overlay = document.getElementById('confirmOverlay')
                var messageEl = document.getElementById('confirmMessage')
                var okBtn = document.getElementById('confirmOk')
                var cancelBtn = document.getElementById('confirmCancel')
                if (!overlay || !messageEl || !okBtn || !cancelBtn) {
                    resolve(window.confirm('确定从关注移除「' + name + '」吗？'))
                    return
                }

                confirmDialogOpen = true
                messageEl.textContent = '确定从关注移除「' + name + '」吗？'
                overlay.classList.add('show')

                function cleanup(result) {
                    confirmDialogOpen = false
                    overlay.classList.remove('show')
                    okBtn.removeEventListener('click', onOk)
                    cancelBtn.removeEventListener('click', onCancel)
                    overlay.removeEventListener('click', onOverlayClick)
                    document.removeEventListener('keydown', onKeydown)
                    resolve(result)
                }

                function onOk() { cleanup(true) }
                function onCancel() { cleanup(false) }
                function onOverlayClick(e) {
                    if (e.target === overlay) cleanup(false)
                }
                function onKeydown(e) {
                    if (e.key === 'Escape') cleanup(false)
                }

                okBtn.addEventListener('click', onOk)
                cancelBtn.addEventListener('click', onCancel)
                overlay.addEventListener('click', onOverlayClick)
                document.addEventListener('keydown', onKeydown)
                cancelBtn.focus()
            })
        }

        var CARD_LAYOUT_BREAKPOINT = 680
        var cardLayoutObserver = null
        var cardRightLayoutObserver = null

        function shouldStackCardLayout(card) {
            var w = card.clientWidth
            if (w <= 0) return true
            return w < CARD_LAYOUT_BREAKPOINT
        }

        function updateCardLayout(card) {
            if (!card || !card.classList.contains('card')) return
            if (!card.querySelector('.card-body')) return
            card.classList.toggle('card-narrow', shouldStackCardLayout(card))
            var cardId = card.id.replace(/^card-/, '')
            if (!cardId) return
            var miniEl = document.getElementById('mini-' + cardId)
            if (!miniEl) return
            whenChartContainerReady(miniEl, function () {
                refreshChartLayout(miniEl)
            })
        }

        function initCardRightLayoutObserver() {
            if (cardRightLayoutObserver || !window.ResizeObserver) return
            cardRightLayoutObserver = new ResizeObserver(function (entries) {
                entries.forEach(function (entry) {
                    var right = entry.target
                    var card = right.closest('.card')
                    if (!card) return
                    var cardId = card.id.replace(/^card-/, '')
                    if (!cardId) return
                    var miniEl = document.getElementById('mini-' + cardId)
                    if (!miniEl) return
                    requestAnimationFrame(function () {
                        refreshChartLayout(miniEl)
                    })
                })
            })
        }

        function initCardLayoutObserver() {
            if (cardLayoutObserver || !window.ResizeObserver) return
            cardLayoutObserver = new ResizeObserver(function (entries) {
                entries.forEach(function (entry) {
                    updateCardLayout(entry.target)
                })
            })
        }

        function observeWatchlistCards() {
            initCardLayoutObserver()
            initCardRightLayoutObserver()
            watchlistContainer.querySelectorAll('.card').forEach(function (card) {
                updateCardLayout(card)
                if (cardLayoutObserver && !card.dataset.layoutObserved) {
                    card.dataset.layoutObserved = '1'
                    cardLayoutObserver.observe(card)
                }
                var right = card.querySelector('.card-right')
                if (right && cardRightLayoutObserver && !right.dataset.layoutObserved) {
                    right.dataset.layoutObserved = '1'
                    cardRightLayoutObserver.observe(right)
                }
            })
        }

        function ensureCardBody(cardEl) {
            var bodyEl = cardEl.querySelector('.card-body')
            if (bodyEl) return bodyEl
            bodyEl = document.createElement('div')
            bodyEl.className = 'card-body'
            var leftEl = cardEl.querySelector('.card-left')
            if (leftEl) {
                cardEl.insertBefore(bodyEl, leftEl)
                bodyEl.appendChild(leftEl)
            } else {
                cardEl.appendChild(bodyEl)
            }
            return bodyEl
        }

        function updateWatchlistCardSilent(cardEl, item, data) {
            var bodyEl = ensureCardBody(cardEl)
            var leftEl = bodyEl.querySelector('.card-left')

                leftEl = document.createElement('div')
                leftEl.className = 'card-left'
                bodyEl.insertBefore(leftEl, bodyEl.firstChild)
            }

            if (data.error) {

                if (rightEl) rightEl.remove()
                if (miniCharts[item.id]) {
                    destroyChart(miniCharts[item.id])
                    delete miniCharts[item.id]

                delete watchlistDataCache[item.id]
                delete watchlistPriceCache[item.id]
                delete watchlistIntradayCache[item.id]
                delete watchlistMetaCache[item.id]
                delete watchlistMutualFundCache[item.id]

                return
            }

            var rightEl = bodyEl.querySelector('.card-right')

            if (!rightEl) {
                var temp = document.createElement('div')
                temp.innerHTML = '<div class="card-right">' +
                    buildChartTabsHtml(chartMode, item.id) +
                    '<div class="mini-chart" id="mini-' + escapeHtml(item.id) + '"></div>' +

        function syncWatchlistCardsContainer(list) {
            var cardsEl = watchlistContainer.querySelector('.cards')
            if (!cardsEl) {
                watchlistContainer.innerHTML = '<div class="cards"></div>'
                cardsEl = watchlistContainer.querySelector('.cards')
            }

            var listIds = {}
            list.forEach(function (item) { listIds[item.id] = true })

            cardsEl.querySelectorAll('.card').forEach(function (card) {
                var id = card.id.replace(/^card-/, '')
                if (!listIds[id]) {
                    clearWatchlistItemCache(id)
                    card.remove()
                }

            list.forEach(function (item) {
                if (!document.getElementById('card-' + item.id)) {
                    var card = document.createElement('div')
                    card.className = 'card'
                    card.id = 'card-' + item.id
                    card.innerHTML = buildRemoveBtn(item) +
                        '<div class="card-left"><div class="card-loading">' + buildLoadingHtml(formatLoadingLabel(item.market, item.symbol)) + '</div></div>'

        async function renderWatchlist(options) {
            options = options || {}
            var silent = !!options.silent
            var list = getWatchlist()

            if (list.length === 0) {
                clearWatchlistCharts()
                watchlistContainer.innerHTML = getWatchlistEmptyHtml()
                return
            }

            if (silent) {
                syncWatchlistCardsContainer(list)
            } else {
                clearWatchlistCharts()
                watchlistContainer.innerHTML = '<div class="cards">' +
                    list.map(function (item) {
                        return '<div class="card" id="card-' + item.id + '">' +
                            buildRemoveBtn(item) +
                            '<div class="card-loading">' + buildLoadingHtml(formatLoadingLabel(item.market, item.symbol)) + '</div></div>'
                    }).join('') +
                '</div>'
            }

            for (var i = 0; i < list.length; i++) {
                var item = list[i]
                var cardEl = document.getElementById('card-' + item.id)
                if (!cardEl) continue

                if (silent && cardEl.querySelector('.card-right')) {
                    var data = await loadCardData(item, options)
                    cardEl = document.getElementById('card-' + item.id)
                    if (!cardEl) continue
                    updateWatchlistCardSilent(cardEl, item, data)
                } else {
                    await loadAndMountWatchlistCard(item, options)
                }
            }

            observeWatchlistCards()
            updateAllCardSortBtnStates()
        }

                    currentPrice: watchlistPriceCache[cardId],

                    isMutualFund: !!watchlistMutualFundCache[cardId],
                    productMeta: buildFundProductMetaFromCache(cardId)
                }

                if (mode === 'today') {
                    trySwitchToTodayChart({
                        meta: Object.assign({}, meta, {
                            market: chartOpts.market,

                        intraday: chartOpts.intraday,
                        chartEl: miniEl,
                        productMeta: chartOpts.productMeta,
                        onSuccess: function (intraday) {
                            cardChartModes[cardId] = mode
                            activateChartTabs(tabsEl, mode)
                            watchlistIntradayCache[cardId] = intraday
                            chartOpts.intraday = intraday
                            miniCharts[cardId] = renderChart(miniEl, watchlistDataCache[cardId] || [], mode, chartOpts)
                        }
                    })
                    return
                }

                cardChartModes[cardId] = mode
                activateChartTabs(tabsEl, mode)
                miniCharts[cardId] = renderChart(miniEl, watchlistDataCache[cardId] || [], mode, chartOpts)
            })
        }

        function bindSortButtonDelegation() {
            if (sortDelegationBound) return
            sortDelegationBound = true
            watchlistContainer.addEventListener('click', function (e) {
                var btn = e.target.closest('.card-sort-btn')
                if (!btn || btn.disabled) return
                e.preventDefault()
                e.stopPropagation()
                var id = btn.dataset.id
                var dir = btn.dataset.dir
                if (!id || !dir) return
                moveWatchlistItem(id, dir)
            })
        }

        function bindRemoveButtonDelegation() {
            if (removeDelegationBound) return
            removeDelegationBound = true
            watchlistContainer.addEventListener('click', function (e) {
                var btn = e.target.closest('.remove-btn')
                if (!btn) return
                e.preventDefault()
                e.stopPropagation()
                var id = btn.dataset.id
                var name = btn.dataset.name || id
                confirmRemoveWatchlistItem(name).then(function (ok) {
                    if (!ok) return
                    removeWatchlistCardFromUi(id)
                })
            })
        }

        /* ===== 初始化 ===== */
        function startAutoRefresh() {
            if (refreshTimer) clearInterval(refreshTimer)
            refreshTimer = setInterval(function () {
                if (getWatchlist().length > 0) renderWatchlist({ silent: true })
            }, REFRESH_INTERVAL)
        }

        searchForm.addEventListener('submit', handleSearch)
        if (randomSearchBtn) randomSearchBtn.addEventListener('click', handleRandomSearch)
        refreshBtn.addEventListener('click', function () {
            if (refreshBtn.disabled || getWatchlist().length === 0) return
            refreshBtn.disabled = true
            refreshBtn.classList.add('is-loading')
            renderWatchlist().finally(function () {
                refreshBtn.disabled = false
                refreshBtn.classList.remove('is-loading')
            })
        })

        window.addEventListener('resize', scheduleChartLayoutRefresh)

        bindSortButtonDelegation()
        bindRemoveButtonDelegation()
        bindChartTabDelegation()
        bindDetailChartTabDelegation()
        bindSimDetailDialog()
        bindStrategyDialog()
        bindHoldPositionControls()
        initMarketSelect()
        initSidebarCollapse()
        renderWatchlist()
        startAutoRefresh()
    })()
    </script>
</body>
</html>
